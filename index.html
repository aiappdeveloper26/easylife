<script>

let L='zh';try{L=localStorage.getItem('sm_l')||'zh'}catch(e){}
const T=s=>{const a=s.split('|');return a.length>1&&L=='en'?a[1]:a[0]};
const AN=['鼠|Rat','牛|Ox','虎|Tiger','兔|Rabbit','龍|Dragon','蛇|Snake','馬|Horse','羊|Goat','猴|Monkey','雞|Rooster','狗|Dog','豬|Pig'];

function wv(sun,x,asc){const a=mod(x-sun,12),h=mod(x-(asc==null?sun:asc),12)+1,A={0:.5,2:1,10:1,3:-1,9:-1,4:1.5,8:1.5,6:-1.5}[a]||0,hb=[1,5,9,10,11].includes(h)?.5:[8,12].includes(h)?-.5:0,S=[[5,7],[10,6],[2,11],[1]];return{h,v:[3+A+hb,...S.map(z=>3+A*.6+(z.includes(h)?1:0))]}}
const jupI=(y,m)=>{const t=(Date.UTC(y,m-1,1,4)/864e5+2440587.5-2451545)/36525,r=Math.PI/180,M=(20.02+3033.29*t)*r,Lh=(34.351+3034.9057*t+5.555*Math.sin(M)+.168*Math.sin(2*M))*r,R=5.2026-.2517*Math.cos(M),n=t*36525,g=(357.528+.9856003*n)*r,Le=(mod(280.46+.9856474*n+1.915*Math.sin(g)+.02*Math.sin(2*g),360)+180)*r;return Math.floor(mod(Math.atan2(R*Math.sin(Lh)-Math.sin(Le),R*Math.cos(Lh)-Math.cos(Le))/r,360)/30)};

const QD=[["大吉","巍巍獨步向雲間，玉殿千官第一班，\n富貴榮華天付汝，福如東海壽如山。","功名遂、福祿全、訟得理、病即痊、桑麻熟、婚姻圓、孕生子、行人還。","問應考功名，表示金榜題名的好兆，富貴榮華天賜予。\n問訴訟，表示得直。\n問生病，可以痊癒。\n問婚姻，表示美滿。\n問求財，卻不免有落空的感覺。","此籤 謀望事緒，無不遂意，但各有所主，官員占此，有超越之喜，士人有功名之慶，占前程者，福壽綿長，占事業者，根基穩固，若謀望求財，多主有名無實，為 語多空虛也。","雲間。青雲之上也。巍巍獨步。許其足踏青雲也。玉殿千官。乃是天曹仙吏。第一班。仙吏之最貴者也。榮華富貴。自天作主。天已付之。自然福壽無涯。如海。言福之廣遠。如山。言壽之堅永。上上大吉。須要人地相當則應。","猶如平步青雲，一切皆可如願實現，不論是福、祿、壽、喜，都能圓滿，並且有超越的現象，可拔得頭籌。自然而然地就能享有榮華富貴，這都是上天所給予的恩惠，所的恩澤相當浩大，福氣如海之無涯，壽如山之雋永，必須懂得珍惜。可說是得到了天時的配和，只要再加上地利及人和，則無往不利，是上上籤。","雲間獨步、拔萃超群、名登甲第、談笑功勳。終身光顯、皆天所相、祿厚壽高、意稱謀望。","月里攀丹桂、成名步玉畿、求謀皆稱意、萬事足無疑。","一士人問功名，占此，自謂非會，即狀久而始第。會試、殿試兩科，通榜序齒，皆第一授官山東，由知縣歷州、府、司、道以至撫台，皆不離山東，應在末句。","運勢：大吉之時，時與之也，掌握時運，可大豐收。\n家庭：平時修善，心誠求之，辛勤忍受，喜獲麟兒。\n財利：辛苦經營，胼手胝足，幸勿欺心，必有大利。\n事業：交春即發，公道交易，駿業宏展，致陶朱富。\n升遷：吾身修之，人人仰之，人多喜慶，舉家豫順。\n姻緣：兩姓合婚，互可攀也，珍惜姻緣，占之大吉。\n考試：吉人天相，勤心用功，勿忘力行，必有大獲。\n健康：善養吾身，加之積善，神靈庇佑，災厄皆去。\n遠行：海陸均行，步步小心，和氣致祥，獲利回梓。\n訴訟：無妄之災，橫加於身，天理自有，未必畏懼。\n失物：不慎遺落，並未損害，再過匝月，必回身邊。","漢高祖入關\n漢高祖，姓劉名邦，字季，沛人也。其時秦法苛暴，天下皆叛。楚人項羽起義，立懷王孫心，高祖率沛中子弟以從。諸侯兵皆西鄉(向)回攻秦，約以先入關者王之。獨高祖先入秦關，除苛法，與父老約法三章，秦民大悅，秦王子嬰素車白馬出軸道以降。\n十八學士登瀛洲\n李世民於秦王府開設文學館，招攬儒士，立十八學士。後文學館升格翰林院，又開科取仕，一片昇平景象。瀛洲指仙山，登瀛洲即上仙山。十八學士登瀛洲，指山雞變鳳凰。"],["上吉","盈虛訊息總天時，自此君當百事宜，\n若問前程歸縮地，更須方寸好修為。","訟宜和、病宜禱、功名有、遲莫躁、求財平、問婚好、若妄為、身莫保。","求謀不宜過急，所謂欲速則不達，且須等待時機，不可速進，方可成就。\n問應考功名，有希望，但不可心燥，求財平平，做事業宜按步就班，不可好高騖遠，才不致失敗，總之，不妄動，再正心修德，自然安泰。\n問婚姻，表示有成功的希望。\n問訴訟，則和解為宜。\n問疾病，則宜多禱告神明保佑。","此籤 前運不佳。前事蹭蹬。自此以後。漸見順利。若問究竟歸結。全在存心種德。方得成實。倘值境遇遂意。頓忘前因。暗損心術。必至有始無終。自貽後悔。勉之慎之。","盈虛訊息。天運之常。人生窮通得喪。亦似此無有定在。言占者曾未遇時也。自此相宜。困極而亨。所謀遂意也。前程歸縮。是收成結果之地。方寸修為。戒占者勿損心田。勿害 天理。及早積德修因。遂終有慶矣。君子修之吉。小人悖之凶。唯所自擇何如耳。","曾經遇到不順遂的過去，到現在也該是轉運的時候了，之後會漸入佳境，但不可因此而驕縱。如能從心做起，隨時隨地都能發出善的念頭，積累福蔭，必會有美好的未來。此籤 的 重點在於心裡的想法，如能以善念出發，必能排除萬難達成目標，但如有偏斜的歹念，則會為自己招來厄運，不可不慎。","萬事乘除、隨時而處、否極泰來、事無齟齬。收成結果、方寸修為、切莫妄動、萬福來宜。","禍福從天降、存心萬事宜、若還無妄作、禍散福相隨。","一少年患弱病，占此。殞歿，竟棄人間，應在“前程歸縮地”一句。\n又一人問行人，占此。不數日，其人兼程而至，亦“縮地”之應也。\n又一人問執業，占此。奔走四方，靡有生涯。後遇一選課者傳授心法，乃遁跡潯江(今晉江市龍湖鎮衙口村)，自開擇日館，研究趨吉避凶之術頗精。上二句甚驗。","運勢：景氣低迷，唯吾獨秀，逢及時運，宜惜之福。\n家庭：瑞氣滿堂，和氣充廳，自有天助，添丁進財。\n財利：金銀滿屋，福星拱照，事事順利，守之為要。\n事業：當前紅時，隨押即著，財氣大通，唯能守之。\n升遷：天時予之，君百事宜，平素養身，自有吉利。\n姻緣：天賜良緣，羨煞四鄰，百年和合，謝於天地。\n考試：十年寒窗，一舉成名，惜福至上，方得持久。\n健康：不宜貪逸，食樂有度，自益身心，原理明之。\n遠行：為人忠信，貴人扶之，小心路程，必獲平安。\n訴訟：雖遇凶漢，惟守良心，天理昭昭，必有助益。\n失物：去也不明，唯其物也，可失而復，甚為微妙。","張子房遊赤松\n子房名良，韓國公子。博浪沙事(指行弒秦始皇)後，(張良)匿下邳。遊圯上，遇衣褐老夫墮履命取，良跪進之。老父曰：“孺子可教。”越五日，授以太公兵法，謂“後十三年，濟北穀城山下黃石即我也。”後良佐(漢)高祖定天下，封留侯，因感鳥盡弓藏，謝病歸。入白雲山，師事黃石，號赤松子。"],["中吉","衣食自然生處有，勸君不用苦勞心，\n但能孝悌存忠信，福祿來成禍不侵。","問名利、自有時、訟和吉、產尚遲、病可治、婚未宜、宜謹守、免憂疑。","命裡有時終須有，命裡無時莫強求。\n問謀事，雖有成功的希望，但時間上恐久延。\n談婚姻，在時間上也是比較遲延。\n問訴訟，則以和解為宜。\n問疾病，目前還無法痊癒，尚須待一段時間。","此籤 只宜守舊。不可貪求。但存中直。卻得兩平。須以孝悌忠信為本。自有福祿來成之應。若思強取強求。反招意外之禍。占者循理守分則吉。","衣食自然。言衣食各有定分。生處有。言系人生命理所載。不可強也。不用勞心。勸人安分。孝悌忠信。勸人務本。孝悌所以盡倫。忠信所以處事。如此為人。自蒙上天鑒佑。福祿來成。言福集而祿臻。俯仰稱意。禍不侵。凡事有吉無凶也。全在修為。不可背本。慎之。","人生自然該有的衣食住行，在冥冥中自有定數，該吃多少、該用多少，都有一定的份量，不可太過強求，如果一餐吃一碗飯就飽了，一時貪心吃了兩碗，也只有苦了自己的肚子了。如果能從人倫的孝悌做起，對上盡忠，為人誠信，相信福祿自會天成，禍患與你無緣。此籤 重在自我的修養，謹記孝悌忠信，則必能去災解厄，吉運自現。","富貴前定、何須強求、徒勞心力、反致傷憂。事親待人、動合循理、天必佑之、有泰無否。","隨緣安分、直道而行、心中無愧、自然和平。","一生赴考遺才，占此，得收錄。應在“衣食自然生處有”一句，蓋宗師正科舉之生處也。\n又(清)道光間，一人自恃有財，圖謀官爵，已捐同知矣。一日忽欲指浙江候補，故到廟占此。人勸其作富家翁，不聽。鏇赴該省候委，百計營求，始有差事。因延緩多日尚未動身，大憲責其怠慢，截留改委。勞碌數年金盡，求裘敝體，歿於旅寓，不得回家。上二句之應也。","運勢：早春之時，令人寂寞，夏至即活，不宜冒險。\n家庭：丁旺口盛，唯身必健，方得幸福，必能平安。\n財利：雖用心苦，時之不與，莫可奈何，今春即轉。\n事業：起初不順，一時靈感，起死回生，出乎意外。\n升遷：必須致力，吾身自重，本不甚硬，己身健之。\n姻緣：合之始也，如同路人，久而久之，待時見之。\n考試：一次未中，再接再厲，不可餒志，三次即中。\n健康：原因出己，悔不當初，所幸遇藥，選對治痊。\n遠行：出之可行，唯勿勉強，強行招殃，不可不慎。\n訴訟：本是芝麻，延伸大火，可收拾也，先冷靜己。\n失物：一時不慎，遺落於西，半回半失，嗣後小心。","賈誼遇漢文帝\n漢朝賈誼，洛陽人。文帝時河南守吳薦之，後為博士。年二十餘超遷，歲中至大中大夫。請改正朔，興禮樂，上《治安策》。絳、灌等毀之，出為長沙王太傅。誼既謫去，渡湘水作賦，吊屈原。論者謂：賈生，王佐才，遇漢文明主，終不大用，卒悲傷而死，豈非天(意)乎?"],["下下","去年百事頗相宜，若較今年時運衰，\n好把瓣香告神佛，莫教福謝悔無追。","功名滯、求祿輕、訟不宜、婚難成、病難愈、行阻程、若求吉、禱神明。","人無遠慮，必有近憂。\n問謀望，表示很難達成。\n問求財交易，表示無利可圖。\n問訴訟，蓋訟則凶。\n問疾病，很難痊癒，只有禱告神明，祈求保佑。\n問婚姻，成功希望渺茫。","此籤 吉事已去。凶禍將來。官事臨身。是非自至。凡事謀望不成。求財交易不就。所為皆不利。急宜祈禱神明。積德回天。庶不致貽後悔耳。","去年相宜。已往之吉。今年運衰。見在之凶。瓣香告神。勸人早植善果。感格神明。庶可轉禍為福。若無神佛扶持。則福力衰謝。殃咎並臨。佇見噬臍之悔。將何及哉。占者宜早修省也。","去年的運勢相當順遂，幾乎想做的事都可以成功，相較於今年，則出現了明顯的衰運，這就是人生，可見的厄運是無法避免了，該如何將傷害減至最低呢?不如誠心的禱告神明，以誠摯的心焚香膜拜，如能得到神佛的幫助，則能轉危為安、轉禍為福，若無真心祈求，禍患無法避免，將後悔莫及，還是儘早修為吧!","先吉後凶、時運將否、謀事無成、頓非前比。秉誠禱神、以求福祉、若無遠慮、悔無及己。","好事從前過、時衰禍漸來、頂天並拜地、庶可保無災。","一人平日許下香願，後患病，占此。輒以未酬香願，為疑不及禱而死。“瓣香告神佛”，“福謝悔無追”，二語靈甚。","運勢：客年順境，今卻逆轉，一時之運，不宜餒志。\n家庭：先調和身，乃言懷之，有孕更慎，神必佑之。\n財利：平凡即幸，日日作之，三餐火煙，即可滿足。\n事業：度小月也，命中之定，不可逆也，靜待時運。\n升遷：人人各方，或大或小，各自治之，方可平安。\n姻緣：見即不合，明知不可，即宜止之，不宜強求。\n考試：雖是勤讀，要領不得，壓三出四，明年再試。\n健康：年逾還歷，明知有疾，不宜殘害，宜珍惜之。\n遠行：不可行也，尤為夏季，土崩地裂，不必勉強。\n訴訟：區區之數，設法償之，為此告之，傷身心已。\n失物：在陽方失，此失不回，已見兆頭，重買可也。","小秦王三跳澗\n小秦王即唐太宗李世民。(李世民)伐劉武周時，被其部將尉遲恭所迫，三跳澗而逃，幾乎不免，幸遇秦叔寶救之。"],["中平","子有三般不自由，門庭蕭索冷如秋，\n若逢牛鼠交承日，萬事回春不用憂。","財祿耗、功名遲、訟終吉、病可醫、婚宜慎、行人歸、待時至、百事宜。","暗示先憂後喜，先凶後吉。\n問求財，目前無利，不過將來有利。\n問疾病，可醫治，有痊癒的希望。\n問升遷，主有遷移之兆。\n問婚姻，須慎重考慮。","此籤 先憂後喜。見在主意不定。進退無據。景況甚為冷落。等子醜交承之際。遠應年分。近應月日。自有更新氣象。如春來萬物發生。此前大不相同。凡事待時。終有成就。","三般句。有二解。一作心口意。三者游移不定。一作富貴壽。三者杳茫無據。總是不能自主之意。秋景冷落。門庭似此。蕭索可知。牛鼠交承。乃是子丑接續之際。言有好光景在後。至此才得遂意。萬事回春。言事事起發。如草木春日向榮。皆足賞心悅目。何憂之有哉。現須耐守為吉。","此時的你是萬事都無法隨心所欲，就算是連最簡單的溝通，都是詞不達意，連朋友都忘了有你這個人的存在，可說是冷到了極點。厄運總是會結束的，只要過了子丑的交接轉換，就會有美好的未來，會猶如春天的來到，將不必憂愁，此時只是日出前的黑暗。子丑交換最久可能是鼠牛年的交換，也可能是鼠牛月或鼠牛日的交換，不論還要多久必須忍耐，迎接美好的未來。","榮枯有時、不由人力、泰運將亨、終於否極。月日子醜、凡事皆吉、如木逢春、才見榮益。","事有不如意、常存忍耐心、時來皆順受、福至禍無侵。","一生歲試占此，居三等，驗在“三般不自由”一句。若值子醜寅月日，又不當以此斷之。\n又有一生科試占此，縣、府、院三處皆取，應“子有三般”;臨場丁母憂，應“門庭蕭索”。\n又一生，院試前占此。放榜之日，竟取進，應“子有”兩字也。","運勢：平凡之命，平衡收支，景氣不宜，即可滿足。\n家庭：人人平安，惟無凸出，亦復何書，平凡足矣。\n財利：勤業之人，本有報酬，惟時不濟，只好忍受。\n事業：興與衰交，令人無奈，世況如此，只好忍之。\n升遷：調養吾身，以備戰鬥，耗費身心，方可勝算。\n姻緣：平凡夫妻，亦可足矣，命中注定，啻好認之。\n考試：勤再拼也，或時運衰，不見曙光，明必有中。\n健康：一度歷險，幸及時醫，不宜迷之，人智清醒。\n遠行：可行者也，但願小心，豈可冒險，該回即回。\n訴訟：告官損己，利於仲介，伊亦為財，不必意氣。\n失物：失於東南，宜省吾心，己之過失，物者尚存。","呂蒙正守困\n宋(朝)呂蒙正，字聖初，河南人。父龜圖與母不合，並蒙正皆逐之。時貧甚，投跡龍門寺僧，鑿山岩為龕，禁足不出，守困數年。太宗時，舉廷試第一，三歷相府，以直道自持，拜太師，致仕歸，累封許國公。卒謚文穆。"],["下下","何勞鼓瑟更吹笙，寸步如登萬里程，\n彼此懷疑不相信，休將私意憶濃情。","功名無、財祿散、病難痊、防產難、婚不成、訟未判、行人遲、空嗟嘆。","問合夥事業，不是拆夥就是合夥不成的預兆。\n問婚姻，也是沒有成功的希望。\n問功名，沒有希望。\n問疾病，難痊癒。\n問求財，無利可圖。\n問訴訟，凶多吉少。","此籤 謂之陽為君子。陰為小人。須防有面是背非之人。從此簸弄。彼此懷疑不信。前此濃情。今已中變。何用私意繫戀。自取煩惱。凡事撥開迷妄則吉。","鼓瑟吹笙。小雅宴嘉賓之詩也。茍非其人。何勞為此。寸步萬里。言覿面不能相識。彼此懷疑。此人已不可交。此事已不可就。即應當幾立斷。若更以私意。憶彼濃情。不唯徒勞罔功。必將更受其累。休將二字。禁止之詞。戒占者急當自悟也。","雖然你以很熱忱的心與人交往，但對方卻是個裡外不一的人，看起來和你是那么近的距離，但卻永遠也無法知道對方在想什麼，顯得相當陌生。如果你還陷在過去的濃情蜜意之中，將自己沉浸在過去，將萬劫不復，因為彼此已經產生了懷疑，倒不如就此放下，不必再為此事或此人努力，或許傷害就到此為止，及早清醒才是。","凡事勞心、有退無進、謀望不成、懷疑不信。求合未合、將圓未圓、只宜守己、不宜變遷。","兩下懷疑、咫尺萬里、何用綢繆、從此中止。","此占凡事皆不遂意，科名亦然。惟福建泉州府一曾生占此，中副車，蓋應在“寸步如登”之句也。","運勢：不濟之年，四兩命也，勝萬斤力，不宜冒險。\n家庭：人皆啷啾，無人突出，只為家計，令人鼻酸。\n財利：雖是勞心，勞力赴之，皆歸原頭，兩手皆空。\n事業：存欺人心，天在操之，資本耗盡，空空如也。\n升遷：出自命中，無子女命，惟科技昌，不妨試之。\n姻緣：不合姻緣，該分手去，以免遺憾，命中注定。\n考試：己功名絕，不宜再想，改行可也，行行狀元。\n健康：年逾耄耋，尚有一息，唯賴藥器，恐難復之。\n遠行：是地不毛，明知不可，不宜勉強，傷我身心。\n訴訟：清夜捫心，明知勝敗，不宜再戰，揠旗息鼓。\n失物：已無著也，物小難覓，宜自省之，訓勉已可。","相如完璧歸趙\n戰國時期，藺相如，趙人也。時趙有良璧，秦請易以十五城。相如奉璧入秦，而秦負約。相如將璧先使舍人懷歸，以理折服秦王，完璧歸趙。相如在趙，秦終不能勝趙。"],["大吉","仙風道骨本天生，又遇仙宗為主盟，\n指日丹成謝巖谷，一朝引領向天行。","圖名遂、求財豐、訟得理、病不凶、行人至、夢飛熊、陰地吉、婚姻全","問疾病，求得此簽，表示當有名醫來治，在一個月內可以治好，否則即有仙逝之兆。","此籤貴人占之。有薦拔之喜。仕人占之。有飛騰之兆。庶人占之。有百倍之利。方外占之。有仙升之期。病患占之。有醫藥之緣。亦恐有正應反應不同。占者審之。","耕稼無收。指往事失意。今歲有秋。指現在利益。太平日。大有俯仰優遊之樂。百無憂。統言士農工商之儔。占此者。人人獲吉。事事如意。喜氣洋溢之兆也道骨天生。夙有道緣也。仙宗主盟。仙階得路也。指日丹成。沖舉當在指顧間。引領向天。身在雲霄之上矣。方士占之。上上大吉。文士當系玉堂清品。他事則嫌空幻。未可全以吉斷。","比別人幸運的是天生就有道緣，而且又遇到高人的指點，可以很順利的尋得求道之路，而且可以一路順遂，得到不錯的成就。此簽又可解為求醫者可求得良藥，但又有仙升，即作古升天之意，故求籤者要小心處置。此簽雖是大吉，但除了以上所提之事，對其餘事情幾乎都無任何影響，所以不可全部判斷為大吉簽。","天生富貴、況得神助、凡骨成仙、升騰雲路。庶人遇貴、財物皆聚、百事大吉、何必疑慮。","問病三日內、須逢好手扶、若還求富貴、雲路是亨途。","(清)世宗時，羽士陶仲文占得此簽後，以方技遭際，歷官禮部尚書，封恭安伯。","運勢：今年時來，事事如意，惟叵得意，忘卻自製。\n家庭：數代修來，家丁皆健，合者成之，家譽曰隆。\n財利：企謀皆正，對中民需，凡事如意，難得時運。\n事業：心存公平，誠心交易，信用鞏固，萬商雲集。\n升遷：必平安也，自我攝養，切改妒心，宜慎行動。\n姻緣：允可許身，終生可靠，天賜良緣，不宜猶豫。\n考試：天生聰穎，且己勤脩，舉凡大考，皆占鱉頭。\n健康：雖是罹疾，逢遇高醫，起手回春，未必擔憂。\n遠行：可行之時，惟自小心，時節適宜，平安歸來。\n訴訟：無理取鬧，顯違天理，信心十足，毋須操心。\n失物：遺落北方，物尚俱存，速往覓尋，必完整也。","呂洞賓煉丹\n唐呂岩(或作“巖”、“喦”、“嵒”)，字洞賓，天寶十四年四月十四日巳時生，自號純陽子，由進士授江州德化縣令。私行廬山，遇鍾離真人，授天仙劍法(一說遇火龍真人，授天遁劍法)，得九九數。學金丹之術，居深山中煉丹。丹成，長生不老。多往來湘鄂間，滕守宗諒嘗遇諸岳陽樓，自稱華州道人。"],["上上","年來耕稼苦無收，今歲田疇定有秋，\n況遇太平無事日，士農工賈百無憂。","士領薦、人獲財、訟則解、病無災、問行人、即便回、謀望吉、喜慶來。","先凶後吉之兆。即所謂否極泰來，時來運轉是也。\n問謀望，此簽吉，喜慶來，問行人，即便回。\n問疾病，當無災。\n問訴訟，先憂後喜。\n問財利，將獲財。\n問考試功名，秋期有望。","此簽宜安常守分。前雖困頓。今漸有成。譬如田疇。既有荒歉。亦有豐收。幸處光天化日之下。農工商賈。共享昇平。何憂之有。凡事安享自然。時日以秋季為斷 。","耕稼無收。指往事失意。今歲有秋。指現在利益。太平日。大有俯仰優遊之樂。百無憂。統言士農工商之儔。占此者。人人獲吉。事事如意。喜氣洋溢之兆也。","過去的努力似乎都沒有收穫，只要再持續下去，今年必定會有結果，而且是不錯的回收。田裡的收成，完全要靠老天爺的幫忙，適逢風調雨順，得以豐收，各行各 業也因此而有所斬獲。\n此簽表示即將有所收穫，不管之前有多么不順遂，到此又是另一番景象，要好好把握，也表示以前的努力，現在才開始要回收，將會有美好的未來。","凡事求謀、昔否今泰、時運將亨、有喜無害。士農工商、悉逢嘉會、財物倍收、普均內外。","昔否今逢泰、謀為耐始終、休論貧與富、從此盡亨通。","一生歲考占此，案居三等，應“太平無事”四字，蓋三等乃平過地位也。\n又一生類考占此，案居一等，因起復候廩，應“定有秋”二句。","運勢：巧遇貴人，吉人天相，事事出意，可欣可賀。\n家庭：家和事成，除舊更新，瑞氣滿堂，四鄰稱羨。\n財利：民生根本，慎之行之，風雲際遇，皆得利時。\n事業：靈機一動，天賜良機，掌握此時，必有大利。\n升遷：修來不易，審慎吾行，日日謹慎，必獲平安。\n姻緣：天作之合，求得椿萱，即上加上，永結同心。\n考試：十年寒窗，分有大獲，小心身心，必達願望。\n健康：出之病症，無大礙也，信其華陀，守之則可。\n遠行：時令適之，可出之也，惟時所趨，自吾小心。\n訴訟：人予之訟，可和則吉，為其導引，必大吉祥。\n失物：一時不慎，置若罔聞，平時修來，自回手頭。","大舜耕歷山\n帝舜有虞氏，瞽瞍之子。父頑母嚴，弟象傲。舜事親盡孝，小杖則受，大杖則走，恐陷親不義也。其耕於歷山，有象為之耕，有鳥為之耘。後受帝堯禪位。"],["大吉","望渠訊息向長安，常把菱花仔細看，\n見說文書將入境，今朝喜色上眉端。","名與利、必到頭、訟即勝、病即瘳、孕生男、婚可求、行人至、百無憂。","期待已久的事情，將有眉目了!\n問名利，必有好訊息。\n問行人，數日內即至。\n問疾病，將痊癒。\n問婚姻，有成功的希望。\n問事業或財利，恐怕虛名虛利。","此籤 謀為之事。旦夕喜信。若問行人。旦夕即至。婚姻和合。疾病回頭。士子科名捷報。仕宦得位超遷。叩問運程。即見好訊息也。","望訊息。等待已久也。仔細看。把鏡自照也。此是盼望不寧之狀。文書入境。訊息已到。喜色眉端。大有揚眉吐氣之概。凡事久而後成。難而後易。不可過急。","對於期待已久的訊息，已經等得快要不耐煩了，然而在突然間卻得到好訊息的傳來，令人喜出望外，不禁喜上眉稍，一切的辛勞都有了回應。表示經過了長時間的 等待，終於有了好回報。此籤 表示要發揮極大的耐心，不可因暫無訊息而放棄，只要能持續以待，必得好的佳音。","謀望已久、忽得好音、音書到手、喜在目今。利有攸往、財獲千金、所謀遂意、凡百稱心。","行人若久望、只在三日至、自去自回歸、不出百日內。","“訊息”、“菱花”與“見說”、“喜色”，無一字著實，凡百謀望，皆空指望，占者詳之。\n又一女子占夫之信，得此籤 ，果有家報至。","運勢：是輪至年，惜之此福，掌握時景，費外儲之。\n家庭：命合添丁，人口興旺，積德所賜，宜再守之。\n財利：運之濟及，不請自來，知己帶音，一本萬利。\n事業：財運正旺，鴻業大展，令人稱羨，必有鴻圖。\n升遷：祈神庇佑，自我調適，自我攝養，必能平安。\n姻緣：天作之合，喜結良緣，珍惜此生，感謝天地。\n考試：文運通達，多年苦修，成於今朝，宜惜之也。\n健康：年老之恙，小心起居，飲食叵暴，令人牽掛。\n遠行：行之適時，氣令皆宜，唯小心行，不可輕心。\n訴訟：平素修身，世人敬重，被纏訟也，未必憂之。\n失物：去者可回，嗣後謹慎，是警訊也，事事審慎。","宋太祖陳橋即位\n宋太祖趙匡胤，仕周為檢點。世宗崩，子恭帝立，僅數歲。(趙匡胤)奉命往伐河東，兵至陳橋，部下將士以主幼政亂，勸太祖即位。初不許，後乘太祖醉臥，以黃袍加體，乃引兵回京，受周恭帝禪位。(恭帝當年七歲，皇后新寡，兵變比禪讓更合)"],["下下","病患時時命蹇衰，何須打瓦共鑽龜，\n直教重見一陽復，始可求神仗佛持。","名難圖、財祿失、行人遲、訟未息、病留連、求神佑、莫貪求、宜守舊。","要悔過，消去惡業，福果自來，當避害向善，慎勿妄動。\n問事業財利，表示無利可圖，宜守舊，莫貪求。\n問疾病，恐仍拖延。\n問訴訟，解決仍須時。病訟過冬至後，才有希望。","此籤 大意曉然。凡有前惡。須宜求神懺悔。若問病訟。冬至後方可。不然莫解。若作非為。禍患立至。占者守分修省可保。","運途蹇衰。現在欠吉。打瓦鑽龜。卜筮何益。何須為此。及早種福。感格昊蒼。默仗神力。佳期冬至。一陽來復。或七日後。應驗神速。遠斷節氣。近斷時日。萬 象回春。以需後祿。遵此修持。聖言不謬矣。不悟修省者終凶。","目前的運勢相當不好，如是問病，必是久病不愈，短時間內不會好轉。就算是求神問卜，也是無濟於事，不如相信上天的安排，冥冥中自會有所變化。運勢必須到 冬至時才會好轉，而且會有很大的變化，此時宜平心靜氣地等待好運的到來，若不相信天理的安排，一意孤行，則必會招來厄運，謹慎而行。","命運多蹇、疾病連綿、但須修省、托在蒼天。直須冬至、禱神方痊、凡百謀望、作事必全。","無妄遇凶災、陰人口舌來、一交生日後、漸漸笑顏開。","一生考遺才，占此不取，應在“何須打瓦”一句。\n又一士傷後，占此，中二十二名。恭十一月冬至，乃一陽末復之候，而車見者，恰符二十二也。此第三句之驗。","運勢：正逢溝壑，叵下谷去，上面有石，躲石而過。\n家庭：門戶衰冶，人口稀微，家族為先，門楣為先。\n財利：壓之錯之，時也命也，不是人拙，暫守之可。\n事業：認此業可，行之不佳，時之不允，不是爾拙。\n升遷：勞心勞力，凡事躬親，導致身虛，多調適之。\n姻緣：萬萬不可，性不合也，勉強為之，招來慘禍。\n考試：碌碌一生，皆成畫餅，歸水泡也，改行去可。\n健康：明知患疾，遇上庸醫，速換良醫，後果堪虞。\n遠行：不是其時，出外未必，在鄉即可，小心謀之。\n訴訟：訟則凶也，和則吉也，不宜再興，身敗名裂。\n失物：於南陽失，此物已毀，不必寄望，再造道理。","冉伯牛染病\n周?冉耕，字伯牛，魯人，孔門弟子，以德行稱。有奇疾將死，孔子甚惜之，曰：“斯人也，而有斯疾也。”後世追封鄆公。"],["下下","今年好事一番新，富貴榮華萃汝身，\n誰道機關難料處，到頭獨立轉傷神。","莫貪求、名未遂、財祿平、訟不利、病者凶、事不濟、問行人、多阻滯。","不可只就表面看，到頭來是禍患侵，傷精神。\n問功名，未遂。\n問財祿，平。\n問訴訟，不利。\n問婚姻，不吉。\n問疾病，凶。\n問事情，不順。\n問行人，多阻滯。","此籤 先吉後凶。先實後虛。先熱鬧後落陷。先稠密。後妒害。識透機關。須是平氣忍受。善自解脫。不可急躁生事。更加纏縛。獨立傷神。明是小人結黨。君子守 正。孤立無與。靜以需之。困可亨。否可泰也。反此則凶。","一番新。初勢甚為得意。萃汝身。外面亦似光彩。豈知翻雲覆雨。變態無常。爾詐我虞。人情難測。一旦落在機關。殊出意外。獨立傷神。小人道長。君子道消也 。於時為剝。剝極自復。君子正固則吉。若以機關敵機關。則失所以處剝之義矣。","今年開始就好事不斷，甚為順遂，而且顯得光鮮亮麗，但是人生事事難預料，世事變化無常，受到小人的設計及陷害，讓人暗自神傷，但這是考驗君子的時候，如 果你也和對方一樣耍詐，那你和對方又有什麼不一樣呢?此時應該靜下心來，不好的運勢，如何抵抗還是不好，倒不如等待好運勢的到來，終有否極泰來的時候。","命運難亨、亦不如意、吉中有凶、事實無濟。切莫貪求、出外不利、如或妄動、福消禍至。","作事須宜慎、人心隔肚皮、用心防險算、百事允相宜。","一生到省考遺才，占此，不錄。至返家時，乏騎步行，應“轉傷神”也。\n又兩商人同往茶山採茶，多年蝕本，欲收場未決，故托人占此。或勸再做，一信之，一不聽，遂析股。其一人將資本攜歸，中途得病，到歲杪，尚在旅寓獨宿，末句驗甚。一人再整，適茶葉失收，但人心太寒無敢買，彼獨廣購，果大有獲;改因轉販洋船，乃敗。全詩俱應。末句“到頭獨立”靈極，“轉傷神”三字尤妙。","運勢：逢卯之字，命運坎坷，明知如此，該退守之。\n家庭：心存不止，冥冥之中，報在此也，修身為重。\n財利：不能強行，行之不得，福延禍來，暫守可也。\n事業：宜守本份，押大損大，不是君拙，時也命也。\n升遷：捫心吾身，身心健否，先治之後，必有所賜。\n姻緣：此緣不可，外可內否，人之性也，不宜合之。\n考試：學問無緣，一技在身，享受全生，何必嘆之。\n健康：九死一生，留得一命，受之教訓，銘記在心。\n遠行：斷之不可，時運不際，君之不濟，暫緩可也。\n訴訟：沖犯官符，請大律者，可解圍矣，代價甚鉅。\n失物：未必追也，明知已為，為警告也，嗣後戒之。","韓信功勞不久\n漢韓信，準陰人。佐漢高帝定天下，虜魏，破趙，降燕，下齊，滅楚，建十大功勳，初封楚王。高祖深忌其能，後偽游雲夢，執歸，降封淮陰侯。乃不自損抑，務伐己功，致有殺身赤族之禍，亡年僅三十二歲。雖有功勞，不久於世。\n孫臏遇龐涓\n戰國孫臏齊人，龐涓魏人，同師事鬼谷子，孫臏之學優於龐涓。涓為魏將，與臏鬥智，輸而忌之，乃以計刖其足。後孫臏假作顛狂，得脫歸。齊威王以(孫臏)為師，將兵伐魏，用減灶添兵之法，賺龐涓，追至馬陵道，伏弩射死。"],["中平","營為期望在春前，誰料秋來又不然，\n直遇清江貴公子，一生活計始安全。","求名遲、財未至、病改醫、訟宜息、行人歸、孕生貴、有所遇、方吉利。","始吉終凶之兆。又表示先憂後疑，最後始定。\n問訴訟，訟則終凶。\n問疾病，須選擇好醫生，病情也須秋天過後，才安全無慮。\n問財利，多不如意，如強求，徒勞心力。","此籤 幾番謀望。事與願違。屢次相左。然遇合有定。須在近江之地。或水旁姓名之人。必有格外投契。一味靠著此人。可保生計安全。此當關係夙緣。不可以有意 求。只可以無意遇。莫之為而為。莫之致而致。靜。以俟之可耳。","春後期望。秋又不然。主現在謀為反覆。事多不成。時未至。緣未至也。清江指地。公子指人。將來須遇清江之人。方是真知己。真靠背。一生活計。謂平生衣食 所出也。保全全。謂此人永遠扶持。一生豐衣足。專靠此人。不須他求也。若勉強賓士。只以現前光景。則亦何益之有哉。","看似美好的計畫，但總是無法成局，在反反覆覆之中，總無定見，這表示時機未到，就算勉強行之，也只能以失敗收場。會有一個機緣來改變這一切的衰運，如能 遇見住在水邊的人或是姓名有水部的人.才得以改運，必須是在無意間遇到的人，刻意認識是沒用的，此人將對你的下半生起了極大的變化，幾乎會以對方為主導了，從此沒有生 計上的疑慮。時機到了此人必會出現，不可強求。","作事遲疑、求財未遂、臨江貴人、望之如意。萬一他求、徒勞心志、且謹踐修、以俟時至。","凡百苦難告、好事反傷情、從今逢引掖、謀望盡皆亨。","一士人問終身，得此籤 ，久而不遇。至晚年，適有淮安宦家聘為西賓，大有所得。其家居在清江，甫方悟籤 語之靈驗。\n又一人自泉渡台收帳，去時與妻約，兩三月便可回來。後經年不歸，妻遣人占此。及至回家時，計其外出之月，恰與牧羊之年數適相符，合籤 意之巧如此。\n又光緒庚辰歲試，林生與友三人合占此。依序猜榜發，惟林取進。蓋生年最長，故籤 言一生是始者。","運勢：平而可實，千萬甭沖，只吃悶虧，無利可圖。\n家庭：人口旺盛，唯未足和，選出領導，以利導正。\n財利：平平之時，渡時期也，守之則安，攻則自陷。\n事業：心有餘時，力卻不足，身不由己，不必懊喪。\n升遷：必須致力，否則損身，審慎吾行，日日謹慎。\n姻緣：此緣結之，各自分之，互蒙其利，以理智制。\n考試：勤讀多年，考中官職，一官半職，不如歸去。\n健康：靜之養之，平素修德，冥冥之中，必有助益。\n遠行：不宜出之，出之亦枉，不如停滯，以免加深。\n訴訟：明知叵為，為意氣爭，愈陷愈深，回頭可也。\n失物：去則去矣，不必追也，是好教訓，往後小心。","蘇武牧羊\n漢蘇武，字子卿，杜陵人。天漢初，以中郎將使匈奴，被留，吃雪咽氈，杖節牧羊，居海上十九年。得還，拜典屬國。宣帝立，賜爵關內侯，圖形麒麟閣。"],["上吉","君今庚甲未亨通，且向江頭作釣翁，\n玉兔重生應發跡，萬人頭上逞英雄。","時未亨、宜守舊、遇卯日、名利就、病遲愈、訟終利、行人歸、事終濟。","時運未通，只有守舊待時，不宜妄動。時運一到，自然名成利就。\n問疾病，須拖延，但終能痊癒。\n問行人，終會歸來。\n問訴訟，最好避免。","此籤 現在時運未濟。且須安靜耐守。如彼江頭釣翁。何等閒散。宜待卯年月日。大有發跡。士子是時科第。仕宦是時升擢。商賈是時財利。定有高壓萬人之勢。未 可以泛常論也。","江頭鈞翁。安閒守分之人。言沉困時。須宜學此。以待運至。玉兔重生。當是年月疊卯之際。應發跡。顯達在此時也。萬人頭上。一時超邁等倫。逞英雄。為所欲 為也。占此者。名位超出之選。","目前的時運不佳，適合安身樂命，倒不如學習釣魚的人，只要一份安閒，不須呼朋引伴，自在地享受那一份安靜。快則卯月日，慢則卯年，會有大發之跡，必會成 為各行各業的龍頭，仕人升官、農人豐收、商人大利，而且會有萬人之上的名聲，而非一般的泛泛之輩，要好好把握，目前的等待是為了明日的成就。","命運當蹇、萬事遲疑、且宜守舊、藏器待時。年與月日、逢卯則宜、或遇望日、方稱所為。","孕男婚不成、守舊莫紛更、不貪與不妒、平安福祿生。","一孝廉會試，臨考占此。有為之","運勢：平實之運，時之所趨，千萬叵為，以退為進。\n家庭：家和事成，人口雖旺，先謀結合，奠好良基。\n財利：努力向前，事在人為，為配合命，不得勉強。\n事業：誠心不欺，生意原則，不可不守，方可隆昌。\n升遷：平心養性，必可安泰，榮宗耀祖，出自命中。\n姻緣：不可牽強，為後代計，不宜結之，以理智利。\n考試：鐵杵磨針，將可達望，鐵可成鋼，得志在望。\n健康：宿疾之發，有惡化象，尋妥華陀，一服見效。\n遠行：不是時候，迨至外靜，去之方可，暫收斂可。\n訴訟：訟者凶也，明知叵為，即立退之，方可保身。\n失物：失在陽地，無以找尋，可自吾省，宜小心之。","姜太公釣魚\n周姜尚，字子牙，汲人(東海許州人)，道號飛熊;先世封於呂，亦曰呂望。避紂亂，居東海之濱，釣於磻溪(渭水)，其鉤為直，意不在魚，志在君相。文王聞其賢，聘為師(丞相，其時年八十)。後周伐紂，滅商興周。武王稱曰尚父，封其子丁公於齊。"],["下下","一見佳人便喜歡，誰知去後有多般，\n人情冷暖君休訝，歷涉應知行路難。","始雖易、終則難、名利失、病未安、訟反覆、孕生女、行未歸、事多阻。","有先喜後憂之兆，開始容易終則難，故不宜放肆，尤宜兢兢業業，以免後悔。\n問疾病，忽喜忽憂。\n問訴訟，反覆不定。\n問行人，險阻多，歸期渺。","此籤 先喜後憂。不宜放肆。大概親而又疏。合而復離。歷涉險阻。竟無成就。兢兢業業。庶免後悔。","佳人。女子姣好之稱。凡占者相交共事之人。便喜歡。一見浹洽。去後多般。情意反覆也。人情冷暖。大抵如斯。不足詫異。須知世人不可輕信。每受愚弄。過後 方知。如遠涉者偏歷險阻。始信行路之難也。戒占者慎重提防。毋貽後悔也。","見到面貌姣好的女子，對其有好感，但經認識之後，卻受到對方的百般刁難，大都是因為對方嫌棄你的條件，當然也包括了財力的不足，這種世間冷暖你會覺得訝 異，其實只要是經歷過重重險阻的人，才會真的相信並非所有的路都是那么好走的，如遇到險惡的路程也是正常的，不如先自我評估過後，再決定要如何做，只要小心行事，必能 減少傷害。","事望團圓、反生齟齬、人多不情、恐難憑據。只宜自省、毋為他誤、戒之戒之、且疑且慮。","乍喜反成憂、虛花總不收、世情多反覆、守己是良謀。","一士父母，為之求婚己，私占此，不敢竟白。後果因貧富，久而不諧，六禮將畢而復悔。","運勢：時也命也，逢谷底時，令人無奈，天數難逃。\n家庭：時勢造之，人丁四散，門戶冰涼，速作福可。\n財利：財氣用罄，求之不得，即為三餐，即足矣也。\n事業：世景變遷，百貨盡去，保住目前，即可欣賀。\n升遷：運行谷底，宜己小心，調適自己，方可保身。\n姻緣：不宜逞強，意志雖堅，久而見性，悔之不及。\n考試：功與名耶，身外之物，公益是歸，世人景仰。\n健康：平素缺修，逢病必大，祈求天神，地祗亦求。\n遠行：出之不宜，到外頭去，奠基費時，不如在鄉。\n訴訟：清夜捫心，是昧良心，或順天理，自吾明矣。\n失物：去者去也，不宜再追，追之不濟，即該放棄。","郭華戀王月英\n《胭脂記》：宋郭華，洛陽人。往汴京赴試，因戀胭脂舖女王月英之美，落第不歸，羈留汴京，與之約期私會。屆期，王月英至，值郭華酒飲過醉，推擠不醒，乃解弓鞋藏華懷中而回。華醒時，見鞋悔恨，仰吞而死。是可為出門不知遏欲者戒焉。"],["中平","兩家門戶各相當，不是姻緣莫較量，\n直待春風好消息，卻調琴瑟向蘭房。","婚未合、訟未決、名利遠、音信缺、孕難生、防口舌、非知己、莫妄說。","凡事須待新春，方始稱意。若妄動，反勞心力，終不能如人心愿。\n問功名，不成。\n問財利，不就。\n問婚姻，不合。","此籤 現在謀事。甚不相宜。看似機緣。終竟反覆。即宜舍此另圖。自有好處。春間定得信息。如婚姻前定。自然和合。只可待時。不可妄為。時至自得成就耳。","各相當。門戶相等。不是姻緣。強求何益。莫較量。戒占者不須留戀也。好訊息。謂另有好音。直待春時應驗。此際琴瑟調和。信屬嘉耦。蘭房。婦人內室也。於 此完婚。允遂宜室宜家之願矣。凡事慎重。自有天緣。","看似門當戶對的兩人，卻不是談姻緣的好對象，就算是強求也不會有結果，可能還會有反效果，倒不如先放下求親的念頭。當春天來臨時，會另有好訊息，而且是 門好姻緣，這是樁好婚事，而且是天注定的，只要慎重行事，等待時機的來臨，佳偶自會出現。","兩意未合、宜可待時、防憂與患、謹慎愆期。直待來春、萬事方佳、若或妄動、徒勞心懷。","兩家未合、百事難諧、門戶可慮、猶恐成乖。","一人春間往楚經商卜此，謂秋間必返。及到彼，因事羈留，剛到明春抵家。末二句驗甚。","運勢：善人善心，冥冥之中，則有報也，忍之行之。\n家庭：善人善行，久得知心，推心置腹，凡事即成。\n財利：勤奮力行，甚為欽佩，惟勢所趨，不宜勉強。\n事業：目下互約，財氣則通，生意漸隆，可欣可賀。\n升遷：可得之年，惟宜自保，身心兩健，方得平安。\n姻緣：門戶相當，不是姻緣，即叵較量，待時見之。\n考試：鐵宜久煉，則成鋼也，有志仕途，再奮勉之。\n健康：東南良醫，方可治痊，速去問詢，必可得之。\n遠行：守舊方可，外頭比之，不如現位，何必多舉。\n訴訟：不可有之，興即損也，欲斗到底，兩敗俱傷。\n失物：己之不慎，去者余半，自認霉氣，嗣後小心。","張君瑞憶鶯鶯\n唐張拱(張珙)，字君瑞。因事出蒲東，寄寓普救寺。寺之西廂，有崔氏母女居焉，即君瑞之中表親。女名鶯鶯，有絕色。會值流寇之亂，崔母許以如能保護，願將女妻焉。君瑞出為護持，乃免於難。後崔母背盟，君瑞思憶成病。識者謂其不出道所致也。《西廂記》"],["下下","官事悠悠難辨明，不如息了且歸耕，\n傍人煽惑君休信，此事當謀親兄弟。","訟難明、和為貴、功名無、行人至、婚未成、病有祟、財莫貪、終無利。","問訴訟，應和解。\n誤聽信讒言。\n問財運，莫貪求，投機終無利。\n問婚姻，難得成功。\n問疾病，恐有拖延，要有自信心，才能愈。\n問行人，將歸來。","此簽不利訟事。以和為貴。凡事虛懸無著也。猶疑不定。皆宜停止。恐有傍人慫恿。不可聽信。唯有商謀親密之人。骨肉之際。庶可免憂患耳。門內參商者宜戒之 。","悠悠難辨。是非未決也。勸令歸耕。進取無益。煽惑休信。須要自作主張。當謀弟兄。戒勿背親而向疏也。占者見機省悟。不可執迷。親厚同氣。自有利益。慎之 。","此時如遇訴訟之事，將無法得到有利的結果，若能求和，甚至退隱山林，必能將傷害減至最低，當然你的心中會有憂慮和懷疑，不如在此都放下，才是最好的決定 。\n會有身旁的人加以慫勇，千萬不可相信，此時只能找自己的親兄弟或親信之人商議，而且不可走漏訊息，應想辦法讓自己全身而退，不可再留戀了。","訟事未決、且宜從和、傍人煽惑、平地風波。慎勿輕信、自投網羅、謀之兄弟、誰能奈何。","埋頭莫向前、時違休怨天、貴人垂手接、亨通到百年。","一監生科舉卜此，見遺。後其弟新授，例到監，偕弟同懇人司成，得以續取。此事“當謀”句驗甚。","運勢：掉入谷底，修之吾心，心存善時，方可爬升。\n家庭：門庭冶漠，來自有因，不必嘆氣，有旺盛日。\n財利：財人人慾，爾亦孔急，不慌不忙，逐步為營。\n事業：見繼母景，一計出之，阻力即至，暫守之可。\n升遷：今年無望，先調吾身，必有望也，明春可獲。\n姻緣：兩意不合，何必強湊，久時明之，噬臍無及。\n考試：壯志凌雲，惟不合君，仕途無緣，不如改行。\n健康：久病成醫，成之自治，反貽誤事，必省思之。\n遠行：行之不宜，不如守舊，方可有得，不能逞強。\n訴訟：伊人凶霸，加之君軟，速求軍師，為君料理。\n失物：去之不回，已明顯也，不必費心，新置可也。","王祥臥冰\n晉 王祥，字伏徵，臨沂人。性至孝，事繼母極恭謹。母欲食生魚，天寒冰凍，祥赤身臥於冰上求之，其冰立解，得雙鯉持歸，人以為孝感雲。後官至太保，進公爵。(廿四孝)"],["下下","田園價貫好商量，事到公庭彼此傷，\n縱使機關圖得勝，定為後世子孫殃。","事悖理、訟必傷、名未濟、財平常、產勿謀病宜禳、宜謹慎、保全康。","做事只要依本份，循理而行，自然會得圓滿的結果。反之，如果硬要圖巧取勝，縱然目前獲得一些小利益，將來會給子孫留下無窮禍因的。\n問訴訟，宜彼此讓步和解。\n問功名，難如願。\n問財運，利未遂。宜安守，莫貪求，且謹慎，保全康。\n問疾病，心善可讓解\n問行人，歸期尚遠。","此簽示人當依本分平等。凡事再三籌議。不可涉訟。訟則終凶。若恃財勢賄囑。或情面請託。雖僥倖一時之勝。終必欺心害理。不免子孫之受報耳。占者戒之。","價貫商量。戒勿刻剝欺壓。刻剝必致爭訟。公庭浪費。彼此均不利。何益之有。機關得勝。子孫受殃。言心術狡詐。上千鬼神之怒。果報有不爽也。人務貪謀。顧 不為子孫計哉。","凡事在商場上，必須憑著公平及真心，不可仗勢欺人，刻意剝削他人，如將事情鬧上公堂，將對自己不利，甚至兩敗俱傷。緃使利用手段而獲勝，也不是真正的勝利，\n公理自在人心，天地神明都看到了，其禍害將殃及子孫，所謂“不是不報，只是時候未到”，要深思。此簽表示你經常違背常理行事，對私德有所損傷，怕會傷到後代，要小心謹慎。","事依本份、自有前程、若用機關、反害其身。如作交易、當合人情、若見妄作、難保全寧。","心田兩字在公平、財產交關勿見侵、凡事只宜退一步、須知守己得安寧。","一人卜米價，是年米不貴。\n又桐城(泉州城，亦稱刺桐城)內一士人，有螟蛉子，弗受駕馭。一日偶督責之，竟自逃去，莫知所之。其父百計圖謀，終無影響。迨占此之後，乃於勝果舖(參見《泉州舖境》)尋得，帶回家裡。鏇染怪病，破費許多，未及冠而殀亡。三四兩句之驗如此。","運勢：非君拙也，是時不予，命之所致，免傷身心。\n家庭：人口雖旺，人心不和，最大障礙，謀和優先。\n財利：暫守之可，非份之想，福變禍至，戒之慎之。\n事業：守今之勢，得平安可，盲目前沖，害人害己。\n升遷：今年恐難，因身不適，先健身心，不妨試之。\n姻緣：兩造不合，天生背對，何以合之，速分手可。\n考試：目下之境，非份之想，莫可前進，方得分寸。\n健康：久病痼疾，復發之苦，為治痊難，速予設法。\n遠行：出之不宜，氣候阻害，居家心安，宜從之可。\n訴訟：不可為也，遇橫柴類，忍之受之，可享太平。\n失物：無望之也，己已不知，從何覓起，新添可也。","石崇被難\n晉石崇，字季倫，為城陰太守，伐吳有功，封安陽鄉侯。財業豐積，室宇宏麗，庖膳窮水陸之珍，與王愷以奢靡相尚。後為交趾採訪使。有美女名綠珠，以珍珠十斛買之，藏於金谷，被趙王倫窺見，乃以計害崇，冀得綠珠。及崇被難，綠珠墜樓而死。"],["中平","知君指擬是空華，底事茫茫未有涯，\n牢把腳根踏實地，善為善應永無差。","名利難、終則有、病禱神、訟勿問、行人遲、事難就、且向善、祈福佑。","不宜妄意求謀，空自指擬，應該自我反省，改過向善，自然轉凶為吉，而受上天的保佑。","此簽不宜妄意求謀。有名無實。只是空華。何用貪痴不已。不如按部就班。腳踏實地行去。記憶體善心。外行善事。將來自有善報。較之無益之求不已遠乎。","空華。謂若鏡花水月。有影無形。可望而不可即也。未有涯。謂妄念無底止也。腳踏實地。諭令舍妄即真。去非就是。一味穩步徐行。庶乎所為皆善。自得善報。永無差。謂感應不爽也。由是科名遂心。財利稱意。子嗣獲吉。皆可操券而獲矣。占者消凶集慶。急自修省。","現在所想的美好景象，都是虛空的，而且是不切實際的，如果再一味地空想，將使自己陷入無底的深淵，倒不如腳踏實地，一步一步地踩穩，忘卻過去的空想，多做善事，自然會有好的回報。此簽表示目前還是耕耘的階段，或許會很辛苦，但累積汗水，自會收穫甜美的果實，只要一心向善，方向就不會錯。","作事未成、空自指擬、且宜緩圖、急則損己。更宜向善、禱神求安、轉禍為福、可免多端。","本分安常到處諧、虧為妄想便生災、財源未遂徒勞力、且宜向善保亨來。","一道人遇寇，欲趨避，占此。潛隱草廬中，得脫去。是應“腳根”一句。\n又一人被訟，占此。有司公出，不得歸結。是應“底事”一句。\n又一生占此，秋闈不中，是應第二句。","運勢：平凡之途，有財可得，暫之滿足，來春好轉。\n家庭：善人善心，隆昌捷徑，修吾身心，必有旺時。\n財利：平穩踏實，必有收穫，不宜貪婪，否則害已。\n事業：目下事業，押對局勢，不宜貪之，方可守之。\n升遷：唯調吾身，以備戰鬥，方可平安，必有所獲。\n姻緣：曰久見誠，一舉一動，詳察之後，可定盟也。\n考試：有心打鐵，鐵必成鋼，君天資平，奮勉取冠。\n健康：擇華陀醫，庸醫誤人，不可不知，選對治痊。\n遠行：目下不宜，因氣候劣，地崩土裂，傷身防之。\n訴訟：雖是理智，小人之心，不可小覷，終獲平反。\n失物：西南之向，去探之也，必有所獲，不妨試之。","孟嘗君招賢\n戰國孟嘗君，姓田名文。嘗謂其父田嬰曰：“家累萬金，門下不見一賢者。”後其父卒，孟嘗君立在落(路)，招致諸侯賓客及亡(逃亡)人，有罪者皆歸焉。孟嘗君舍業厚遇之，以故傾天下之士。其時，門下食客數千，無分貴賤，一與交等。"],["上吉","嗟子從來未得時，今年星運頗相宜，\n營求動作都如意，和合婚姻誕貴兒。","作事吉、名利遂、婚姻成、訟得理、孕生貴、行人至、病易安、皆吉利。","作事吉，名利遂，婚姻成，訟得理，孕生貴，行人至，病易安，皆吉利。","此簽不問貴賤。皆主謀為和合。年運亨通。從前阻滯。一旦稱心。凡動皆主有成。不須疑慮。","有所經紀曰營。有所謀望曰求。要為此事曰動。力為此事曰作。占此者。無子得子。無官得官。無財得財。婚姻有魚水之歡。親交有膠漆之應。凡事機緣。無不和合。向來運蹇。至此恰得亨通。失意時占此最驗。","在求得此簽之前凡事皆不順遂，然而從現在開始，運勢好轉，不論是求什麼，幾乎都可達成，尤其是求姻緣及子嗣方面，更是會有好結果。過去的不如意，都可以拋到腦後。對於順利者，或許沒有太大的感受，但對於原本失意的人，此簽更是靈驗，要好好把握良機，不可錯過。","久困沈埋、時運今泰、作事有成、名利俱快。更無阻滯、宜為買賣、士人占之、前程遠大。","時來時去本參差、時運亨通任所為、財祿科名皆遂意、婚姻嗣息總相宜。","一生占秋闈得此，下第，蓋頗宜者，猶未甚宜也。試畢，以歲者，準貢是小事，吉也。\n又先兄諱晴光，己亥科試，占此簽，自","運勢：開春好轉，年中皆順，珍惜今年，儲之存之。\n家庭：與年增旺，合和為要，各有所司，和樂融融。\n財利：眼光遠見，必有肋也，時勢助之，必有大獲。\n事業：多年願望，一旦成功，豈可若狂，宜守之也。\n升遷：注意調適，大有助益，平素修身，加之積善。\n姻緣：兩合之意，建家美滿，珍惜時日，百年偕老。\n考試：今決定年，再勤辛苦，十年寒窗，終獲償願。\n健康：雖是嚴重，幸遇華陀，悉心治之，終獲治痊。\n遠行：可也可去，途中小心，以保平安，是最要者。\n訴訟：心地善良，從未害人，天理昭昭，終獲勝訴。\n失物：失在西北，循北向去，必有跡象，耐心等待。","劉智遠得岳氏\n劉智遠(知遠)，沙陶(沙陀)人。初為節度使岳彥真軍校時，彥真奇其相貌，以女妻焉。後仕晉，為邠州太原節度。契丹滅晉，中原無主，智遠乃即帝位，改國曰後漢，仍稱天福而不改元。"],["下下","一生心事向誰論，十八灘頭說與君，\n世事盡從流水去，功名富貴等浮雲。","訟終凶、止則宜、名利輕、病擇醫、行人遠、婚遲疑、凡作事、且隨時。","懷才不遇，知音難尋，雖有滿腹經綸，又有誰識貨呢?放寬心胸吧，世事原來就是如此。那能盡如人意呢?\n問旅行，要小心，路上恐有險阻。\n問訴訟，凶多吉少。\n問疾病，擇醫可愈。\n問行人，歸期尚遠。\n問婚姻，波折多，成功機會少。\n凡事到底不吉，宜謹守，可保平安。","此簽主同心無人。孤立少助。險難在前之象。既經指示。宜早提防。然大勢已去。難可挽回。不啻流水浮雲之變滅。唯有達觀排遣。斬斷利鎖名韁。毋復繫戀。更生事故。占者悟此。則知患難中玉成不少。或又有困而得亨之日乎。","心事向誰論。踽踽涼涼。無可告語也。十八灘。屬贛州。灘名惶恐。言前路甚多驚險也。流水去。逝者不可復回。等浮雲。現在皆成烏有。尚何功名富貴之可至哉。知功名富貴之無常。而等之流水浮雲。是即與向誰論者。而與之論脫險之道。每遇之學也。慈恩豈有戰極哉。","雖有滿腹的心事，但總是沒有一個可以傾訴的對象，一直以來都是挫折重重，未來所要面對的路途，也是驚險萬分，這一切只能往自己肚裡吞。人生世事難預料，對於遇到的不幸，只能讓一切付諸流水，不要有太多的計較或留戀，想要等待富貴功名，似乎期待只能落空。此簽雖然表示不好，但若能因事先知道而加以預防，或以平常心看待，則會較能釋懷。","心事未決、且宜緩圖、時勢縱吉、須仗神扶。凡事退省、終保無虞、更加修福、可履亨途。","扁舟逢險地、傾覆甚須防、有人牢記作、凶事得安康。","一人買仆，占此後，仆逃去。應“世從流水”一句。\n又光緒間，安溪縣一生歲試，占此後，惟草索取錄十八名。此系第二句之應也。\n又晉江縣郭姓，問二子孰得入泮，占此，俱失意。此乃第四句“等浮雲”之驗焉。","運勢：走在谷底，惟不餒志，方能沖回，耐心等之。\n家庭：家和事成，家亂事敗，人口雖旺，必先謀合。\n財利：大道生財，必持以道，凶霸事業，自有損失。\n事業：自有損失，信用鞏固，世景如此，非君之拙。\n升遷：好兆頭多，小心吾身，身心健全，必有好報。\n姻緣：八字不合，不宜堅持，持之以久，即不幸也。\n考試：不得者也，不合於君，宜改行也，速迷離可。\n健康：已成痼疾，不宜輕視，悉心治療，方可能痊。\n遠行：此行不宜，不如在鄉，往外事多，守舊才增。\n訴訟：不可為也，明知不可，即可歇也，汝該知也。\n失物：失於陽方，不必尋找，無從查詢，重買可耶。","嚴子陵登釣台\n漢嚴光，字子陵，餘姚人。少有高名，與光武同遊學。及光武即位，遂變姓名隱身不仕，帝令訪之。後齊國書云：有一男子垂釣氵墨中，帝疑為光，譴使聘之，三反乃至，除諫議大夫，不屈，耕富春山。帝遂其志，為建釣台。東漢高士稱第一焉。"],["下下","與君夙昔結成冤，今日相逢那得緣，\n好把經文多諷誦，祈求戶內保嬋娟。","事無成、病禱愈、出不宜、訟有理、冤報冤、求神解、若欲貪、終必敗。","問婚姻，難能成功。\n問事情，成功希望很少，乃宜守不宜動之象，並要防女人是非。\n問疾病，訴訟，外出，均不吉。\n要修心向善，方保全全。","此簽系冤仇纏結。訟事最凶。急自耗財。和解為妙。貴人占之。謹和處世。多行善事。免遭凶禍。平人占之。求神懺禮。遷善改過。可得人口平安。一切謀為。均宜回心向善。乃可逢凶化吉。冤家宜解不宜結。明者悟之。","夙昔結成冤。嫌釁不起自今日也。相逢顯惡緣。今茲正圖報復也。經文諷誦。示人回心向善。存好心。行好事。感格神佛扶持。以冀解散也。嬋娟。指月光言。比譬婦女。言仰沐神佑。家中妻女人口。可保無恙。凡解冤釋患。禳病消災。均有感應。唯在善願甚切。可無憂也。嬋娟。十五月圓之候。時日或應在此。","或許過去因故與人結怨，而這些過節會因現在的相遇而發生衝突，對方也許會因此而有報復的行為發生，此時必須多誦念經文，將這些福報回向給家人，尤其是家中的女眷，對方會針對家中的女性加以報復，只要一心向善，不可惡言相向，則可逢凶化吉，事發時機可能會是月圓之日，要多加小心注意。","舊有夙冤、作事隨緣、急宜向善、方保全全。力行好事、心契上天、變凶為吉、出自福田。","前因損害用心機、只怕中間有險危、財物存留防耗散、更憂人口得傷悲。","一典(當)舖媳病，占此。後其婦讒語曰：“我前世為盜，所得物，俱質汝家，今來安享汝財，速與酬神，可保無恙也。”後果如其言。\n又一生，剿(抄)襲便文，騙進，因復場文筆大相刺謬，幾於見黜。後宗師把他經取之，文多誦數遍，不忍割愛，畢竟無恙。方悟簽語明言“與君夙昔結成冤”，無有他慮焉。科名之事，猜此卻合，若占別件，慎勿輕決。","運勢：走入壑底，不可逞強，步步為營，交秋可轉。\n家庭：人口稀微，不是人禍，出於自然，謀合和要。\n財利：心存善良，童叟不欺，信用確立，方能大展。\n事業：利之所趨，雖力拚之，仍無法克，得來春矣。\n升遷：怨天尤人，無濟於事，留心生活，必佑佳音。\n姻緣：萬萬不可，兩姓不合，勉行之也，噬臍無及。\n考試：已絕緣也，因書無對，不識方向，明年再來。\n健康：多年宿疾，一再復發，恐有險境，宜蚤治之。\n遠行：叵出行時，因前途險，天災地變，無以測知。\n訴訟：可解不結，結之成冤，冤冤相報，何時可了。\n失物：一去杏然，物已毀矣，嗣後小心，世況愈下。","孫、龐鬥智結仇\n戰國孫臏齊人，龐涓魏人，同師事鬼谷子，孫臏之學優於龐涓。涓為魏將，與臏鬥智，輸而忌之，乃以計刖其足。後孫臏假作顛狂，得脫歸齊，威王以(孫臏)為師，將兵伐魏，用減灶添兵之法，賺龐涓，追至馬陵道，伏弩射死。"],["上吉","碧玉池中開白蓮，莊嚴色相自天然，\n生來骨格超凡俗，正是人間第一仙。","訟決勝、名易成、病即愈、財即盈、婚姻合、貴子生、家道成、百事亨。","要積極行動，不要遲疑不決。\n問功名，有希望。\n問事情，可成就。\n問財利，有希望。\n問疾病，可痊癒，婚姻可成。\n問婚姻，美滿生貴子。","此簽主瀟灑出塵之應。謀望須清高門路方可。一切財利塵俗事。不甚相宜。功名可許。當主翰苑清品。問孕恐涉空花。問病者。有意參玄學道則吉。佳世之人。亦恐辭座之忌。語皆著空故也。","池開白蓮。最為清高妙品。但朝榮暮悴。光景無常。恐難久遠堅牢。骨格超凡。言生質之穎異也。第一仙。言其身列仙班也。功名占此。必登清要之選。或系張留侯李鄴侯一流人物。尋常庸俗之人占此。多虛花。少誠實。若問出世因由。登真正果。指日可望。上上大吉。","池中白蓮有出污泥而不染的清高之象，高貴清嚴的外表更是自然天成，但也有孤立清高之意，雖煞白天是欣欣向榮的感覺，但到了晚上，則所有花都休息了，有無法持久的意思。天生與眾不同，在別人眼中是相當特異獨行的，如果是高官貴族，則此簽有榮升之意，如果是一般的平凡百姓，表示口出空言，只有表面好看，其實內在相當空洞，要注意。如果是修道之人，則得道之日已不遠了。","事見明白、不假人為、更宜出入、切莫遲疑。士人占之、高攀桂枝、一切謀望、好趁明時。","更宜出入莫遲疑、士子高攀折桂枝、婚合自然生貴子、萬般謀望趁明時。","一生聞鄰邑考童生，欲往，占此，後為彼地所遂。路見一觀音坐白蓮，竟買之而還。\n又余表叔陳內史，府試，占此簽，果結第一名。應在末句也。\n又泉州有一副貢生鄉試，占此，竟中式。蓋應“正是”兩字也。","運勢：三年一輪，今年逢紅，把握現在，一切大吉。\n家庭：年年興旺，今又是耶，平素行善，可見隆昌。\n財利：正逢隆昌，押之即得，惟小心認，必獲大利。\n事業：小心處之，定必平安，千萬不驕，否則必敗。\n升遷：多年勤讀，報於今年，中後再厲，必有妙用。\n姻緣：一見即鍾，惟互觀察，兩姓可合，方可許身。\n考試：多年勤讀，報於今年，中後再厲，必有妙用。\n健康：樂善好施，博施濟眾，根基甚深，安全過關。\n遠行：可行之時，千變萬化，自吾戒之，平安可回。\n訴訟：不是爾惹，是人圍剿，不必畏縮，撥雲見日。\n失物：所幸失小，無必緊追，亦無可回，戒之可也。","李太白遇唐明皇\n唐李白，字太白，成紀人，性倜儻，善詩歌。天寶中，召見金鑾，論當世事，昭供奉翰林。(唐)明皇愛其才，欲官之。會高力土以脫靴為恥，讒於楊貴妃，輒為所沮，遂浮游四方，寓情詩酒。"],["下下","花開花謝在春風，貴賤窮通百歲中，\n羨子榮華今已矣，到頭萬事總成空。","名與利、似虛花、訟不勝、病癒加、婚未合、行人賒、事無就、徒咨嗟。","花無百日紅，人無千日好。\n問事情，有成有敗，吉中有凶，否生於泰，名利似虛花。\n問疾病，恐加劇。\n問婚姻，成功希望少。","此簽主前運起跌不常。富貴窮通。都經涉歷。後運則大不吉。如百花已經開過。從今搖落。無復榮華之望。是以萬事成空。總宜退謝。倘更勉強圖謀。徒勞罔功。終欠結果。","花開花謝。榮悴無常。運程似此。立睹更變之象。榮華已過。萬事成空。復何望哉。凡謀不吉。訟宜散。病防老。財不久。祿將終。婚無成。","人生運勢有好有壞，當好運來臨時，卻像風中花朵，輕易就被吹落，而壞運卻緊追而來，一切的富貴窮通早已在你的人生中經歷過了，但是榮華富貴早已流逝，不再回頭。如果能看透這一點，則較能釋懷，若是強求，也只是徒勞無功，不可能有收穫的，及早認清事實。","凡百謀望、有成有敗、始雖快意、終竟成害。吉中有凶、否生於泰、若不斂藏、後憂方大。","此簽大不終、花開遇暴風、榮華全剝落、病訟盡皆凶。","一生未遇時占此。自謂無發達之日。後入場坐空字號，遂得中榜。應在“總成空”之句。聖詩微妙，人不易測。\n又泉城內郭生，有子得病。延兩醫，一名榮觀，一名今先。因寒熱爭辯，遂入廟占此。猜者謂今已矣，決不合，勸其托榮觀調治，至年終果愈。此又“羨子榮華”、“到頭總成空”之驗矣。","運勢：押此走東，壓彼閃西，正逢大凶，暫忍受之。\n家庭：家門生變，令人傷神，必須堅強，方可挽回。\n財利：無利可圖，換行亦然，暫守可耶，待明春看。\n事業：三餐蝴口，維護生命，已勉強矣，忍之受之。\n升遷：得之流去，已成慣習，先調吾身，方有效歟。\n姻緣：明知不合，即趁早散，再勉結之，害人害己。\n考試：雖是勤讀，功名無緣，因學不合，改行可耶。\n健康：此次嚴重，惟覓華陀，可救一命，再延十載。\n遠行：不合時也，行之途中，恐遇災厄，居家可也。\n訴訟：訟通凶也，明知叵為，即和可也，可趁百萬。\n失物：去陽失者，唯回無望，此次教訓，宜惦志之。","吳王愛西施\n吳既滅越，越王勾踐卑詞請成，臥薪嘗膽，果報會稽之仇。與大夫范蠡、文種謀，乃選民間絕色西施女，進之吳王。(吳王)夫差甚嬖愛之，至於亡國。"],["中吉","一春萬事苦憂煎，夏裏營求始帖然，\n更遇秋成冬至後，恰如騎鶴與腰纏。","名利有、莫躁為、詞訟解、婚姻宜、行人遠、病瘥遲、富與貴、要待時。","先凶後吉，先苦後甘的啟示。沒有耕耘，那來的收穫?\n問名利，晚成。\n問謀事，先難後易。\n問婚姻，雖有波折，有情人終成眷屬。\n凡事夏秋冬都遂意，惟春天則不利。","此簽先難後易。官員占之。有超擢之喜。士人占之。晚成名利。凡百謀望。收成在後。近占應在夏秋冬。遠占應在晚景。不可因現在憂煎。自行墮志也。","昔有人。一欲富。一欲貴。一欲仙。一欲腰纏十萬貫。騎鶴上揚州。時揚州仕宦善地。稱為富貴仙。是人慾兼而有之。故云爾。占此者。名利俱全。榮華稱意。但應驗尚在收成結果之際。近時尚須耐守。必志向堅定。久久不移。方得成就也。流年春不利。夏稍可。秋冬全吉。","事情的開始，總是較為艱難，或許會有重重險阻，只要立定志向，貫徹始終，最後的收成，會比自己想像得要容易，只要不放棄，必能達成目標，此簽也表示出了節令，在春天則無法成事，到了夏天則較可為，如果是秋天到冬天，則絕對會成功，此簽更有名利雙收的表示，只要堅持到底，成功絕對沒有問題。","春日謀望、事多不成、夏秋冬月、始見光亨。更宜出入、福祿豐盈、營求如意、時至即行。","舟楫上高灘、險後得平安、勞心勤苦過、財氣不艱難。","一人謁選，占此，謂必得揚州為官矣，乃選得河南信陽州知州。陽與揚同音，“恰如”二字之驗。","運勢：平凡之令，不宜貪婪，貪字通貧，切記惦之。\n家庭：年年添之，為謀合和，是首務耶，切記銘內。\n財利：盡吾心機，卻不見利，時也命也，不宜餒志。\n事業：目下尚可，唯不能蓄，為後半計，再接再厲。\n升遷：調好身心，今有望耶，小心戒之，必佑佳音。\n姻緣：兩者見鍾，互為觀心，可否交往，自吾認之。\n考試：勤讀寒窗，已逾十載，根基已奠，明秋再看。\n健康：不致擔憂，華陀在旁，自吾攝製，當至痊癒。\n遠行：於秋後可，天高氣爽，安全時段，必能平安。\n訴訟：謀之和可，愈斗愈烈，啻損家財，傷神落敗。\n失物：失之北方，但物半毀，回亦無用，望置新可。","張騫誤入鬥牛宮\n漢張騫，城固人。武帝時，奉命使大月氏，開西南夷。嘗乘槎直上天河，入鬥牛宮，見一女子手弄金梭，傍有一石，問之不答，惟云：“可問嚴君平便知。”君平蜀人，精天文術數。往詢之，云：“此天孫織女也。石名支磯石。”"],["中平","寅午戌年多阻滯，亥子丑月漸亨嘉，\n更逢玉兔金雞會，枯木逢春自放花。","訟多憂、終則息、名利達、婚姻吉、孕欲保、作福力、問行人、歸有日。","時未到不可強求!\n問功名，多阻礙，必須再用功，明年重來。","此簽作事遲疑。至三冬謀望亨通。卯酉月日。應在次年。或應在遠年。枯木開花。言時運先蹇後泰。如秋冬枯落之木。一到春來。開花結果。自有一番更新氣象。後福未可量也。","寅午戌年。指歲運說。是時人事阻滯。不可進取。遇亥子醜。漸漸亨嘉。至卯酉大吉。名利成就。取青紫如拾芥。凡事先看年月。以詳運命。須合亥子醜卯酉等字。則遂意矣。君子得之主仕進。小人得之恩赦至。","在處理事務上，總是出現許多的遲疑，原來是受到時令的影響。此簽最主要是顯示出時令，當遇到虎、馬、狗年時，諸事不順，多受阻滯，但在每年的冬季時，則運勢會轉好，春夏秋季時則完全不行，當遇到兔及雞年時，會有枯木開花的榮景，也就是原本已不看好，但卻重現生機及活力，而且會有一番新的景象，由衰轉榮，而且後福不淺，會完全拋掉衰運。","春夏秋時、作事遲疑、直待三冬、百事亨通。卯酉月日、所謀則吉、待此時來、枯木花開。","謀事難成未可夸、枯木逢春始放花、敗了又成離又聚、及時雨露發光華。","一人久病，占得此簽。夏日請醫，來遲。問“何以遲”?曰“看日食間”。何為“日食”?對曰：“日月交會也。”病人大悟簽語，曰：“吾病必痊矣。”一劑而癒。","運勢：平穩之年，步步為營，時至秋至，即結果時。\n家庭：年年添丁，為合和謀，興隆之日，可期之耶。\n財利：勤而勞之，有收成也，必留儲蓄，備之後方。\n事業：平平之年，不必惶恐，沉著應戰，必能大贏。\n升遷：留意身心，必可有之，小心調養，宜慎行動。\n姻緣：兩姓之間，有違之時，宜三思行，後半幸福。\n考試：有望之年，百尺竿頭，再下功夫，抱負已展。\n健康：此疾在昔，必奪人命，今日醫技，可治痊耶。\n遠行：目下不宜，迨至入秋，氣候豫順，方可成行。\n訴訟：先輸後贏，惟小心對，最好和解，可各贏訟。\n失物：有回可能，失之西方，去尋可也，損失占半。","唐明皇游月宮\n唐玄宗與方士羅光遠八月十五日秋宴，光遠取桂枝杖向空擲之，化為大橋，色如銀。與帝同登游，入月宮，見有霓裳羽衣之女歌唱，調甚新奇。帝默記其譜，以教太真。"],["中吉","年來豐歉皆天數，自是今年旱較多，\n與子定期三日內，田疇霑足雨滂沱。","名與利、今雖損、若遇時、便返本、訟可解、病可安、婚即合、行人還。","目前運氣雖然未順，只要多行善事，祈禱上蒼，自然有求必應。","此簽謀事。先損後遂。問病。星運未順。三日後或遇庚日。可望痊可。所謂先庚三日。後庚三日也。訟即解。利即得。婚即成。行人三日內必至。禱雨三日內必降。凡事利達也。","窮通得喪。皆有天數。非人力可為。凡百謀為。厄於時勢。尚未順利。定期三日內。言轉盻間。即有生機也。庚者事之變。先庚三日為丁。後庚三日為癸。主是時變凶為吉。名成利就。又當謹修慎守。不可妄動。須待氣機到時。自如枯苗得雨。大有勃然興起之象。","莊稼的豐收與歉收，完全都是由天決定，這是天地間的常理，無法由人力來改變。意謂著運勢的好壞，並非靠努力就可轉運，還是必須等待時機的到來。適逢今年運劫不佳，遇到了乾旱年，收成勢必會有影響，此簽表示出了時間簽，肯定在三天內會久旱逢甘霖，三天也表示很快的意思，讓田裡的莊稼有足夠的雨水，也表示衰運從此終結，開始順遂的好運道。","吉凶天數、目下多遁、直待時至、如木逢春。禱求皆應、定在三辰、謀望必遂、好事臨門。","吉凶天數竟如何、且待時來福氣和、祈禱定應三日內、營為好事入門多。","一生秋闈占此，三場連日皆雨，竟得中榜。應末兩句也。\n又一生屢試不利，晚年與其子同考，出場後甚得意，命其子代占，得此，益喜。有為","運勢：春季未開，夏季見苞，忍至仲秋，笑口常開。\n家庭：人口稀微，切莫自欺，盡己作福，必有轉機。\n財利：財運未明，求之蠅頭，不以太少，珍惜此福。\n事業：上半之年，度三餐矣，後半之年，突飛猛進。\n升遷：必有之也，後調吾身，護己身後，定達願望。\n姻緣：可合之緣，先友後婚，其理明之，審慎行之。\n考試：勤奮已足，唯方向誤，早日請益，必可中歟。\n健康：小疾而已，不足為憂，惟照料已，不能大意。\n遠行：逢動盪世，不宜出行，居家較優，後來領悟。\n訴訟：各退一步，海闊天空，神馬浮雲，何必計兩。\n失物：本已放棄，靈機一動，往北去也，終覓回來。","邵堯夫告天\n宋 邵雍，字堯夫，范陽人。於書無所不讀，精天文易數，程子稱為振古之豪傑。遇苦旱，焚香告天，為民祈雨，竭盡誠敬。經王拱辰、呂誨等屢薦不起。卒年六十七，贈秘書省著作郎，元祐中謚康節。"],["下下","世間萬物各有主，一粒一毫君莫取，\n英雄豪傑自天生，也須步步循規矩。","訟莫興、醫審病、名與利、付之命、行人遲、婚未定、凡百事、且安分。","富貴分定，切莫強求，若或妄取，必有後憂。只宜守分，不可妄為。問謀事，不可以強凌弱，以富壓貧，稍涉欺凌，反成災害。問訴訟，宜避免。問疾病，宜禳解。問婚姻，不成。","簽只宜守分。不可妄為。若謀事返成災害。不可以大凌小。以富欺貧。訟宜和。名亦有。財緩求。行人阻。病徐安。婚莫急。凡事守己。待時為得","名利近不可得。久後自有成就。一毫莫取。戒勿為貪心妄求之事。須循規矩。示作事當按部就班。不可凌獵無序。自取顛覆也。","天地間的萬事萬物，各有其所，不可因其小而取之，不可因其弱而欺之，身為英雄豪傑，自有氣勢風範，不可因此而欺負弱小，更要收斂自己的氣勢，固守本分。不該是自己的東西，千萬不要貪得，必須循規蹈矩，成為眾人讚賞的對象，必有後福。此簽主要告誡世人安分守己、不可妄為，也有等待最佳時機到來之意。","富貴分定。切莫強求。若或妄取。必有後憂。 且宜守舊。更勉進修。心行平等。自獲天佑。","守分方可遇。欺凌必反災。妄為難自保。依理福田來。","江東神廟有大樹一株，明太祖皇帝欲伐之，初占此簽，猶為偶然，復占仍得此簽，遂驚嘆以為神異而置之。\n又一新科舉人，占得此，春闈大捷。應“步步”二字。若問一科者不利。\n又余族人王生歲試，占此，入場東廊號舍，與江生隔鄰為道，題解得竅，果入泮。又一生，占此亦入泮。蓋上三句未明示，“自天生”三個字，至結句六字，復暗藏一員字之議。王錢謹識。","運勢：今為低迷，宜守舊耶，不宜妄取，害人害己。\n家庭：目前稀少，年年見旺，必須謀合，維護家譽。\n財利：不必急也，步步為營，必由小富，致陶朱利。\n事業：蠅頭小利，亦為生活，不宜輕視，小勤致富。\n升遷：皆歸天數，無人預測，守之修之，祈神奉佛。\n姻緣：一見即合，為一時興，久而淡之，如同路人。\n考試：富貴命也，功名如此，君與無緣，速改行去。\n健康：突而發作，今日醫技，救爾一命，謝天地耶。\n遠行：千萬不可，災厄居多，守之在鄉，安心可過。\n訴訟：此訟恐難，素之為人，是勝訴鍵，多修身也。\n失物：已去不回，甚為明顯，不必費神，重置可也。","江東得道\n錢塘羅隱(參見《泉州人名錄•羅隱》)，號江東，唐末舉進士。求官不遂，立意修真，幸遇異人，傳授心法，因而得道，故能開口成讖。嘗游泉州，乞食於(晉江)羅裳山下，鄉人慢之。江東畫馬於石，每夜出踐田谷。鄉人知而請罪焉，乃畫樁樹以系馬，遂不踐。至今遺跡猶存。(參見《泉州史跡•畫馬石》)"],["上吉","公侯將相本無種，好把勤勞契上天，\n人事盡從天理見，才高豈得困林泉。","病與訟、久方解、名與利、姑少待、若失物、尋必在、雖暫困、終必泰。","當下雖然未得際遇，但莫嗟嘆，只要修心向善，好運馬上到來。\n問訴訟，能解決，但時間上恐較長。只要當事人合乎情理去做，不必憂慮。\n問行人，不久即返。\n問失物，有尋回的希望，只要全力去尋找。\n問財利，目前雖不理想，但不久即好轉。\n問疾病，終見愈，但須修心向善。","此簽吉利。凡事切莫墮志。更須修心向善。自有好處。問訟久方決。名利稍遲。失物可尋。病宜作福禳解。行人久後必至。","功名富貴。勤苦可得。豈限白屋朱門之說。所謂本無種者也。目下雖困。終必逢時。但當自竭勤勞。人事已盡。天理無不準應。彼讀書者。才學既高。豈得久困林泉。不久即有飛騰之望。凡事皆然。唯先返求諸己可耳。","人世間的功名利祿，並非從天而降，只要辛勤地努力，必能達到，並沒有限制在這達官貴族之家，任何人都可以因為勤勞及努力，而得到該有的回饋。所謂的“盡人事，聽天命”，當你辛苦努力地往上爬，上天豈有看不見的道理，才德及能力是無法被壓抑的，總有出頭天的時候，任何事情都是一樣，只要努力在先，沒有被忽略的道理，所以要先要求自己，就會有出人頭地的一天。","榮華富貴、勤苦得之、目下雖困、後必逢時。切勿自怠、更勉修為、人事既盡、天理可知。","但存平等心、所作皆無慮、若不勤謹修、歡處必生愁。","一士人林某，問終身，占此後，習武不利，加納為泉州府牧，終於任。\n又馬生，歲科試，皆列三等。及占此，加考古學，竟以擬上林賦冠軍，遂得補廩。","運勢：正昌隆時，欲為即為，慎言行也，必獲大利。\n家庭：人丁趨旺，主者謀合，年年添丁，旺吾家人。\n財利：正逢昌運，每押皆利，利頭儲之，不宜枉費。\n事業：現押現中，即時運至，唯不可貪，貪則通貧。\n升遷：身心俱鍵，時予走動，勞心勞力，凡事躬親。\n姻緣：天作之合，兩相情誼，先友後婚，百年偕老。\n考試：多年辛勞，一舉題榜，令人興奮，珍惜些噸。\n健康：小恙是己，唯叵輕心，否則變厲，切記戒之。\n遠行：可行之耶，一路風順，唯戒飲食，爾之胃腸。\n訴訟：受人累也，退一步見，海闊天空，不予計較。\n失物：去陽之向，必有跡象，速去有望，遲則全去。","相如題橋\n漢司馬相如，成都人。未遇時，嘗過橋，見貴者車馬喧騰，慨然曰：“大丈夫當如是。”因題橋以見志。作《子虛》、《上林》賦，武帝讀而善之，召見，以為郎。會唐蒙驚憂巴蜀，遣相如責之，上乃拜相如為中郎將。後有人上書告相如使時受金，失官。居歲余，復召為郎。\n司馬相如題橋\n昔司馬相如，十年窗下，苦心讀書，貧窮不得志。其平日有志氣之人，故當入蜀過橋，題十三字於橋柱曰：“他日若不乘高車駟馬，不過此橋。”隨後果得大貴，回家經過此橋。有志者。事竟成矣。"],["上吉","祖宗積德幾多年，源遠流長慶自然，\n苦更操修無倦已，天須還汝舊青氈。","天福善、產貴子、病者安、訟得理、名必遂、仍得利、行人歸、皆如意。","積善之家必有餘慶。\n問功名，考試必中，功名有望。官員占得，表示將高升。\n問訴訟，終得直。\n問疾病，即將愈。\n問行人，即歸來。\n問婚姻，有情人終成眷屬。","此簽士人占之大吉。官員占之高擢。庶人占之終有發達。但要修心積善。方得源遠流長。不可變易祖德。自損心田。則亦有不應之時也。","凡事多得遂意。皆祖宗積德之所致。若又能順理而行。益加培植。則天之報施。決然不爽。青氈者。詩書傳家之舊物也。還乃失而復得。否而復泰之象。占者須慎守之。","從以前到現在，都是順利如意的，不像別人歷經大風大浪，這一切的吉運，是來自於祖宗的積德，經過長時間的累積，到了你這一代才得以受到福蔭，福運的流傳，是得自於天理自然，所以必須更知道珍惜，將這份善心加以延長，謹慎操守，讓福份能更加綿長，未來也將更加順遂。千萬不可因好運，而肆無忌憚地揮霍，將會招來厄運。","善惡胚胎、由人自栽、修善者泰、積惡者災。若能修持、福自天來、依舊榮華、自有安排。","積善之家、必有餘慶、子孫眾多、門戶昌盛、好修福祿、前程順意。","一士以文考黜，占此，下科竟復優等。應在四句。\n又晉江王生，其祖、父素世與考不利。即生，府、縣試亦會，取結前，而院考仍無名。光緒乙亥，將應院試，入廟禱祈，占此，自謂無望。迨榜發，竟取進。因該生頗寒，欲做青衣，苦於無力不已，轉向親朋借舊者漸穿。至簪掛日，諸同案皆衣冠蹌濟，而彼獨穿舊青衣，始悟神示靈驗異常。","運勢：尚上之示，趁此時作，必有大成，積德之賜。\n家庭：人丁興旺，加之謀合，日後之基，必有大成。\n財利：素之交往，友朋助之，必獲大利，再接再厲。\n事業：押之得之，時運至也，趁則儲之，必能致富。\n升遷：修吾身心，自吾可視，平穩踏實，必有所獲。\n姻緣：天賜良緣，珍惜些禍，修來不易，百年偕老。\n考試：上上之簽，得來不易，積德而來，再善修之。\n健康：小之恙耶，又逢華陀，不必擔憂，自我節制。\n遠行：可行之示，放大膽行，得智財兩，勇往前進。\n訴訟：挨告之方，不必杞憂，據理力爭，天眼視之。\n失物：一時之失，憶起是物，去之覓之，尚在彼處。","司馬溫公嗟困\n宋司馬光，夏縣人也，池次子。寶元初進士，累官端明殿學士。嗟嘆民困，上疏極言新法不便。哲宗初立，召拜左僕射。罷青苗法，人謂元祐相業，有鏇乾轉坤之功。卒贈太師，封溫公，諡文正。"],["中吉","奉公謹守莫欺心，自有亨通吉利臨，\n目下營求且休矣，秋期與子定佳音。","利雖有、莫妄作、訟宜和、病勿藥、名待時、婚有約、但存心、安且樂。","奉公守法，安份守己，不要做虧心事，自會有亨通吉利的好運來。目前求謀暫時不要躁進，等待秋天到來時，一定會有好訊息的。\n問疾病，宜服藥。\n問訴訟，宜和解。\n問婚姻，有望。\n謀望先難後易，秋來才有佳音。","此簽目下不宜妄取。只宜守己。官員占之。必有憂疑。若能謹守。自有佳音。士人占之。且待時來。飛騰有日。庶人占之。平安。凡有謀望。先難後易。不可躁進。安分守己。交秋自有遇合。","官吏占此。現在風波。儒士占此。目前沉困。官吏須奉公守法。儒士須積德存心。自有亨通之日。秋期佳音。應在秋後。七八九月間。主有好訊息也。","現在周圍有些許的誘惑，你必須心存正念，不可受到影響，在自己的崗位上奉公守法，未來自有吉運降臨。目前有許多欲望在內心掙扎，時機還未成熟，倒不如先放下淨空，到了秋天必會有好運到來。此簽表示現在正陷入一種內心交戰的狀態，你越想得到，就越無法達成，只要從心做起，不求回報，自會有福德來臨，未來會有苦盡甘來的收穫。","公平處己、切莫自欺、福祿雖有、更宜待時。若要進取、未可施為、凡百謀望、秋以為期。","先難後易莫相欺、謀望營為秋可宜、謹守定應多福祿、且須從緩待其時。","一人少入公門，存心忠厚，久無所遇，占得此簽。至秋，偶與一貧士結親，聘其女為媳，日後其母貴顯，此人父子因而致富。\n又泉州有林生，占財氣，得此簽。未幾，賈客郭秋期，官一林姓店伙無故自服毒身死。林生與認同宗，出為調停，因此得酬金二百，蓋神已先知之。\n又一生，占功。弟病，得此(簽)未歸家，而中途忽聞凶信。是第三句之驗。","運勢：目下平平，平而踏實，即可轉機，忍耐等待。\n家庭：人口適中，為培下代，下注功夫，方能旺盛。\n財利：忍受時艱，再等秋至，即可欲為，時與命也。\n事業：蠅頭之利，亦為利也，不宜貪婪，否則栽翻。\n升遷：調合身心，健身之後，一切平安，修吾身心。\n姻緣：先友後婚，較舊制妥，惟已有眼，否則己責。\n考試：目前不宜，再接再厲，秋期屆至，一舉揚名。\n健康：枯衰之症，改善習慣，正是根本，悉心調養。\n遠行：見機行之，夏季不宜，秋至方可，防天災也。\n訴訟：訟也不可，宜退一步，寬宏度量，即是勝訴。\n失物：去者去矣，東北之方，試探可也，恐難回之。","柳毅傳書\n唐柳毅，下第歸，至涇陽，遇女子滿面涕零。自云：“洞庭龍君之女，嫁與涇陽，遭婿暴辱。”出書一封，托寄洞庭。毅以不能入水為辭。女云：“湖邊有柳樹一株，搖之當有所見。”及至搖樹，果水中有人出，為持書去。俄邀毅入龍宮，洞庭君以女妻焉。後不知所終。"],["中吉","秋冬作事只尋常，春到門庭漸吉昌，\n千里信音符遠望，萱堂快樂未渠央。","訟漸理、病漸康、財始達、名始彰、行人近、婚姻良、家道吉、福祿昌。","秋冬平平，逢春漸亨通。凡求謀作事，至春方可遂意。只宜漸進，不可躁進。","此簽秋冬平平。一切事宜。交春方有起色。千里好音。是時可至。高堂白髮。尤保康寧。守己待時。吉無不利。","占此者。秋冬不能動作。運限平常。凡有謀望。須待來春。是時好音到耳。門庭吉昌。所謀順遂。萱堂母氏也。快樂無央。主母氏福壽綿長。","想要執行的事，在秋冬季是不會有太多回應的，只能以平凡來形容，但到了春季就不同了，可以感受到明顯的好運到來，而且會得到遠方來的好訊息，而且有所成就，高堂上的老母因此感到無比的快樂，而且福壽雙全。此簽雖然表示秋冬只是平常，但依然要十分的努力，到了春天才會有回收，如果因此而不努力，再好的運勢也是罔然。","凡事謀望、秋冬平平、春來運至、次第光亨。遠行有信、所作皆成、家道清吉、可保全寧。","凡事營求之必成、春來次第自通亨、門庭吉利皆平善、財物相應漸漸成。","一生占秋闈，不中，應“秋冬只尋常”也。若占春闈，則有可望。\n又晉江鄭姓，弟戍杭城陷，眾皆謂死，其母患之，占此。不數日同往者有人逃歸，始知尚在。越年季春，乃以計脫，方回家。全詩俱驗。","運勢：利路阻塞，秋冬過去，交春之節，即有鉅利。\n家庭：目下平安，為謀合和，是今要點，可旺象矣。\n財利：目下不宜，謹守不攻，攻之即損，待交春也。\n事業：日日生息，即可滿足，不宜奢求，交春再造。\n升遷：小心對之，調合身心，修吾身心，一切平安。\n姻緣：要君遠慮，美為條件，即錯失也，理智前提。\n考試：秋冬大考，不如理想，等到交春，必有喜訊。\n健康：倏爾攻襲，不尋常也，不宜操勞，靜心即愈。\n遠行：秋可行也，冬或危境，宜觀氣候，交春即宜。\n訴訟：明知不可，作意氣爭，不撤回也，兩敗俱傷。\n失物：失之北方，物已半毀，取回不全，認霉運也。","蘇卿負信\n漢蘇武，字子卿，使匈奴，被留十九年。有一番女奉侍甚殷，子卿納之，與生三子，歸時約其再往。迨到中國後，不克踐約。二子奉母命，來請蘇卿，置而不顧，番女責其有節而無信焉。世謂娶猩猩之女，非也。"],["下下","勞心汨汨竟何歸，疾病兼多是與非，\n事到頭來渾似夢，何如休要用心機。","訟終凶、名未通、病者險、財亦空、婚未合、是非叢、行人阻、事無終。","熙熙攘攘為名利，巧取豪奪何時休?\n問事謀，不成，徒自勞心，口舌立至，禍患來侵，不如退步，安份守己，以保全寧。\n問疾病，不利。\n問訴訟，不好。\n問財利，亦空。\n問婚姻，不合。\n問謀事，皆不如意。事雖有成，後必敗，空勞必力，只宜安份，不可妄為。","此簽謀事皆不如意。主口舌之擾。事雖有成。終必有敗。空勞心力。只有安分。不可妄為。","占者徒勞罔功。既防疾病。並多是非。當由平日慣用心機。損人利己。行險僥倖。當得此報。急宜矢願懺悔。存好心。行好事。挽回天意。方有轉機。若仍恃奸狡圖謀。正如夢幻泡影。醒來空自懊恨耳。豈有實在歸宿矣。","平常待人處事都是用盡心機，而且以私利為前題，太過耗費心力的結果，卻無法有好的回報，連帶的疾病纏身，且引起口舌是非，最後還是一身空，想要解這個危機，必須從心做起，放下私利的心，一切向善，多作有益他人的事，必能挽回頹勢。修心還要修口，謹防口舌帶來的是非，必能轉回好運。","謀事不成、徒自勞心、口舌立至、禍患來侵。不如退步、暫避山林、隨其所在、可遇知音。","謀望事多差、徒勞心力賒、若求婚與利、口舌見交加。","凡事占之，多不吉利，因詩句無一字可人意。惟有天啟甲子科山東應試，三人同占得此簽，意謂俱不中矣。後俱登科，解元名丁乙，乃悟此簽首數是“丁乙”，三人者合當中“丁乙”榜舉人也。\n又同治乙丑，補行甲子鄉試，福建主考官丁紹周。當未點差之先，晉江黃生，乳名頭，問科名，占此，不解。迨中式後，始悟亦“丁乙”、“到頭”四字之驗。","運勢：不是爾拙，是時命也，叵逆行耶，忍之受之。\n家庭：目下平平，必謀合和，世景鉅變，招來不易。\n財利：世景日衰，經濟循環，非得已也，自我小心。\n事業：守舊忍受，多謀多損，時也命也，不是爾拙。\n升遷：身心不健，懷之寒心，先調吾身，方可接應。\n姻緣：不合之性，即退為宜，知進退者，方為英雄。\n考試：無望之夢，己之無心，何必費神，改行可也。\n健康：突發之疾，令人可疑，即覓華陀，方能治痊。\n遠行：萬萬不可，出之即害，不如在鄉，求安寧耶。\n訴訟：和解為吉，如意氣爭，招來惡果，兩敗俱傷。\n失物：無以挽回，甚為明顯，再新置也，嗣後小心。","周公解夢(原本缺)\n周公，名旦，文王之四子也。輔武王伐紂，武王崩，周公輔成王，封於曲阜曰魯。周公解夢不見經傳，坊間流傳《周公解夢吉凶書》，內容以睡夢中事物卜夢者吉凶。《禮記•周禮•春官》：“掌其歲時，觀天地之會，辨陰陽之氣，以日月星辰，占六夢之吉凶：一曰正夢，二曰噩夢，三曰思夢，四曰寤夢，五曰喜夢，六曰懼夢。”"],["中吉","不分南北與西東，眼底昏昏耳似聾，\n熟讀黃庭經一卷，不論貴賤與窮通。","訟莫爭、病難愈、名與利、莫貪取、問行人、信尚阻、能修善、有神助。","不管是東是西，是南是北，閉隻眼，裝聾作啞巴，何必去計較世俗的貴賤窮通呢。\n問疾病，難愈。\n問訴訟，莫興。\n問行人，信尚阻，能修善，自有神助。","此簽不宜妄想。只宜謹守避禍。作福修善。自有神助。失意反成得意。無望反成有望。若貪圖躁進。不唯無益。更恐反遭不測。占者慎之。","東西南北。四方也。眼昏耳聾。戒勿招惹是非也。言凡四方閒事。總宜避之則吉。黃庭經。乃是修道之書。讀者消遣。不為貴賤窮通所縛。可得安靜之樂。凡事退守。動輒得咎。","分不清東西南北，眼睛看不清楚，耳朵也聽不到，表示不受外在環境的影響，只管自己的事，則可保平安。若多管閒事，則會招來厄運，而且會殃及池魚，必須要很小心，明明與自己無關的事，卻會惹來一身麻順。不如修養身息，不問俗事，不管貧富貴賤，平心處之，則可避禍。此時不宜急進，必須退守，動則招禍。","吉凶禍福、報應分明、若知祈禳、如谷應聲。無分貴賤、宜養精神、定則能慮、福自駢臻。","是非莫管、一任紛順、見如不見、聞如不聞。","一生會試，將揭榜，占此，竟不第。\n又一人問終身，占此。後中年失明，妻子俱喪，寄居道院，至老安康，眼目反明。此熟讀《黃庭(經)》之應也。\n又光緒乙酉科，晉江一文會十餘人於鄉闈前同占此簽。榜發，惟王生取，雖第四名經魁，始悟“黃庭經一卷”五字之驗如此。\n又一朱生，將應院試，亦占此，入場竟坐東號舍。有為","運勢：運限已到，求之善法，天予以時，一舉成功。\n家庭：人口趨旺，各懷所思，由主謀和，必有益也。\n財利：財之為物，人人必需，今年平平，再謀之可。\n事業：不拘蠅頭，小利亦利，小心處之，必有轉機。\n升遷：身心調之，受之即安，事事戒之，必可保全。\n姻緣：不宜結合，八字不合，且有差異，另謀他路。\n考試：謀功名可，惟代價大，天資不足，後天失調。\n健康：雖是小恙，不可輕心，恐釀大病，小心為之。\n遠行：可行之也，入秋之時，見氣候順，即安心矣。\n訴訟：萬萬不可，和為貴也，宜思訟也，一切平安。\n失物：尚可尋覓，往東北方，或有存之，再探乙次。","莊子慕道\n莊子名周，蒙人，為周•漆園使，其學無所不闚。楚威王聞其賢，遣使厚幣迎之。周曰：“千金重利，卿相尊位也。子獨不見犧牛乎?我寧遊戲以浹吾志焉。”慕清靜無為之道，師事老子，著《南華經》等書十餘萬言。"],["中吉","春夏纔過秋又冬，紛紛謀慮攪心胸，\n貴人垂手來相援，休把私心情意濃。","訟解憂、病漸瘳、財祿有、忌遠謀、行人動、婚莫求、防口舌、免悶愁。","要有所成就，必須要除去私心。如果一年到頭，只是斤斤計較一已的利害，不會有什麼成就的。\n問訴訟，必因彼此猜忌而起，如果能夠誠意談判，有和解的希望。\n問疾病，不樂觀。\n問婚姻，談不攏。\n問財利，要防劫財浪費。","此簽謀望難成。徒勞心力。幸有貴人接引。必須托以心腹。不得又聽邪佞之言。私心擬議。進退不決。失此機會也。","春夏秋冬。總計一年之久。謀慮紛紛。日久無成也。貴人相接。是好機緣。私意情濃。是自己游移無主。聽信不實也。戒占者切勿如此。則貴人可靠。謀望有成矣。","至少已經持續一年了，在你心裡不上不下，無法解決，就這樣日復一日，時間越拖越久，心裡越磨越煩，總是無法處理，好不容易有貴人出現，你必須敞開胸懷，真心以待，才能解決。如果你心存懷疑，又加上道聽塗說，讓自己猶豫不決，只是會失去這個機會，讓自己陷入深淵之中。目前出現的貴人是相當可信的，不要失去這個可貴的機會，則會有所成。","一歲營謀、未有發達、方得貴人、垂手提挈。漸漸亨通、可免激聒、莫信私人、巧語間諜。","訟解憂兮病漸瘳、財物凋零莫妄求、行人動作婚難就、口舌須防免唧啾。","一人出外抽豐，其父在家占此。其子客居數年，竟空手而回，所得盡付花柳之費矣。","運勢：時下平凡，不得輕視，貴人來扶，即可轉盛。\n家庭：家合事成，各懷思想，不易和睦，由主人持。\n財利：目下平凡，獲利不多，不能輕信，他人看法。\n事業：依我本份，不可勉強，強行作之，必有損失。\n升遷：先調吾身，而後放心，另予修身，必有所獲。\n姻緣：天作之合，宜多了解，不宜速決，否則後悔。\n考試：功與名耶，身外之物，可追之也，回頭看己。\n健康：多年宿疾，一旦復發，小心延醫，悉心照料。\n遠行：目下不宜，氣候不順，天災地變，叵能預測。\n訴訟：順乎天理，官民皆服，方能勝訴，必須檢討。\n失物：方向渺茫，失去即休，不必再追，回即奇蹟。","蕭何追韓信\n漢•蕭何，沛人;韓信，淮陰人。時漢王燒絕棧道，部下將士逃亡甚多。其時信歸漢，逃去，何知之，連夜追信回，翌日王知，怒曰：“將士逃亡過半，不聞丞相有所追，獨追信，何也?”何曰：“大王如無意東伐，固罷;若與楚爭天下，非信莫當其任。”乃拜信為大將。"],["下下","一山如畫對清江，門裡團圓事事雙，\n誰料半途分析去，空幃無語對銀缸。","訟終凶、宜謹防、病者險、主重喪、行人阻、財有傷、婚不合、謹行藏。","風水雖吉，命運未通，家門招禍，好事成空，夫妻離散，骨肉西東，凡事不遂，有始無終。\n問財利，必無。\n問訴訟，必凶。\n問疾病，有危險，防有死亡。\n問婚姻，不合，行人有阻。","此簽先吉後凶。有始無終。防有盜賊之侵。死亡之慮。夫妻折散之憂。親友嫌隙之咎。主家業退敗。人口凋零。大凶之兆。急須種德挽回。庶可化凶為吉也。","一山如畫。言墳宅風水頗好。門裡團圓。言現在家口亦安。奈浮雲變幻。吉凶無常。忽有半途分折之憂。空幃獨守。言淒涼不堪也。凡事得中有失。吉處藏凶。早宜思患預防。或可減半。","陰宅方位得山得水，是不錯的風水，目前家庭幸福、工作順利，但天有不測風雲，誰都無法預期到突然間會有巨大的變化，不只家道中落，還會有生離死別之苦，未來的淒涼之狀，令人垂淚，及早面對如此的災禍。此劫是無法避免的，雖然目前還是如意的狀態，也只是風雨前的寧靜，儘早預防，可減少傷害，天理循環，非你我可改。","墳宅雖吉、命運未通、家門招禍、好事成空。夫妻離散、骨肉西東、凡事不遂、有始無終。","漫夸根蒂自堅牢、到底須知力枉勞、設得十分奇巧計、卻妨中路被風濤。","一人妻病，占此遂亡。應“半途”云云。\n一堪輿托人薦於富室，彼已有先至者，應“門裡”云云。兩人各為異論，與主家不合，皆不用而返，應“半途”、“空幃”云云。\n又一婦人，產後未滿月，母子得病，占此，不數日俱亡。應“事事雙”並後兩句也。\n又一家兄弟兩人，將應試，同占此，後俱游庠。蓋“誰料半”得“隹”字，“途”折去僅存“辶”，二者合成“進”字，故宜其入學也。","運勢：不予時命，奈何可也，最好守之，待時機到。\n家庭：人口眾多，皆可旺盛，人謀不藏，分散離崩。\n財利：此業夕陽，多方探悉，該歇則休，不宜冒險。\n事業：押之走之，無一利頭，可知暫守，方度難關。\n升遷：身為壯年，卻先衰弱，今又不得，先調身可。\n姻緣：兩者之姓，不合之相，非常顯明，互退者贏。\n考試：無以言對，時命不吉，改行可也，叵夢想耶。\n健康：突發之症，延請名醫，否則延誤，後悔不及。\n遠行：萬萬不可，去之不利，不如在鄉，守之可成。\n訴訟：雙方不利，唯一救路，雙方和解，否則雙敗。\n失物：去者去矣，自我小心，是一警惕，嗣後醒吾。","王昭君和番（一）\n昭君姓王，名嬙，字告月，絳州人，漢元帝宮女。得罪畫工，為點崩夫痣，致不見幸。昭君以才貌雙全，自傷不見知，會匈奴求婚，乃自上書請行。臨去，步入掖庭，顧影徘徊，君臣相顧失色。然不能失信於單于，故遣其和番，而斬畫工毛延壽等二百餘人。\n王昭君和番（二）\n漢君欲立正宮，訪得江南王知府有女十八曰昭君。毛延壽索賂曰：“薦為正宮者金銀百萬兩。”其父家貧，只送百金。毛怒，即起身帶其女不辭而別。堂上破女面，回奏曰：“小臣頗識相面，王女雖美，但左有一痣，必主凶亡。”昭君遂入冷宮。後八月中秋帝游，忽聞嘆聲，召出昭君曰：“毛延壽索賂不遂，命官引至半路，欲姦奴身。因不從，被其點破麵皮。”帝即擇日立昭君為正宮。毛延壽逃至番王處，把昭君玉照獻番王，番王興兵伐漢取昭君。毛領兵而來，漢敗。番王曰：“交出昭君退兵，否則寸草不留。”昭君自抱琵琶，上馬出宮。兵退至界口，昭君投水自殺，番王又投水自殺。王弟剝毛延壽皮，即登帝位。昭君傳夢漢王：“可立我妹為正宮。”封其父為左丞相。"],["上吉","功名富貴自能為，偶著仙鞭莫問伊，\n萬里鵬程君有分，吳山頂上好鑽龜。","名與利、在晚成、訟得理、病漸亨、問遠信、阻行程、婚可合、孕將生。","不可躁進，欲速則不達。\n問名利，在晚成。\n問訴訟，得理。\n問婚姻，可成。\n問疾病，漸安，先凶後吉也。","此簽不可躁進。欲速則不達也。功名富貴。遲速有時。待時而動則吉。鵬程有分。定可達到。名必成。財必遂。運程坦坦。轉瞬揚眉吐氣時也。","功名富貴。有志竟成。他人先鞭得意。不必羨慕。鵬程有分。科第無疑。不過稍遲耳。吳山系杭州山名。鑽龜。卜也。若問地方。當主浙省。凡事謀為如意。先難後易。晚景榮華。","經過長時間的努力，功名利祿自然而成，看著別人總是先馳得點，也不必太忌妒，事有先後，不見得先努力就會先成功，每個人的機運不同，但此簽表示成就會較遲，並非不成，所以不必心急，默默努力，終會功成名就，急躁則會壞事。雖然現在顯得辛苦，但晚景必定順遂，為了未來的享樂，只好現在辛苦點了。","富貴分定、遲速有時、藏器以待、切莫怨遲。掀天事業、時至即為、若到天邊、便可決疑。","榮華有分、未得其時、他人早達、切莫恨遲。","一淅中人，父子因兵失散，占此。因上吳山卜卦，至廟門，見有父尋子招貼，遂訪見其父，驗如此。\n又龔廣文，將應院試，占此。時學政吳伯新尚書也，果入泮。","運勢：正逢昌吉，此時把握，十載可過，適時儲之。\n家庭：人口興旺，珍惜福報，統籌之人，宜防未雨。\n財利：時運輪至，事事如意，不宜趁機，擴大牛肺。\n事業：入春即旺，把握今年，事事順暢，必有大成。\n升遷：身勇心健，可欣可賀，事事戒之，必可保全。\n姻緣：天作之合，兩姓亦和，椿萱點頭，即美滿耶。\n考試：十年寒窗，天助人助，一舉成名，莫操心耶。\n健康：小恙者也，不宜輕視，修吾身心，即可痊癒。\n遠行：可行之時，惟小心行，世況愈下，豈可輕心。\n訴訟：非為己出，為人售來，寬宏大量，世人景仰。\n失物：去陽方時，一時不慎，回復得知，可回來耶。","羅隱求官\n唐•羅隱，字昭諫，錢塘人，工詩，稱為羅江東(參見《泉州人名錄•羅隱》)。吳越錢鏐闢為節度判官副使。嘗說鏐：“討朱溫，縱無功，猶可保杭越。奈何交臂事賊，圖謀顯達為終，古之羞乎?”著作甚多。"],["中吉","焚香來告復何辭，善惡平分汝自知，\n屏卻昧公心裡事，出門無礙是通時。","訟和吉、病禱安、名有望、財頗難、婚可合、行人還、宜向善、保團圓。","燒香禱告有什麼用呢?什麼是善?什麼是惡?你自己心裡有數。只要你能夠公平正大，不暗昧欺人，出門做事，自然亨通而無阻滯。","此簽顯然告人遷善去惡。秉心公正。自有通達之時。若不覺悟改悔。鬼神暗裡先知。何能掩蔽。恐不免咎殃之踵至也。","凡人為善去惡。人雖不知。己獨知之。若使欺其不知。昧公濟私。損人利己。必至自招凶咎。戒占者當公平正大。不欲勿施。自得人事亨通。全無阻滯。速宜返躬自問可也。","何必求神問卜才能知善惡，是非進退自在人心，你心理自有尺度，什麼是對、什麼是錯，公理自在人心。若要人不知，除非己莫為，不可因為他人不知而為之，必須心存善念，不可有害人之心，因利己而損人，將會招來厄運，一旦排除了利己之心，一切所為皆為公正，不論何處，都能暢行無阻。","作善降祥、作惡降殃、何必禱神、當自揣量。公心莫昧、勉為善良、前程遠大、可保全康。","計欲陷人終自陷、欺心暗裡鬼神知、若能改善求天福、轉禍為祥事事宜。","一人公門不利，占此，乃棄去為商，大獲厚利。應在三四句。\n又晉江鄭生，將赴院試，占此後，果入泮。末句驗甚。","運勢：將至之時，目下守之，叵衝過頭，否則栽坑。\n家庭：轉旺之時，人口可增，惟謀合要，合而有力。\n財利：平凡之時，可得微利，亦得滿足，時運未屆。\n事業：春夏不佳，轉秋之季，突出轉機，即有大利。\n升遷：今之身心，予以調適，必可平安，請神佑之。\n姻緣：互為觀人，優劣互補，久而合之，即結之可。\n考試：先天不足，後天失調，今知發奮，可拚之耶。\n健康：一時突發，潛伏已久，詳檢身心，一勞永逸。\n遠行：可行之時，惟見氣候，審察之也，安全回鄉。\n訴訟：可退之也，忍之受之，世人肯定，即雙贏局。\n失物：失於西方，審慎思之，為何失去，可尋回矣。","邵堯夫祝香\n宋•邵雍，字堯夫。年三十從父徒居河南，於書無所不讀，精易理天文術數。居慎，凡所祝香，皆為國為親之事，未嘗私禱及己也。初除試將作監主簿不起，繼除穎州團練推官不就。卒贈秘書省著作郎，元祐間謚康節。"],["下下","蛩吟唧唧守孤幃，千里懸懸望信歸，\n等得榮華公子到，秋冬括括雨霏霏。","莫問財、休斗訟、遠未回、病且重、婚無成、多怪夢、且禱神、勿妄動。","表示希望落空，如夢幻般空歡喜一場而以。乃凶多吉少之兆。\n問謀為，不遂意，空自惆悵，縱有虛喜，終是大憂。\n問疾病，恐生不測，主有死亡之虞。\n問婚姻，難成功，即成亦難圓滿。\n遠行不宜，恐有一去不返之憂。","此簽主有死亡之患。哭泣之哀。凡事不利。有名無實。有始無終。家運凋零。前程蹇滯。作大陰功善事可解。","秋景孤幃。蟲聲唧唧。最為淒涼苦況。千里懸懸。幾番盼望。等到榮華公子。似是好音。誰知意外不測。又生出一番苦惱。括括霏霏。正是不堪境象。凡事慎守為佳。","獨守孤幃，只有蟲聲唧唧，是多么淒涼的景象啊!只有靠著心中的意念維生，盼望著遠方的他能有好訊息，好不容易等到了衣錦榮歸的伊人，卻又如夢一場，是那么短暫，秋風愁雨，苦不堪言，令人哀淒。此簽是如此地悲苦，一切的厄運如影隨形，揮之不去。此時不宜有任何的決定，不如堅守本位，以不變應萬變，靜待世局的變化，再苦的運勢，就當作是上天給你的磨練。","作事無聊、空自惆悵、縱得好音、依然淒憐。謀望不遂、心神徒喪、家道未安、禱神陰相。","不宜問事不宜行、九日常憂十日驚、一段榮華如一夢、翻來覆去總無情。","占功名必得，但恐憂繼之，然所應又有不同。\n有一生占此，入學抵家，遭妻之喪。\n又一生占此，中式，鏇時則值淫雨連綿。","運勢：目下不佳，待轉機時，方可向前，亦不遲也。\n家庭：人丁未旺，武微之慨，修身行善，可救之也。\n財利：陷入低運，時也命也，不得抗之，抗則再降。\n事業：世景日下，不為君錯，只好認命，待貴人扶。\n升遷：成習之疾，先治身疾，即可望有，早日治之。\n姻緣：外表固要，但心更重，各懷異想，何以偕老。\n考試：今之大考，火候不足，降一求之，或可即有。\n健康：雖屬小恙，置之不理，恐發並症，小心對應。\n遠行：萬千不可，出之阻礙，不如在鄉，三餐穩飽。\n訴訟：明知敗跡，自認其非，歉之其疚，可獲原諒。\n失物：失之北方，明知其所，尋覓不得，啻好新添。","孟姜女思夫\n孟姜女，秦始皇時人。夫范杞郎，派作長城，久役不歸，故思之。"],["中下","北山門下好安居，若問終時慎厥初，\n堪笑包藏許多事，鱗鴻雖便莫修書。","病擇醫、訟宜解、謹修為、過必改、財杳茫、名遲疑、婚宜慎、行須時。","只宜守舊，不可妄想。投機事業決不可做，否則必敗無疑。營謀事業，事先要有問疾病，宜擇醫。\n問訴訟，宜和解。\n問婚姻，應詳打聽對方，以免將來後悔。","此簽宜守舊。不可妄為。作事謀始。無貽後悔。凡事謹密為要。不可浪透信息。反此。則有意外之咎。","好安居。現有一安樂境界。慎厥初。須是早為區畫。不可妄動。事多包藏。自具寬宏之志。修書慎重。莫通鱗鴻之音。機事不密則害成。更防口舌之釁也。","目前處於安樂生活，有點遠離塵囂的狀態。若想知道最後的結果，倒不如從最初開始就及早規劃，則會有美好的未來。你知道的事情相當多，但千萬不可走漏訊息，尤其是有人向你打探訊息，不如一笑置之，免得招來禍患。更謹防書信上的泄密，不可有‘別人不會知道’的心態，倒不如什麼都不說，將可保有安居樂業的生活。","靜處安身、是非莫理、欲保終吉、作事謀始。無惑人言、切防害己、勿輕傳信、暗中有鬼。","仁里安居善自全、有時暗地結姻緣、對我好談心曲事、莫將隱奧與人傳。","江右一貴人，寓金陵，卜墳葬父，占此後，屢擇不中。因出麒麟閣觀地，偶見門外一山，遂問鄉人山名，對曰北山，即得佳地。乃悟首句之驗。","運勢：目下不運，不得欲試，一試硬知，守勢方可。\n家庭：人口稀微，且分西東，久而疏去，亟待謀合。\n財利：求之枉然，守之可也，蠅頭之利，亦是利也。\n事業：守之即可，冒然沖之，徒勞傷神，人之時運。\n升遷：有之時也，身心不適，竟且走矣，俟明年耶。\n姻緣：此緣不宜，龍虎鬥之，必有一傷，不如分手。\n考試：吾雖盡力，命之限也，功名緣盡，妄思何益。\n健康：新舊病出，令人懊惱，小心處之，終獲痊癒。\n遠行：不是時季，天災地變，叵測之物，宜小心耶。\n訴訟：可解不結，昔聖示之，是為真理，必須退之。\n失物：無回歸時，物已全毀，嗣後小心，是警惕耶。","陶淵明賞菊\n晉•陶淵明，字元亮，在宋名潛，世號靖節先生。少好高尚，博學善文，宅邊有五柳，自號五柳先生。後為彭澤令，郡遣督郵至縣，吏白當冠帶見之。嘆曰：“吾不能為五斗米折腰。”即解印去，賦《歸去來辭》以見志。性愛菊花，每清晨賞之。"],["上吉","新來換得好規模，何用隨他步與趨，\n只聽耳邊訊息到，崎嶇歷盡見亨衢。","名終成、訟得勝、孕生男、保無病、行人回、婚宜定、事雖遲、有餘慶。","一切作為要自己作主，要走到人家前面，才會有成就。如果一昧跟隨他人，那是沒有用的。\n問疾病，可痊癒。\n問訴訟，終得勝。\n問婚姻，雖有波折，有情人終成眷屬。","此簽謀望盡好。須是自己變更。莫聽人言主使。誤走程途。不久好音即到。始雖崎嶇難行。後自亨衢通利。是為先難後易之象。","規模新換。去舊從新也。何用隨他。自作主張也。耳聽訊息。好音即到。崎嶇歷盡。苦去甜來。亨衢。是康莊大路。一往平平坦坦。吉無不利也。占者須謀為決斷。志氣堅定始驗。","隨自己的意願做改變，將是最好的選擇，不須受他人的影響，他人的危言聳聽，將使你誤入歧述，要謹防受影響。即將有好訊息的到來，儘管經歷過重重坎坷，接踵而來的將是康莊大道，先苦後甘。此簽表示先難後易之象，但最重要的是不要被別人的意見所左右，只要依自己的意願做個大改變，將會有美好的未來。","謀望更改、修為盡好、何必依人、自可達到。須歷艱難、必獲好報、平步青霄、榮捧恩詔。","改換規模又一般、門庭增喜轉眉顏、文書到手皆成就、宜訟宜婚病亦安。","吳下一富生，隨友南京援例，占此。後因循花柳，金用過半，而事不成。後過耿姓年諠，稍為青口，竟以儒士得中鄉試。應在後三句。","運勢：隆昌之時，必有可為，小心對之，把握時機。\n家庭：人丁漸旺，家門順昌，多行善舉，必添丁口。\n財利：放手一搏，可得大利，時也命也，珍儲可也。\n事業：押之得之，一本萬利，宜事存蓄，以防老耶。\n升遷：身心兩全，今之身也，受之安全，生也安全。\n姻緣：終身大事，操在吾手，保持理智，確認後行。\n考試：今年開花，且得結果，是由勤來，再力行之。\n健康：雖是小恙，亦宜悉心，擴大其疇，恐出人命。\n遠行：出之可也，必遇貴人，為此扶持，大有可為。\n訴訟：天理昭昭，不必畏懼，惟訟通凶，宜和解之。\n失物：是一警訊，嗣後小心，可回之也，有失去也。","漢光武陷昆陽\n漢•光武帝劉秀尚末王，兵至昆陽。(王)莽命王邑、王尋將兵百餘萬，並驅虎豹犀象以助軍威。光武兵僅數萬，自將步騎千餘為前鋒，破其前軍，諸將繼進，莽兵大潰。會大風雨，虎豹股慄被殺，尋、邑遁去，盡獲其軍實輜重。東漢之興，賴此戰也。"],["上吉","自南自北自東西，欲到天涯誰作梯，\n遇鼠逢牛三弄笛，好將姓名榜頭題。","訟無定、終有遇、病多憂、擇醫愈、信即到婚終好、凡所謀、慎勿躁。","先難後易!\n問名利，先難後成。\n問疾病，擇醫終愈。\n問訴訟，反覆無定，終得直。\n問婚姻，雖有波折，終談成。","此簽現在事務皆無定準。訟必反覆。婚有變易。遇子丑月日。或年分。可許遂意。功名初年艱難。子醜科青雲直上。吐氣揚眉。凡事先難後易。盡人事以待天時可也。","南北東西。乃男子四方之志。天涯遼遠。日前不得階梯。進身無路。待遇鼠逢牛之年。或月日。自有貴人提拔。士人聲譽洋溢。名登金榜。商賈財利勃發。家宅產業興隆。婚姻和合。冤枉申雪凡事有成。時運未至不應。","男兒志在四方，但卻不知所措，任何一方都無出路，未來遠在天涯，卻不知從何處前進。等到鼠牛年交會之際，會得到貴人相助，可一舉成名或成就一番功業，所以現在要有所準備，一旦時機到來，則會有成。遠在鼠牛年，近在子丑月或日，忍耐目前的困頓及茫然，等待時機。","若求名利、先難後有、白日青雲、必在子醜。聲譽顯赫、題名榜首、百事亨通、顯然在後。","歷涉艱難、求謀未遂、富貴榮華、晚景順利。","一生甲子科，占此，鄉會連捷，是應“遇鼠逢牛”四字。蓋占科名，凡遇子丑年必捷也。\n惟泉州一生科試，占此。場內經題“自西自東”兩句，放榜時剛值子月丑日，竟列在三等首名。全詩之驗如此。","運勢：平步之初，步步為營，穩紮穩打，必能致富。\n家庭：漸趨日旺，人丁興旺，宜修其品，貢獻社會。\n財利：步步為營，不可著慌，行之穩紮，信用可靠。\n事業：小心步營，世景不佳，必有小成，不必貪婪。\n升遷：身心健全，隨時調適，身心調之，受之即安。\n姻緣：時久見心，先友後婚，破除傳統，亦是己責。\n考試：有志功名，今至半腰，依己奮拼，必可上頂。\n健康：從未罹疾，疾之突來，得小心對，培抗病力。\n遠行：暫不可去，私人事雜，不得分身，彼處不利。\n訴訟：誠實申述，官亦衡量，往後不再，可寬宥耶。\n失物：可回者也，惟有破損，修之復之，警惕己可。","劉文龍求官\n野史：劉文龍，漢時人，學問極淵博。因求官而同王昭君出塞和番，與妻分別十八年，回時家中老幼俱不相識。"],["中吉","我曾許汝事和諧，誰料修為汝自乖，\n但改新圖莫依舊，營謀應得稱心懷。","病更醫、訟改圖、名與利、換規模、婚別議、行人遲、神力助、謹修為。","人非聖賢，孰能無過，過而能改，善莫大焉。\n問問事業，宜改圖，或更換設備，守舊則沒有發展的希望。\n問疾病，要更換醫生。\n問婚姻，另外再談。凡事更改方稱意。","此簽宜反己問心。毋乖神意。恐有惡事惡念。急須改悔。前次所謀不合。從此更新整頓。自有稱心之時。若怙惡不悛。及畏難苟安者。則無濟也。","前事見許。本有機緣。修為自乖。所謀欠妥。改新圖。另作計較。莫依舊。戒勿因循。營謀稱心。往者可復。失者可追。否則可泰也。凡事去舊從新之象。","原本神明給你一個順遂和諧的道路，但因自以為是的個性，將天助好意破壞掉了，而且還懷有不好的念頭，在還沒害人之前，就會先害到自己，還是儘快將歹念去除，重新立定目標，只要沒有害人之心，未來更將得心應手，運勢得以否極泰來。不管任何事，都有除舊更新之意。","神許和合、自乖所為、急須更變、方得其宜。心行正直、毋好自欺、若能悔過、天必相之。","改舊從新別有因、莫乖行止拂天神、管教中路多成就、穩趁舟航涉利津。","一生久困科場不利，占此遂改武學，後奉旨文料，中武生。\n一人此生竟聯捷，成文進士。應改圖而遇，仍獲所求也。","運勢：時運露面，由此轉捩，放手一搏，必有收成。\n家庭：依吾本份，踏實行之，事事稱心，千萬小心。\n財利：不景之中，尚可生存，即平素可，受人肯定。\n事業：暫時守之，猛衝落井，世景如此，非君之拙。\n升遷：平素修身，加之積善，身心健全，必有好報。\n姻緣：命中注定，兩者之合，久見人心，和則合可。\n考試：積德子弟，天助人助，猜之對之，貢獻社稷。\n健康：明知違和，速就醫可，遲延即危，不得輕意。\n遠行：可行之時，惟途中也，自我審慎，豈可差錯。\n訴訟：據理力爭，不必藏匿，坦誠以對，必獲原諒。\n失物：及時尋之，尚有可能，損也可回，苦惱多時。","董永賣身\n漢•董永，千乘人。少失母，獨養父，流寓孝感。父亡無以葬，乃從人貸錢一萬，日後無錢還，當以身作奴。葬畢，道遇一婦人，求為永妻。永與俱詣錢主，令織縑三百疋以償。一月而畢，辭永去。乃曰：“我天上織女，緣君至孝，玉帝令我助君償債。”言訖，凌空而去。\n漢•董永，千乘人。少失母，獨養父，流寓孝感。父亡無以葬。乃從人貸錢一萬，日後無錢還，當以身作奴。葬畢，其主要董永日取柴一擔、汲水四擔、鋤田六七畝，辛苦難當。一日上山砍柴倦睡，皇天見其孝行，即差仙女下凡為婚。董永醒來見女，恐是妖精。女曰：“吾無父母又無依，欲結為夫婦。”董永見其淒涼，帶女回歸。主人責董永拐帶婦人禍及其主，後暫留該女，遍訪四方家庭並無失婦人，才允成親。董婦百日織得錦五十丈，剪一半往市賣出得銀，贖脫董永身。後將錦進，敕封進寶狀元。仙姬(回天)，曰：“天賜兒子，三歲送還。”。後其子十六歲中狀元，衣錦還鄉。"],["中吉","一紙官書火急催，扁舟速下浪如雷，\n雖然目下多驚險，保汝平安去復回。","功名遂、好求官、病訟險、終必安、失物在、行人還、婚宜遠、利不難。","先凶後吉之兆。\n問謀望，目前雖然障礙重重。只要毅力去克服，終究會成功。\n問訴訟，雖然官司己成，或人己被收押，但清者之清，必能還你清白身。\n問疾病，目前雖然嚴重，只要信賴醫生的醫治，必能痊癒。","此簽先凶後吉。若問謀望。自有好處。病者慮險。自有解脫。訟事驚惶。漸得安泰。宦途主有風浪。終不為害。凡事存心。默仗神佑獲吉。","一紙官書。乃係衙門公事。火急催者。急如星火也。浪聲如雷。江行驚險之狀。保汝平安。遇險不為害也。去復回。言去來得以自由。終獲安貞之吉矣。","遇到了不可抗拒的因素，必須冒著極大的風險前往，看起來危機四伏，但在神明的保護之下，均能化險為夷，最後平安歸來。此簽有先凶後吉之象，雖然遇到驚濤駭浪，但都能平安化解，如果不遇到這些危險之事，也無法進入到平安之境，當進入吉運之後，前面所遇的災難就自動化解消逝了。","官書火急、激聒之兆、目下雖驚、終無紛擾。有神陰扶、收功談笑、往來平安、吉星高照。","先驚未是驚、後喜方為喜、若問謀事多、連綿無定止。","一生會試，值以人命搆訟所阻。占得此後，司憲見而奇之，許令應試，遂中春榜。全詩皆應。\n此占，凡問病無有不瘳者。惟(清)道光間，一人患中風症，占此後雖平安，但病根終不能除耳。是“去復回”句之應也。","運勢：中上之運，為世人上，滿足可也，秋景加喜。\n家庭：命合添丁，世局紊亂，多行善舉，必有助益。\n財利：中之運也，盡己所能，奮發力拚，將有成也。\n事業：大道生財，無以欺人，謙可受益，信用鞏固。\n升遷：身心調之，安心舒適，時予檢身，必有轉機。\n姻緣：男者英俊，女為佳麗，外表相配，必可結合。\n考試：君爾辛勤，歷盡艱辛，終能償願，榜上有名。\n健康：雖是輕症，悉心調治，否則命危，不能輕心。\n遠行：出行去也，先甘後苦，欣逢神貴，衣錦還鄉。\n訴訟：兩方退之，即可息訟，再興者也，財產去半。\n失物：一時不慎，失去小物，不必費神，再添置可。","玄德公黃鶴樓赴宴\n漢•劉備，字玄德。獻帝時，群雄割據，曹操挾天子令諸侯。玄德未得四川，借荊州托足。周瑜計請赴宴，設伏挾討。幸孔明授趙雲密計，得免於難。此系俗傳。考史：赤壁合兵拒操時，瑜計請玄德，設伏欲害之。因見關公在場，不敢動手。"],["中吉","汝是人中最吉人，誤為誤作損精神，\n堅牢一念酬香願，富貴榮華萃汝身。","事多錯、訟莫作、病禱神、且勿藥、婚莫求行人還、能自悔、利名全。","萬事皆從忙裡錯，但將心地細思量，若能謹守無他望，可保終身大吉昌。\n問事業，須重新檢討，把錯處改過，自然順利。\n問訴訟，宜忍讓，最好和解。\n問疾病，能多做祈禱，自然早愈。\n問行人，歸期尚遙遠。","此簽本非惡人。卻有惡事。當由見識不明。及被人引誘所致。未免得罪神明。速宜悉心懺悔。力持善願。以冀感應。將來富貴有準。榮華可期。唯在一念挽回。毋終執迷自誤也。","吉人。善人也。言此人向本善良。現在作為皆錯。損精神。所圖無益。只害自身也。堅牢一念。戒占者即宜回心向善。酬香願。言善功久積。心愿可酬也。富貴榮華。前因過誤削除。後此善願堅牢。仍萃於一人之身矣。轉禍為福。明者悟之。","你本來是個心也善良的人，但在周圍引誘之下，做出了錯誤的事情，不僅胡作非為，還因此傷了自己，趕快重拾善念，用最誠摯的心向神明懺悔，只要回心轉念，原本善良的心而重新出發，則能彌補之前的過錯，得到神明的幫助，榮華富貴將隨即出現。此簽要告訴你，知錯能改，善莫大焉。","心行平等、反誤非為、急宜改過、切莫自欺。盡誠作福、神必佑之、榮華富貴、付汝非遲。","萬事皆從忙裡錯、但將心地細思量、若能謹守祈神佑、可保終身大吉昌。","一生本富人子，性傲，不敬其父，屢中副榜。占得此簽，改悔行孝，父子俱安，享壽以終。倘不能改，豈惟不中，禍將不免矣。全詩之意顯然：能改過勝酬香願矣。\n又(清)鹹豐間，(泉州)郡西華仕舖(轄奇仕境、華仕境，參見《泉州舖境》)端午節，土著循俗例迎木刻龍頭，與東佛舖民口角。邑尊聞知，飭差嚴拿該舖。惟奇仕宮香火甚盛，老尼有錢怕累，因到廟占此。迨事情完局，富貴之家分文不肯看破，衙行賠禮等費悉萃老尼之身。第四句之驗如此。","運勢：時至夏至，有轉唳時，忍受可也，必有轉機。\n家庭：人丁日旺，可喜之象，唯謀合也，不可忘之。\n財利：走低之時，宜小心行，操作留意，否則虧損。\n事業：為求上進，計畫擬就，世景日下，收斂可也。\n升遷：可享之年，先調適之，必有成也，珍惜可也。\n姻緣：相對相適，學經相當，先友後婚，必有成耶。\n考試：本最吉人，奮力不足，外人關心，己宜奮勉。\n健康：作禍釀災，自吾治之，悉心治療，藥到病除。\n遠行：行之為艱，勤勞作之，終能獲償，勿行勉強。\n訴訟：平素之誼，時之今日，發揮效力，不失友誼。\n失物：物已全毀，如獲首謀，可獲賠半，小心自己。","王莽篡漢\n王莽，字巨君，漢•孝元皇后之侄也，以國戚一門貴顯。莽繼叔父遺烈，當成、哀、平帝享國不永，統嗣三絕，位居宰相，封新息侯。假行仁義，自比伊、周。弒平帝，立孺子嬰，竊周公之法，攝位改元，竟移漢祚，國號曰新。後被漢兵所殺，傳京師百姓爭食其肉。"],["中吉","好將心地力耕耘，彼此山頭總是墳，\n陰地不如心地好，修為到底卻輸君。","心既好、地亦美、病即安、訟得理、財勿求、且守己、行人至、終有喜。","不可妄求，但依本分，方得天之保佑。\n問地利，不宜遷改。\n問行人，必至。\n問疾病，則安。\n問財利，目前無，且宜守舊。\n問訴訟，必凶，宜和息。\n凡事只宜修積善心，庶免災禍。","此簽勸人竭力存心。中心為忠。如心為恕。凡事人己兩平。不可為損人利己。及欺心謀吉之事。心地好時。自沐天心庇蔭。發福悠長。彼謀吉者。欲得陰地。先損心地。計亦左矣。豈能及存心者之萬一乎。","心地。心中隱曲之處。力耕耘。如力田者之用意栽培也。山頭之墳。彼此皆系祖宗。不可侵害謀占。陰地猶是地理。心地乃是天理。天理作主。地理隨之轉移。陰地不如心之地。彰彰明矣。修為。指耕耘心地者言。卻輸君。言不知存心者。未可同日而語也。善惡分途。吉凶自判。占者審之。","有人為了求得好運，總是在陰宅上處心積慮，希望求得一塊福地，能夠旺子孫、旺家業，但卻忘了修好心田，如果只是一昧地找好陰地，但心地卻有損人利己之念，最後陰地還是會輸給心之地的。此簽是要人從心做起，只要心中有善念，不蓄意為惡，就像是一塊良田，在心中滋長，為人們帶來最大的善報。","好修心地、莫用他求、但依本分、可獲天麻。勿與人競、福力自優、子孫之慶、皆善之由。","人已營謀用意同、好將心地問天公、若還虧卻分毫理、萬事教君吉又凶。","一生原籍江右，在南京應考，府、縣俱取。人知而攻之，不得進院。占此，遂往原籍，竟首取。系二句、三句之驗。\n(清)道光戊戍(1838年)，先嚴秋嵐公，將應院試，占此時，杜給諫胞弟亦在廟求此簽。榜發，先嚴與杜之弟皆入邑庠。應“彼此”、“總是”四字也。後先嚴中式，而杜以庠生終，並尾句亦應。——王錢(“竹”字頭)謹識。","運勢：不是上運，此時守之，研磨將來，方能轉昌。\n家庭：善人善心，可過知心，貴人扶之，凡事皆成。\n財利：善求勿狡，騙人一次，信用全去，不可不慎。\n事業：目下互約，財氣則通，生意日隆，笑逐眼開。\n升遷：平安養性，積善得之，請神佑之，必有好報。\n姻緣：辰相佳好，天作之合，配合得宜，百年偕老。\n考試：恨鐵未鋼，願訓勉之，終能償願，再接再厲。\n健康：雖是小恙，必擇良醫，走錯門路，後果堪虞。\n遠行：目下不可，俟時運屆，出行才可，平安為重。\n訴訟：所幸訟理，穩紮穩打，最好和解，否則兩傷。\n失物：失之不意，勿爾聞訊，喜出望外，謝天謝地。","高祖遇丁公\n丁公為楚•項籍將，逐窘漢高祖於彭城西。兵短接，高祖急顧曰：“兩賢豈相厄哉!”丁公乃還。及高祖即位，來謁。帝曰：“丁公為臣不忠，使項王失天下者也。”遂斬之。曰：“使後為人臣無傚丁公也。”\n丁公告高祖\n《喻世明言•第三十一卷》載：閻王殿上，丁公訴曰：“某在戰場圍漢皇，皇許平分天下，故放。皇稱帝後，反遭殺害。”漢皇以丁公背項羽故誅之。丁公辯曰：“紀信替皇死，卻不封贈;項伯不忠，反賜封侯;雍齒為項將，後封什方侯。”漢皇無言以對。"],["中平","君是山中萬戶侯，信知騎馬勝騎牛，\n今朝馬上看山色，爭似騎牛得自由。","名與利、勿貪求、訟莫興、難罷休、行人遲、婚莫許、謹修為、當靜處。","凡事如果投機取巧，到時必會弄巧成拙。安分守己，以靜制動，事方有成，並可免災禍。\n問遠行，必有阻滯。\n問訴訟，必凶。\n問疾病，多險。\n問婚期，不理想。","此簽宜守舊安享。自有山林之樂。不可貪求意外。如其不然。或嫌遲求速。或厭舊而喜新。或舍近而圖遠。或棄小而謀大。如騎牛者改換騎馬。及至騎馬。又想騎牛。懊恨躊躇。勢難中止。事貽伊戚耳。少年未經閱歷之人。每每似此。切宜戒之。","萬戶侯。富貴封王之。山中境遇。暢快者亦不減此。騎牛雖遲得安穩。騎馬雖速冒險阻。馬上看山。言舍安穩而就險阻。不自安常處順也。及至馳驟驚惶。勞苦困頓。不能收韁。卻想騎牛時。安步徐行。何等自在。然已追悔莫及矣。何如先時慎重。勿至輕舉妄動之為得哉。馬牛。或斷年月亦驗。","明知騎牛才安全，但又貪圖騎馬的快感，當你選擇了騎馬時，就等於舍安穩求快速，但也必須經歷快速所帶來的危險，然而騎在馬上的驚惶，又讓你想要騎牛，但這時已來不及了，你只能心想著安危，無法顧及山上的風景，此簽告訴我們，凡事要謹慎而行，不可想到什麼做什麼，還是要全面考慮。","本等富貴、已勝常人、愈吉愈貪、禍及己身。宜依本分、當享和平、勸君靜處、可免災運。","要作惺惺成蒙懂、誰知蒙懂作惺惺、多生巧計須成拙、守己方才事稱心。","一生，丑年歲考三等，午年考優等，科舉省城，占此下第。但生本貧士，邊方僻遠，盤費不資，大為所困。此“不如騎牛”之驗也。","運勢：失之不意，勿爾聞訊，喜出望外，謝天謝地。\n家庭：人人皆善，即可添丁，修吾身也，旺盛吾族。\n財利：不宜猛衝，時局不允，應知進退，不是爾拙。\n事業：保持平衡，即可滿足，時局所造，不必擔憂。\n升遷：算來平安，注意調適，不可勉強，必有瑞慶。\n姻緣：先友後婚，世人通則，眼光放大，理智清醒。\n考試：雄心勃勃，可欽可佩，為時運也，降一求之。\n健康：不是絕症，可居安耶，不得輕視，悉心治之。\n遠行：目前不宜，俟秋季至，自有轉捩，耐心等之。\n訴訟：伊人兇狠，悉心對應，人間凶心，必察之也。\n失物：己之不慎，失之西南，速去是地，或可保之。","孤兒報冤\n孤兒，即晉•趙武也。史稱，父朔為屠岸賈所殺。朔妻，成公姐，遺腹生武。賈索之急，賴程嬰、杵臼救之。臼以假孤兒出首，自殺。嬰乃抱趙氏真孤，匿山中十五年。後韓厥言於晉景公，立趙氏後，即孤兒也。遂攻屠岸賈，滅之，以報一門之冤。"],["中平","與君萬語復千言，祇欲平和雪爾冤，\n訟則終凶君記取，試於清夜把心捫。","訟莫興、恐遭刑、財莫貪、病未寧、行有阻、婚難成、且循理、保和平。","要求免禍，必須自身謹慎修省，只要心地善良，禍端自然消滅於無形。\n問興訟，不利，訟則終凶，應自反省。\n問婚姻，好事多磨，但如經得起考驗，則有情人終成眷屬。\n問謀事，不可心急，心急則事反不成，正所謂“欲速不達”也。","此簽。凡事心氣和平。聽人勸阻。錯誤早悔。反自問己。毋使剛愎自用。怙過不悛。致成凶咎。訟事尤戒。雖有怕生冤抑。只宜平情解散則吉。","萬語千言。再三叮嚀也。平和雪冤。情理排解也。如是則可以無訟矣。訟則終凶。一定之理。君記取。戒占者仔細思量。毋貽後悔也。清夜捫心。謂此事恐欠道理。問心不過。不如及早回頭。之為愈也。占此。宜省悟。不可冒昧。宜退止。不慎動作。後患莫測。","一而再，再而三地交待，以和平的方式處理，不可因為自認有理，就對簿公堂，只要以訴訟的方式處理，則必招來厄運，不可能有對自己有利的結果。不如自己平心靜氣下反問，也許會覺得有失公道，但不是自己認為的就是對的，只要早日打消訴訟的念頭，則早日去除厄運。不可急進，只宜退守，則不會有難。","訟則終凶、不可多說、若得和平、舊冤可雪。凡所謀望、皆當謹節、反求諸己、禍端自滅。","心地好時身自吉、何須巧計去鑽天、勸君靜處勤修省、禍及身來不可捐。","一富人，累為少年無賴所騙不下百金，欲往訟之。占得此簽，乃清夜捫心：昔未富時，曾得一人數十金未償，其人卒無後，記其死之日，即此人生之時也。乃驚悟，再與少年十餘金，約有死者兩倍之數目，此不復生端矣。","運勢：走入低壑，小心應對，不宜強行，否則慘敗。\n家庭：人丁散落，為收束耶，從吾修身，必能轉機。\n財利：四面局勢，不利世人，君亦在內，守舊可也。\n事業：守之三餐，即可滿足，經濟恐慌，風靡全世。\n升遷：身心狀況，今甚惡劣，宜調適身，方可保全。\n姻緣：萬萬不可，根性不合，互退去也，有益一生。\n考試：功名絕緣，書不為官，為生活用，觀念改之。\n健康：舊疾復發，比上次劣，所幸新藥，救爾一命。\n遠行：出去外鄉，一切生疏，宜己留意，否則堪虞。\n訴訟：訟之不得，古時聖賢，訓誡者也，捫心三思。\n失物：去也何方，己亦無憶，且是小物，不宜再追。","楚漢爭鋒\n項籍既滅秦，宰割天下，自立為西楚霸王，封沛公為漢王，陰弒義帝於江南。漢王乃拜韓信將，舉兵伐楚，定三秦，取鹹陽，為義帝發喪，責楚弒逆之罪。與楚戰於成皋、榮陽間，大戰三十，小戰七十，爭鋒五年。迨英布降漢，范增貶死，楚乃勢孤，被漢所滅。"],["中吉","登山涉水正天寒，兄弟姻親那得安，\n幸遇虎頭人一喚，全家遂保汝重歡。","遇貴人、訟和平、病驚險、莫求名、財物耗、婚宜停、逢寅字、事漸亨。","家道不安，須防孝服臨門，兄弟分離，財產耗散。","此簽景況艱難。人口欠安。凡事類多齟齬。幸轉眼之際。恰有一貴人從中得力。誠以指示迷途。須識機緣所在。悉心聽從。自得骨肉團圓。人情和合。凡謀遂意矣。否則倀倀然之。豈有安全。保聚之樂乎。","登山涉水。謂涉歷艱難也。兄弟姻親。合內外言。那得安寧。內外不寧也。虎頭。謂盧虞之姓。或虔州處州上虞虞城各地名。一曰晉顧愷為虎頭將軍。應在顧姓。必得此人。為之喚醒。自保全泰。重歡。謂離者可使複合。失者可使復得，危者可使復安也。若遇此人。而不知省。則失之矣。","目前正處於混亂險阻的狀況，全家大小兄弟姻親間全都不和，鬧得全部雞犬不寧。虎頭人，表示姓盧或虞等有如虎頭字的人或屬虎的人，經過此貴人的指點，將破除兄弟內外之間的不睦，重修舊好，家運將轉危為安。但是當遇到虎頭姓的貴人而不自知時，可能會失去這個大好機會，不得不注意，千萬別失去這個可讓家運好轉的良機。","歷涉艱難、時運輒左、家道不齊、事多坎坷。遇富貴人、提挈方可、倘無所濟、難逃後禍。","先難後易本天然、幾度勞心事不全、若得貴人提挈處、管教騎鶴與腰纏。","嘉靖間，上海城被倭寇番圍急，城中之人占此。不數日，果有盧參將統兵解圍。\n又一人官派築，占此，得顯宦顧姓者求解始免。俱應“虎頭人一喚”也。\n又晉江縣謝生，光緒七年科試，場前占此。寅日發榜，取列一等，遂補廩。查該生歲進科幫，是應“保汝重歡”四字也。","運勢：命運轉吉，小心應對，把握時機，大吉大利。\n家庭：造德作福，切莫自欺，人人合和，必有所成。\n財利：平平之局，求得有財，蠅頭之利，亦利頭耶。\n事業：莫辭辛苦，勞心勞力，得以報酬，後景甚佳。\n升遷：必有之耶，唯調身心，不可忘也，方可保全。\n姻緣：自吾評價，是否可宜，以理智衡，己必負責。\n考試：勤而拚耶，十年寒窗，堅守其道，終獲桂冠。\n健康：宿疾復發，速去就醫，延遲不得，自我小心。\n遠行：候至冬至，利益可得，得利即回，不得遲延。\n訴訟：伊人蠻橫，不與計較，與之同類，忍則贏耶。\n失物：失之東方，速去尋也，物尚全耶，嗣後小心。","趙五娘尋夫\n趙五娘，漢•蔡伯喈之妻也。伯喈仕為議郎，在京別立家室，久羈不歸。父母死，妻為治喪訖，乃進京尋夫。事見《琵琶曲》。與史稱蔡邕，字伯喈，陳留圉(今河南杞縣南)人，建寧三年辟司徒喬玄府，拜郎中，校書東觀，遷議郎，其事親以至孝聞，迨出兩人歟。"],["下下","彼此家居只一山，如何似隔鬼門關，\n日月如梭人易老，許多勞碌不如閒。","名利阻、且休問、訟宜和、病有願、婚姻遲、行人遠、欲獲吉、且安份。","彼此同住在一個山頭好比內外一般，為什麼竟像隔一道鬼門關那樣不能相通呢?家庭不和，一家人同床異夢，各懷異志，既欠團結，則謀事難成。","此簽主情意隔角。不遇扶持。看似密邇相連。其實咫尺天涯。勢同秦越。智士知己知彼。舍此另投。或有遇合。若信。文貌周鏇。口頭熱鬧。外密中疏。終鮮實際。不唯耽誤時日。更費趨候奔走之勞。此等人為世詬病久矣。奈何其弗之省也。","彼此家居。誼屬鄰里。只一山。過從甚便也。鬼門關。言其肝膽隔別。不啻陰陽分界也。歲月如梭。言盼望無期。空自遲誤。許多勞碌。言所倚非人。所謀非計。枉受奔波之累。則何如識透人情。消閒自在。其不綽綽然有餘裕哉。戒占者勿妄交。勿枉己。勿輕信。","雖然與周圍的人看似親近，但卻從未真心地相待過，猶如陰陽兩界，是無法跨越的。在快速的時間飛逝下，人也漸漸地不再年輕，但總是所託非人，無法成事，白忙一場，倒不如什麼都不做，生活過得倒還比較自在。此簽表示無法和他人情意交流，無法相信別人，只相信自己，但又交待錯人，一生都是如此，所以別再相信不該相信的人了。","安閒易處、出門有阻、時迍易過、枉自勞苦。且宜守舊、隨分而去、運未亨通、那宜進取。","形跡如親實不親、相看只作鏡中人、謀為動作皆無定、只恐虛名不得真。","一人居住省城，欲往外驟生理，占此。人以簽不吉，止之不聽。離家只四十里，在外終日忙碌，無人可安，三年不得回，竟卒於外。首二句之驗也。\n又光緒間，桐郡(刺桐城，即泉州)鄭姓有子，染病延醫許氏，服藥未效。有人薦一何姓老醫，其父遲疑莫決，占此，乃信必托與高年者，竟不數日而愈。益恍然於“如何似”、“人易老”、“許不如”此九字，儼然若為斯人作焉。","運勢：不宜貪取，貪者通貧，天神予禍，不可不慎。\n家庭：人丁散去，討生活計，惟先收束，以利團結。\n財利：四面局勢，不允蠢動，動之授損，不是汝拙。\n事業：局勢所趨，人人自危，所從之業，能飽三餐。\n升遷：身心之虛，受其阻礙，立即調適，否則堪虞。\n姻緣：兩姓不合，明知不可，即宜分手，以免後悔。\n考試：雖是肯拚，書不為官，修一技長，享受終生。\n健康：突發之症，令人束手，速求名醫，即可救耶。\n遠行：暫時不可，時也命也，強行之者，立即應驗。\n訴訟：休斗可也，再斗兩敗，甚為明顯，忍之受之。\n失物：去陽之際，不慎遺落，去尋覓看，恐難回手。","張子房遁跡\n漢•張良，字子房，韓人。其先五世相韓，秦滅韓，良散家財遁跡，欲為韓報仇。乃使力士懷鐵錐，擊始皇於博浪沙上，誤中副車。始皇大索天下，十月不獲。後佐漢定天下，功成謝絕人事，託名與赤松子遊。"],["上吉","人說今年勝舊年，也須步步要周旋，\n一家和氣多生福，萋菲讒言莫聽偏。","出入吉、財物多、孕可保、病即瘥、婚易成、訟宜和、問行人、奏凱歌。","只要把握住方針，不聽信讒言，謀事可就。\n問疾病，得愈。\n問婚姻，談可成。\n問財利，多進，百事亨泰。","此簽主年運亨通。時和歲稔。家旺人興。然修身乃齊家之本。禮教實門內之防。必須周規折矩。仁讓雍雍。方遂和平之福。更忌婦人搬弄。宵小離間。是為萋菲讒言。不可偏聽。斯家道成而流澤長矣。凡事謹慎和平則吉。","今年勝去年。人事漸漸順利。步步循規矩。舉動不可疏虞。和氣致福。須宜妻子。睦兄弟。感召吉祥。讒言莫聽。須存見解。厚包容。慎防偏倚。凡事盡人事以應天時則可。恃天時而廢人事。則不可。可不慎諸。","今年明顯地比去年要好，運勢也漸漸順遂，只要亦步亦趨地循規蹈矩，全家和樂融融，則會有更多的福氣，要小心女人間的是非，言語離間是破壞的導火線，不必過於聽信，得來不易的好運不可因此而破運。此簽表示要從人和做起，等到適和的天時，則會旺家旺族，不可等到時機已到，才要調整人事，則會浪費天助好運。","謀望勝前、卻宜進取、人事周鏇、禍消福至。勿信讒言、惶惑思慮、慎終如始、切莫顛墜。","剝復亨迍遞往還、今番管許勝前番、婦人言語君休聽、家道興衰在此間。","一人惑妻言，欲與弟分家，占此感悟，依舊同居。後其弟遠商，獲利數萬，與兄同享，數世安居。第三句驗甚。\n又鯉城(泉州古稱鯉城)郭補卷，與余總角交也。庚寅病重，其弟以年近五旬，且身體素弱，非溫補不宜。余薦種禾堂醫士吳和尚舍力，用清涼，闔家訝焉。占此服之，火候始見，竟以和藥奏功。亦第三句之驗也。——竹坪又識。","運勢：運頭已浮，即思即行，必有所獲，把握時機。\n家庭：人人和之，由一主也，主持家事，必能有成。\n財利：押之得之，雄心勃勃，可助苦幹，不宜過頭。\n事業：押之得之，事事順暢，千萬不驕，否則必敗。\n升遷：身心調適，正當時也，留心生活，必佑佳音。\n姻緣：街可之緣，惟多觀察，認可則結，否則分手。\n考試：百尺竿頭，再接再厲，必可得耶，且是高耶。\n健康：雖是小恙，必須悉心，戮力以赴，否則變卦。\n遠行：行之可歟，去之小心，到處埋伏，保吾為先。\n訴訟：由爾退之，不是落敗，是勝贏兆，彼人敗退。\n失物：明知去北，失於該地，速去看也，必可回來。","蘇東波勸民\n宋•蘇軾，字子瞻，號東波居士。知杭州，歲飢，勸民平糶，發倉廩賑濟。又遣使四出治病，活者萬計。有逋(欠)稅不償，軾呼詢之。云：“以夏扇謀生，天寒難賣，非故負也。”軾令取廿余柄來，據案草書，及畫枯木竹石。其人持出，眾以千文爭買一扇不得，盡償所逋。"],["上吉","君今百事且隨緣，水到渠成聽自然，\n莫嘆年來不如意，喜逢新運稱心田。","名漸顯、訟漸寬、財自裕、病自安、行有信、婚可定、命漸亨、心必稱。","做事營謀，要積極努力，只要辛勤耕耘，自然會有收穫。求到這首籤詩，大抵先問婚姻，表示有情人終成眷屬。\n問事業，有生意，漸遇亨通。","此簽暫時安分。後此漸有機緣。不求自至。切勿因近年謀為不遂。常自嗟嘆。人事有得有失。命運有否有泰。一到亨通之時。名成利就。自有吐氣揚眉之日也。","百事隨緣。言目下聽天安命。不用強求。水到渠成。言水勢所到之處。自成溝渠。原系自然之理。非人力所能逮也。前不如意。往事困頓之境。喜稱心田。後此行運之時。凡事不可欲速。久久自有成就。","過去也許有點受阻的感覺，但凡事只宜隨遇而安，不可過度強求，運勢走到此時，有水到渠成之勢，只要順其自然，一切將會相隨心轉。不要怪罪過去的不順遂，如果只會怨天尤人，就算好運來臨也只是擦肩而過，以歡欣的心情迎接好運勢的到來，一切將會更稱心如意。此簽表示一時的受阻，不必太在意，即將來臨的好運才是值得珍惜的。","目下謀望、且隨緣分、一朝榮達、身顯如願。休自嗟怨、待時遷變、漸遇亨通、好事疊見。","一生勞碌不曾閒、幾度牽纏名利關、漸遇亨通堪稱意、後來容易只先難。","一人占得此簽，屢涉江湖不利。一人解之：“自君命日子屬土，以水為財，四柱無水，屢行不遂。三年之後行癸水，自當大發。”其後果然。應“水到渠成”、“喜逢新運”之驗也。","運勢：正逢天時，吉人天相，且遇貴人，可欣賀也。\n家庭：人人合和，積善餘慶，可欣可賀，謀合為要。\n財利：金銀倍殖，善求必有，毋忘公益，當有庇佑。\n事業：久年斯業，信用奠基，人人拱之，今可豐收。\n升遷：身心調適，已達上景，安心處之，平安養性。\n姻緣：上選之人，互傾慕意，門當戶對，配合得宜。\n考試：文運通達，己又苦讀，本次必題，勿忘修德。\n健康：宿疾復發，立即就醫，不得稽延，可治痊癒。\n遠行：今可出之，正逢其時，好事臨門，獲利即回。\n訴訟：循以天理，無以畏懼，雖可勝訴，費神頗鉅。\n失物：明知北方，即去尋覓，必可出現，速去可耶。","御溝流紅葉\n唐朝•宣宗宮內，韓夫人不蒙寵幸，偶向紅葉題詩一首，流出御溝。一應試官人顧況(於佑)，於御溝邊拾得紅葉，上題詩云：“流水何太急，深宮盡日閒。殷勤謝紅葉，好去到人間。”況亦拾紅葉，戲和之云：“愁見鶯啼柳絮飛，上陽宮女斷腸時。君恩不禁東流水，葉上題詩寄與誰?”也從御溝中流將進去。天子知此事，即把韓夫人嫁與於佑，夫婦百年偕老。按：御溝題葉名有四，姑錄其一。"],["上吉","兀坐幽居歎寂寥，孤燈掩映度清宵，\n萬金忽報秋光好，活計扁舟渡北朝。","名晚成、利遲得、病漸安、訟終息、孕無驚、婚姻吉、行人回、事勝昔。","十年寒窗無人聞，一舉成名天下知。\n問功名，上吉。\n問婚姻，有成功的希望。\n問訴訟，將得勝。\n問疾病，漸痊癒，可以說是百事皆吉之兆。","此簽現在光景落寞不堪。幾無復有起色。豈知通塞無常。剝復遞轉。不意之間。頓有好音。自北而至。或已向北而往。名利即在此中。滔滔順利。凡事有意外遇合。","幽居寂寥。無人援助。孤燈掩映。形影自憐。極言寒微不堪之苦。秋光好。主秋間有好訊息。黃金。即一紙家書抵萬金之意。渡北朝。應在北方。活計扁舟。言輕帆徑渡。活計在指顧間。可不勞而成也。先憂後樂。待時則吉。","目前處於時運不濟之時，度過無數個孤獨寂寥的日子，意味沉寂地等待，終於等到好運的到來，大約會在秋季，而且是忽然間就會有好運來，將原來停滯不前的運勢，一下子就打通了，而且輕鬆容易地過生活，完全沒有生計上的問題，好運或許來自北方，或是必須往北方去，一切在命運中，自會有安排，目前的困頓將是未來順意的基石。","席珍待聘、休嗟未遇、忽際明時、青雲穩步。好音一來、得意高舉、凡事必諧、皆有佳趣。","幾載青雲志未酬、此心憂處不成憂、庚辛得遇真知己、破浪乘風作勝游。","此簽秋闈決中。\n一生占得此簽，果於子丑年鄉會連捷。\n又前明一生，南場屢試不利，占此遂改北朝監，竟聯捷。此第四句“渡北朝”之驗。\n又國朝(清)，郡(泉州)前輩陳繩菴先生占此，鄉闈中第二名。是科解元榜，後磨勘草去。應首句“兀坐”、“寂寥”也。\n又晉江黃生，於鄉試前在通淮廟占此，至榜發果中第二名。蓋增一畫，即是元，亦“兀”字之應焉。","運勢：順星高照，照耀其人，多年修來，珍惜此刻。\n家庭：人丁興旺，又添新丁，可喜賀也，謀和為要。\n財利：善心求之，童叟無欺，必有豐收，儲之蓄之。\n事業：君運正時，押之對之，把握現時，頂峰之年。\n升遷：祈神奉佛，平安養性，身心俱佳，必有好報。\n姻緣：天作之合，珍惜善緣，永浴愛河，百年偕老。\n考試：螢燈雪堆，為君照明，動讀導之，光明即至。\n健康：突發之症，所幸醫技，留住三叩，自我小心。\n遠行：出之可也，爾運正時，獲利即回，時勢險多。\n訴訟：可和即和，省事事省，人生安寧，最為可貴。\n失物：記得南方，一去便知，是物完好，速去即得。","匡衡夜讀書\n漢•匡衡，字稚圭，東海承(今山東蒼山蘭陵鎮)人。好學不倦，讀書夜以繼日，累官太子少傅。朝廷有政議，輒引經以對，言多法義。數上書陳使宜。後拜相，封樂鄉侯。當微時，夜讀無擎可焚，私鑿鄰家之壁，偷光映讀，其勤苦有如此者。"],["下下","艱難險阻路蹊蹺，南鳥孤飛依北巢，\n今日貴人曾識面，相逢卻在夏秋交。","病與訟、皆不利、名與財、亦阻滯、孕有驚、行未至、若遇貴、事方濟。","現在仍然不得志，自己雖吃了不少苦，還是一無所成。不過，從今天起，你開始轉運了，到夏秋之交，會有好訊息的。\n問疾病與訴訟，皆不利。\n問功名與財利，亦阻滯。","此簽歷涉艱險。謀為不遂。不知避凶趨吉。反自捨安就危。與南鳥北巢何異。須待貴人得力。幸今日已經識面。將來夏秋之交。必有應驗。名利可成。婚姻可合。孕育可許。凡事先有機兆。而後成之。","艱難險阻。事緒紛擾之象。路蹊蹺。顛墜不可保也。南鳥北巢。言其流離失所。不可安處也。貴人識面。今日已有機緣。可望提拔。相逢夏秋交。言應在夏間。或秋間。或夏秋相接之際。於此時必得貴人之力。可無艱難險阻之憂矣。占者須待人而行。擇人而與則吉。","總是比別人多花許多的力氣，還是倍受阻難，而且顛沛流離，重重難關，似乎永無天日，運勢無法順遂，就如南方的飛鳥獨自朝著北方而去，等著它的是冰天雪地，並非春暖花開的天堂，也可說是去錯地方了。如此的阻運必須有貴人相助，才能有所改變，你的貴人是你已認識的人，但是必須在夏秋之交再度重逢，你才能因貴人的指點而改變運勢。要注意貴人的出現，不要錯失轉運的好機會。","艱難歷遍、作事皆非、南鳥北巢、失其所依。夏秋之交、貴人相提、應稱謀望、榮達可期。","謀為先阻後還亨、此際心機莫亂行、若得貴人提拔處、諸般方可事圓成。","宋•紹興中，閩人施宜生陷賊中，百計得脫避，淮上占此。入金獻策，金主擢居上第，累官尚書左丞。以出使至宋，泄漏軍情，獲罪。此“南鳥北巢”之驗。\n又(清)同治戊辰(1868年)，余同五邑諸芸友占此。後惟南安楊生，坐東號舍見售。亦“南鳥孤飛”之應也。——竹坪識。","運勢：時之不予，何必慨嘆，忍其一時，必極即反。\n家庭：心存正直，積善為要，一己之行，影響全族。\n財利：今年時勢，不合君業，守之可耶，俟明春交。\n事業：斯業夕陽，見時局也，非改業叵，時勢所趨。\n升遷：汝時運低，莫可奈何，必有成也，珍惜可也。\n姻緣：兩者不合，明知即分，堅持下去，害人害己。\n考試：字隨身寶，明知值千，惟爾無緣，改業可也。\n健康：一時入險，悉心照料，延請名醫，必能治痊。\n遠行：不逢其時，叵勉行也，時命不逆，方是君子。\n訴訟：萬萬不可，訟則凶也，先退不敗，是贏之兆。\n失物：回手無望，添置新可，是警惕耶，嗣後小心。","劉玄德入贅孫權妹\n劉玄德，即西蜀先主也。為荊州牧時，甘夫人(劉備妻)新喪，東吳•孫權聞知，詐以妹招贅，欲賺其入吳，索討荊州。孔明料知，乃授趙雲錦囊計，保先主入吳。(東江招親)竟弄假成真，娶孫夫人以歸焉。有曰：“周郎妙計高天下，賠了夫人又折兵。”"],["中平","萬人叢裏逞英豪，便欲飛騰霄漢高，\n爭奈承流風未便，青燈黃卷且勤勞。","財未遂、名未超、訟不宜、病未消、婚難信、行路迢、待時至、百事饒。","雖有大的抱負，但是沒有機會讓你表現，只好韜光隱晦，多充實自己。\n問功名，沒有希望。\n問新營事業或擴張業務，時機不好，徒勞心力，最好仍守舊。\n訴訟最好和解。\n問婚姻，未成熟，應該稍待。","此簽主功名沉滯。時運未濟。雖然自逞英豪。志圖沖舉。然如舟楫未及洪流。鴻毛不遇順風。仍須守待。唯用功於青燈黃卷之中。皇天不負苦心人。將來自有發跡。慎毋欲速。毋怠惰。功夫既到。天機自合耳。凡事以艱難得之。","英豪。指奇傑之士。萬人頭上。超出萬人也。飛騰霄漢。自負一蹴青雲之志。然事勢有次第。時運有遲速。承流風未便。時未可。勢未可。如魚不得水。鳥不得風。何能快意順利。黃卷青燈。士人本業。守勤勞。用功待時也。時至方許稱意。現在宜守舊。宜安分。不可妄為。","想要超出眾人之上，而且自負有超脫的能耐，只可惜天地萬物有序，並非有崇高的理想，就一定能達成，必須等待時機的到來，現在是時運不濟之時，就如船遇淺灘、羽翼無法順風，無法依自己的意願而行，必須努力度過這暗潮洶湧的困境，等待好運勢的到來。目前必須努力在讀書或自修上，人在困惑之時，可從書本中找到答案，而且不可有懈怠之心，必須勤勞努力，等待好運。","謀望過高、便其遠到、爭奈時乖、徒自狂躁。且宜守己、勉行善道、直待時亨、凡事皆好。","強取強求不自知、箇中綿力本差池、狂風逆水皆為患、險阻艱難在此時。","一生少年鄉榜高魁，迨會試時占得此簽，後竟累舉不第，三任教職以終其身。不負“青燈黃卷”之驗。\n又(清)同治甲子(1864年)，福建漳州府城為發逆(太平天國)所陷。時陸提林軍門將帶兵進剿，先占此，後果不利。第三句簽語驗甚。","運勢：平凡之年，無損則可，時亨之至，可獲大利。\n家庭：人丁正旺，今又添丁，形端存正，凡事遂意。\n財利：財運將至，多方研究，予以押之，一開便知。\n事業：斯業正興，多方研議，就敦先進，方有前途。\n升遷：吾身失衡，先調和耶，即可有之，修德為先。\n姻緣：先見識心，而後行之，可合兩姓，培養情感。\n考試：勤讀數載，終有所報，珍惜此生，循規蹈矩。\n健康：一時突發，病因潛伏，宜自小心，醫技可痊。\n遠行：再待一時，不宜一時，速則敗事，審慎為之。\n訴訟：謀和之道，求和非輸，後日見之，即知吾贏。\n失物：失去之物，在東方耶，速去尋之，回手可望。","蘇秦刺股\n戰國•蘇秦，洛陽人，師鬼谷子。遊說秦王，書十二上其說，不行。裘敝金盡，憔悴而歸。至家，妻不下機，嫂不為炊，秦慚怒。得太公陰符，發憤苦讀，困怠時用錐刺股，痛而再讀。後以合縱之說說趙，聯六國抗秦，竟佩六國相印。"],["中平","勤耕力作莫蹉跎，衣食隨時安分過，\n縱使經商收倍利，不如逐歲廩禾多。","休問貿、莫貪財、訟宜解、病無災、婚可就、遠行回、戒出入、福自來。","有一份耕耘，終有一分收穫，何必去羨慕人家的豪取巧奪呢?投機取巧，終有一天，會身敗名裂，還不如安分守己，來得長遠受益。\n問訴訟，宜和解。\n問疾病，可痊癒。\n問婚談，有成功的希望。最重要的是莫強求。","此簽戒營謀務本。衣食隨緣。不可貪求。不可過分。若務商賈奇嬴之利。必至使用心機。慣行刻剝。財利終不永久。何如耕作勤儉之人。自食其力。倉廩充實。豈非裕後傳家之長計乎。凡事宜守舊。仕人不可改商。定主虧折。若由商改士則吉。庠序食廩米。仕宦食廩祿。","耕勤力作。農家本計。莫蹉跎。戒勿虛度歲月也。隨時安分。戒不可貪求意外之事。經商倍利。乃逐末者所為。終不可恃。廩米多。言田家力田。逢年倉廩廣積。較經商為安穩也。大眾宜靜不宜動。宜勤不宜惰。宜儉不宜奢。宜約不宜貪。占者審之。","努力耕作不懈怠，則會衣食無缺地過著好日子，所謂的耕作是指實際操作的工作，並非是從事商業，此簽告戒不宜從商，雖然從事商業有更大的收穫，但利益大的事情風險也很大，眼前的利潤有背後的風險，可能會有更大的損失，無法有穩定的收入，倒不如從事公務員，可以有穩定的收入，長時間的累積，也比從商要好很多。此簽建議，如果目前從商，必須改行從事穩定收入的公職較好。","衣食自足、強求則損、不如歸耕、種植為本。縱巧經營、豈能長遠、安分守成、榮達未晚。","守己須防巧用心、皇天有眼不虧人、只宜安分休更改、恐怕災殃及汝身。","一生自負交誼之廣，終歲出遊，所得之資，時遇劫攘，或殖貨回，虧折大半。占得此簽，乃發憤攻苦，竟得補廩，後以明經出仕。此第四句之驗。\n又泉郡(泉州)陳生，踰冠時窘甚。鹹豐癸丑(1853年)歲試，有友欲托場內代作，已定議，其母偵知，不許答應。因詣廟請示，占此，乃以神語並母命卻之。是年該生古學正案，俱列第一，得補廩缺。應在後二句，而“歲廩”兩字尤確。","運勢：時將轉佳，待之已久，把握此時，直升可慶。\n家庭：人丁漸旺，合和為重，分散四方，多謀合族。\n財利：逐步為之，不可急之，時命配之，必可豐收。\n事業：令人差強，應可滿足，隨時研習，開拓新境。\n升遷：先清吾心，獨凡神明，清心寡欲，必有所成。\n姻緣：爾見踵伊，伊心可印，先培情感，可促成耶。\n考試：有志功名，求上進者，心田良耶，今有望也。\n健康：立即赴所，急之可救，小心照料，必可痊癒。\n遠行：出非得已，今不適時，迨秋交後，即可行也。\n訴訟：非爾願意，伊人兇狠，惟神佑之，終獲大勝。\n失物：去之西方，明知即去，叵延誤耶，有望回手。","包龍圖勸農\n宋•包拯，字希仁，合肥人，官龍圖閣學士。由進士出身，常守鄉郡，不少屈法以殉鄉曲。惟貴粟重農，欲民知耕，吏治推第一。為御史時，危言鯁論，烈如秋霜。尹開封，權貴斂跡。人以笑比黃河清，雖童稚婦人亦識其姓名。謚孝肅。"],["下下","心頭理曲強詞遮，直欲欺官行路斜，\n一旦醜形臨月鏡，身投憲網莫咨嗟。","莫興訟、勿求財、病有崇、行人回、婚宜慎、難信媒、行正直、免凶災。","自己理曲，還要強詞奪理，來掩飾自己的過錯。只想用欺騙的手段來走非法的路子，一旦事情敗露，身投法網，接受法律制裁，則後悔也來不及了。","此簽主有瞞心昧己之事。官非口舌之災。始時譸張為幻。希圖幸勝。一旦水落石出。機關破露。致遭刑憲之累。自作自受。理所應得。復自嗟嘆何益乎。凡有機事機心。及早悔悟免禍。","理曲詞遮。明明不循道理。虛言粉飾。是自欺也。更欲欺官行邪。乃是健訟斗詐之謀。則欺人矣。總之皆是欺天。天鑒不容。醜惡自露。臨月鏡。言如月之光明。鏡之澄徹。豈有遁形乎。於是法律不容。自投罪網。害人終自害。悔無及矣。人慎毋墜此孽障哉。","雖然心裡知道理由不夠充份，但仍然以花言巧語在遮飾，此種個性易惹官非，就算在公堂之上，照樣自圓其說，欺官騙上，並非自認有理就會贏，畢竟夜路走多了，還是會露出馬腳，可以騙別人，但無法騙自己，一旦事跡敗露之後，所有罪刑都原形畢露，總會受到法律的制裁，到時不必怨嘆。如果能從現在起有所改變，以真心相待，相信必可免除一場牢獄之災。","心邪理曲、飾詞欺公、明鏡照破、必致終凶。何如退步、正直是從、庶免其禍、可保厥躬。","訟累皆由自己招、十場煩惱九場焦、不如退步求安靜、只把明香向佛燒。","一生占入學，後果與選。\n又一生占科舉止考，雖見遺，後遺才收錄。蓋“應身投憲網”之句也。","運勢：雖是低谷，天無絕路，出路有一，尋覓可耶。\n家庭：人丁分散，時勢所趨，但謀合者，必須為之。\n財利：時運未至，徒勞無益，多方研習，以待來時。\n事業：押之皆失，不為汝拙，是局勢也，叵餒志耶。\n升遷：身虛心亂，調吾身心，注意調適，不可勉強。\n姻緣：不宜結也，兩姓不合，宜速分去，以免誤己。\n考試：無望之時，宜改行去，一技之長，可享終生。\n健康：一時突發，所幸速往，大國手救，留得一命。\n遠行：得待運至，方可出之，出之獲利，即回可耶。\n訴訟：不宜再論，論即敗兆，一時之忍，得萬世寧。\n失物：失於陽方，恐難回手，是警訊也，添新可耶。","王樞密奸險\n宋•王欽若，字定國，官至樞密，封翼國公，諡文穆。仁宗嘗謂輔臣曰：“欽若久在政府，觀其所為，真奸邪也。澶淵之役，遼已大震，寇準請乘破竹之勢，以復燕雲。欽若妒功，乃以孤注阻之。真宗竟許遼盟，使宋終失燕雲。欽若之罪也。”"],["中平","事端百出慮雖長，莫聽人言自主張，\n一著仙機君記取，紛紛鬧里更思量。","訟急解、病早禳、信即至、財如常、孕生男、禱神康、凡百事、自主張。","自己要有主見，不可聽人擺布，忽東忽西搖擺不定，結果一事無成。","此簽凡有疑難。須自作主。不可靠人。如奕棋者。本有仙著可下。人自不識。急須參透此事要著。恰中竅會。自然不勞而理。不戰而定。若但隨人作計。是非不辨。進退不決。豈有濟乎。","事端百出。擾攘不寧之象。慮雖長。左思右想。謀慮不定也。莫聽人言。道謀總是無成。自作主張。內斷還須堅定。奕棋者。常有妙著。是為仙機。解紛者。貴在良謀。當自記取。紛紛鬧里。何用遲疑。切勿思量。不時綏定矣。凡事宜斷宜先。謀可成。患可解也。","事情層出不窮，變化多端，雖然自己有許多的想法，但總是下不了決定，此時千萬不要聽從別人的建議，必須自有主張，就如下棋的人，遇到了難解之時，還是必須自己思量，而且會有神來一筆之助，目前雖然鬧得沸沸揚揚，必須改變猶豫不決的個性，自己下決定必能度過此時的喧鬧，此簽告誡千萬不可由他人來幫你決定，因為必定是個壞結果，相信自己就對了。","事務多端、紛紜不已、三思後行、悉歸條理。莫信人言、當自揣己、擠先一著、何事不濟。","是非誰不帶將來、只要心中自主裁、先著堪從贏地立、若遲一步便成災。","一人結訟，久而未解，占得此簽。後竟賴一友人時與怨家奕棋，居間勸息。正“著仙機”句之驗也。\n又晉江吳生，一胞侄出天花，十分危險，多方調治莫何。迨占得此簽後，始憶及家藏痘疹奇書，依法自治，不數劑而愈。此二、三句之驗。","運勢：時運將至，坎坷命運，大有轉機，及時把握。\n家庭：人丁漸旺，時勢所迫，各分西東，統謀為要。\n財利：雖利不大，利即利也，時運屆至，必獲大利。\n事業：時運將至，暫守舊可，時至大展，意外之喜。\n升遷：身虛不力，如今調適，必有可能，珍惜之也。\n姻緣：兩姓溫和，互培情感，必有結合，永浴愛河。\n考試：事隔數載，君仍奮拚，今火候足，必可題名。\n健康：雖是急病，急救得時，救回一命，珍惜此命。\n遠行：氣候不順，出之險象，將叢生之，見機方行。\n訴訟：謀和之可，猛衝下去，兩敗俱傷，圖利他人。\n失物：自我省察，是東之方，火速去覓，皆可得之。","爛柯觀棋\n晉•王質，采樵信步入深山，見兩童子在石上對奕，質置斧旁觀。童子與質一物，形如棗核，食之不飢。至局終，謂質曰：“此非人間。仙家片刻，凡世百年，爾合急歸。”質回頭，見柯己爛，匆惶而歸。至家，景物全非，人莫之識。爛柯山今在浙江省衢州府。"],["上吉","蘇秦三寸足平生，富貴功名在此行，\n更好修為陰騭事，前程萬里自通亨。","病即安、訟決勝、行人回、婚宜定、孕生男、家道盛、積陰功、福自應。","你能夠靠你的口才或能幹，造就你的事業。不過，除了造就事業以外，你應該多做一些有益社會的事，你的成就，才會更加遠大。\n問疾病，即康復。\n問訴訟，有勝訴的希望。\n問婚姻，可成功。\n問行人，即將回來，或有信息回。","此簽宜動不宜守。宜遠不宜近。口舌之才。必有遇合。名利可成。但恐陰騭有虧。至令天機阻滯。必須勤加積累。上格天心。自然一舉沖霄。前程遠大。戒人去惡從善。趨吉避凶之意。至深切矣。","三寸。謂舌也。蘇秦掉三寸舌。佩六國相印。白壁百雙。黃金萬鎰。所謂足平生也。此行似此。富貴可得。功名可成。故曰在此行也。修為陰騭。諭令積德祈天。前程通亨。謂人事天時交至。若長舟之破浪。鴻鵠之搏風。萬里可到。吉無不利矣。不務陰騭者不應。","靠著三寸不爛之舌，就可讓自己衣食無缺，是個天生靠口才吃飯的人，而且此次的行動，更可讓你功成名就，享有富貴榮華，可說達到人生的高點。然而想讓自己富貴長在，必須要多積陰德，多做善事，未來的前程將可更長遠，並且不受阻礙。如果無視積德之事，就算是好運來臨，也只是一時，必會招來厄運，而且不做善事的人，抽到此簽也等於是沒有，不受好運保佑。","凡百謀望、遠行則吉、求財必豐、求名必得。更行好事、以助陰騭、富貴榮華、始自今日。","孕則生男財則遂、功名到底可相期、作事有成終有望、凡人皆可問謀為。","功名初次占之不應，須第二次占之方有成就。以蘇秦再出，始懸相印也。","運勢：最高之時，積善為要，友朋多也，自動牽成。\n家庭：上旺盛時，時勢所迫，各分東西，及時謀合。\n財利：時運之至，百事順遂，把握現在，當有大收。\n事業：押之即中，時來運轉，珍惜此時，叵浪費耶。\n升遷：身心俱全，受之輕鬆，莫輕心耶，珍惜可也。\n姻緣：一見鍾情，兩造三思，可結之緣，成連理枝。\n考試：此考不虛，老天鑒君，確有用心，必有題榜。\n健康：小恙於身，叵輕心之，年紀已高，留心為要。\n遠行：即可行也，唯途中行，千萬小心，免遇災厄。\n訴訟：伊人凶霸，退之三思，寬恕伊人，不是敗陣。\n失物：貴重之物，傳家之寶，皆有著落，速去可也。","蘇秦背劍\n戰國•蘇秦，既說秦不行，乃歸家發憤苦讀，研究太公陰符。學成即至趙，往說趙王以合縱拒秦。趙王大悅，為治裝往說齊、楚、魏、燕、韓。竟佩六國相印，使秦兵十五年不敢出函谷關。"],["中平","門衰戶冷苦伶仃，自嘆祈求不一靈，\n幸有祖宗陰騭在，香菸未斷續螟蛉。","名難保、財難圖、訟不利、病無虞、婚可合、信音無、行方便、謹修持。","門庭衰微，冷下車馬稀，時運不濟，有孤苦伶仃被遺棄之感。求人人不應，求神神不應。幸有祖宗陰德庇佑，靠自己努力奮鬥，即使沒有後代，也有養子可以繼續香火，何必發愁呢?","此簽門祚衰微。子嗣艱貴。屢次求神不應。當由己身德薄。未能感格天心。然賴先世以來。餘澤未斬。己雖無出。尚可謀立繼嗣。上承煙祀。猶為不幸中之幸。凡事不得乎上。可望其次。不得於彼。必得於此。總須善功培植方應。","門衰戶冷。人家式微極矣。兼苦伶仃。兒女艱難之狀。祈神不靈。只知許願。不知積德也。祖宗陰騭。原有可憑。善善從長。絲粟不漏。幸有一毫挽救之處。天必不絕其後。螟蛉。繼子也。香菸未斷。尚可撐立門戶。益當存心繼祖德也。審矣。","家道逐漸衰弱，人丁單薄，門戶冷清，對於祈禱之事，沒有任何一件實現，只會祈求，卻不懂得付出是此簽的重點，所以一直無法如願。所幸祖先有積陰德，庇蔭到此代，才不至於因此而斷了香火。此簽指出，由於人丁過於稀少，無法有自己的子嗣，但會有繼子繼承衣缽，以解決無後的問題。如果能多加積德，則能更加順遂。","門戶衰微、空自祈禱、幸有祖宗、陰騭可保。若問後嗣、異姓方好、更行善事、當得美報。","蕭條何自問榮華、夢想微蘭鏡里花、一線萌芽綿血食、還憑余德屬君家。","一友占科舉得此，正考不利，收功遺才。凡事可以類推。\n又一生占此，屢考不利，後假他人之名獲進。此亦“續螟蛉”之應也。\n又(清)同治壬戍(1862年)並補辛酉(1861年)正科時，閩縣一幕友秋闈前在泉(州)通淮廟祈禱。及放榜，只中一螟蛉侄。蓋他族正派書香，經鹹豐己未(1859年)恩科中元，今之繼起者，惟此螟蛉耳。末句之驗更巧。","運勢：目前平平，交冬之時，即有轉機，暫時待之。\n家庭：存心行善，人丁可旺，速謀合睦，可成大業。\n財利：到處青山，吾與一腳，時運轉來，入秋見旺。\n事業：平穩之年，利雖蠅頭，亦是利也，再忍受之。\n升遷：看吾身心，該有之年，調吾身後，必有之也。\n姻緣：互退一步，詳看對方，自吾評鑑，可即允之。\n考試：百尺竿頭，再接再厲，已見曙光，老天護佑。\n健康：問心無愧，作事天理，冥冥之中，必有好報。\n遠行：目下不宜，再待一時，交秋時行，必有大利。\n訴訟：雖無官符，宜慎言行，方可勝訴，天理護爾。\n失物：可尋覓也，東方之向，速去尋也，皆可覓回。","鄧伯道無兒\n晉•鄧攸，字伯道。永嘉未，石勒兵起，攸絜家而逃。以其弟早亡，特全其侄，系其子於樹而去。為吳郡太守，載釆之官，俸祿無所收，惠政及民，民歌頌之，後官至尚書，卒竟無兒。時人慕其名，以為天道無知，而不想其縛子於樹，其心太忍也。"],["上上","羨君兄弟好名聲，只管謙撝莫自矜，\n丹詔槐黃相逼近，巍巍科甲兩同登。","宜出入、好謀望、訟即解、財亦望、孕生男、病無恙、信音回、有神相。","百般如意。\n問謀事，有成。\n問財利，亦興旺。\n問功名，必中。\n問訴訟，可解。\n問疾病，無恙。\n問行人，即回或有音信回。","此簽才品超群。同氣和美。但須小心畏慎。不可驕傲取咎。轉瞬之間。即有丹詔之榮。槐黃之喜。好音為不遠矣。又主兄弟同榜之兆。凡事應在雙數。","兄弟。同氣連枝之誼也。好名聲。難兄難弟也。一意謙撝。謙卦六爻皆吉也。莫自矜。戒勿炫才。勿倚勢。勿盈滿也。丹詔降至九天。榮承雨露。槐黃。應在四月。捷報泥金。科甲巍巍。定是魁元之選。宮花兩兩。同為廊廟之材。吉何如之。但須常守惡盈好謙之懼。則有終矣。","兄弟指的是師出同門之誼，不必羨慕兄弟的好名聲，因為自己也不差，一切都算順利，但要記住不可炫耀，也不可仗勢或自大，可得到上天的助益而一舉成名天下知，而且會與同門師兄弟一同上榜，或同時被提拔重用，必須隨時保持謙卑的態度，不可因得勢而沾沾自喜，如能時時謙為，排除忌妒之心，則好運會一直常存。此簽表示出好事成雙，不要排斥或忌妒同門，則能共享榮譽。","兄弟聯芳、聲名自起、凡事謙撝、以全其美。前程遠大、好事近矣、兩兩相高、同登甲第。","同志同登兩得仙、時來凡事合先鞭、所謀所望皆如意、福祿榮華件件全。","一人被報築城大戶，占此。有司簽之不得免，不一年又令重築。似此則不當論。簽訣之可否，惟視所占之事如何耳。","運勢：隆昌之運，為之則勝，勝之不驕，多行善耶。\n家庭：隆昌之時，人人存正，家和興兆，足為楷模。\n財利：時運之至，無所欲為，押之即中，令人欣喜。\n事業：童叟無欺，信用鞏固，世人仰之，利益大增。\n升遷：身心俱健，必能有之，唯常留意，必有成也。\n姻緣：見之鐘情，不宜即許，交往一段，再文定耶。\n考試：多年勤讀，加之聰穎，今舉必題，不必杞憂。\n健康：小恙之屬，又遇華陀、新藥出之，立即治痊。\n遠行：即可行矣，惟途中行，處處小心，避免遇災。\n訴訟：據理力爭，依天理行，無人所敵，勝訴無疑。\n失物：為爾信物，非尋著叵，向西南去，必有所獲。","宋郊兄弟同科\n宋•宋郊，弟祁，雍邱人，天聖初與弟同舉進士。未第時，有僧相之云：“小宋當大魁天下，大宋亦不失功名。”後數日僧見郊，異之曰：“君何滿面陰騭紋，似救數萬生命者。”郊曰：“惟前日見蟻被水淹，戲將竹編橋渡之。”僧曰：“即此便是，當大魁天下。”後果然。"],["中吉","嘯聚山林兇惡儔，善良無事苦煎憂，\n主人大笑出門去，不用干戈盜賊休。","財平平、病漸救、訟自散、莫與較、遠行歸、婚亦宜、雖有險、終平夷。","主有驚險，要防小人侵害，若能守性存善，卻有德曜及身，神明助之。凡事先憂後喜。\n問財，平平。\n問疾病，有驚恐無礙。\n問利，險中可得。\n不利考試。","此簽主道途驚險。小人侵害。唯是善良之人。遇凶不凶。遇險不險。則意外憂懼。彈琴可以解圍。焚香可以卻敵。彼自談笑。賊已遁逃。非所謂吉人天相者乎。凡事凶中得吉。陰蒙神佑。當益勉之。","嘯聚山林。乃是盜賊當前為患。兇惡可知。善良。循理守分之人。無事煎憂。言冥冥中自有庇蔭。大笑出門。自來自去。坦蕩如故也。不用干戈。言無事鬥狠為勇。盜賊休。禍患自散也。修德遠害之報。有如此者。凡遇凶危。修省可免。","小人當道，此行必充滿險阻，並有盜賊肆虐之象，然而只要是為人正直，且循規蹈矩之人，必能順利脫險，只是倍受煎熬，無形之中得到神明的庇蔭。不妨隨自己意願，來去自如，坦然行事，完全不受影響，只要自己行得正，即使不用干戈，宵小盜賊也自會散去。此簽指出遇到兇險之事，會自動化解，若以小人之心以對，反會招厄，必須培養光明正大的心胸。","惡少操戈、欲害良善、彼何能為、徒逞強健。君子善勝、收功不戰、神明相之、陰消禍變。","心驚如踏一層冰、戒懼何憂險阻深、一葦一航波浪定、駸駸喜色靄門庭。","一生試事畢，卜捷音，占此，後不得中榜。則此簽大不利於求名也。","運勢：平凡之時，必有轉機，俟時發揮，一步登天。\n家庭：人丁轉旺，時予招呼，不宜疏遠，必有所益。\n財利：利可求耶，不是叵利，可求穩飽，奠基之時。\n事業：不拘大小，皆是生意，不可貪婪，貪字通貧。\n升遷：身心俱健，應可懷之，唯小心對，避免操勞。\n姻緣：尚可促成，惟急成者，必有害耶，相性合後。\n考試：數載企盼，傍題今日，曷不雀躍，珍惜此舉。\n健康：舊疾復發，所幸賴者，醫技進步，留得一命。\n遠行：氣候不順，豈可出行，俟順方可，事事小心。\n訴訟：公薄對庭，最損身心，叵意氣爭，退一步贏。\n失物：失之北方，速去搜尋，必能尋覓，可安者耶。","蒯輒見韓信\n漢·蒯輒，字通，范陽人。時韓信假節為齊王，輒知天下權在韓信，往說之曰：“今大王威震天下，與楚則楚勝，與漢則漢勝。大王若不楚不漢，鼎足三分，可長保富貴。”信謝之曰：“吾受漢王厚恩，終身不忍背漢。”後信被呂後所殺，臨刑有“悔不聽蒯通之言。”"],["中吉","百千人面虎狼心，賴汝干戈用力深，\n得勝回時秋漸老，虎頭城裡喜相尋。","訟必勝、財必進、病有崇、遠有信、婚可成、名可稱、到秋來、百事順。","大器晚成，晚福可享。一生在驚濤駭浪中奮鬥，雖有成就，但己經消磨了人生大半的時光。","此簽主克敵戰勝之兆。言虎狼之人。百千為群。勢甚猖獗。賴汝整頓干戈。殲擒不遺餘力。是以振旅凱還。正在秋色將老之際。一時功成名遂。恰於虎頭城裡。喜 氣相逢。追尋快意。其亦有行藏自適者乎。凡事先險阻。後亨通。應在秋日。或西方或虎字頭州縣地名。或應在晚景。","百千虎狼。乃是為害之人。干戈用力。恰遇就援之助。得勝而回。策勛持賞。秋光漸老。好景無多。虎頭誌喜。因依或有夙緣。冠蓋追尋。居處誠為樂地。武士占 之功名顯達。將帥占之。勛猷烜赫。玩末二句。似亦有時行時止之意。占者細參。","百千人則意味相當多的人，虎狼心是指作惡多端邪惡之人，必須依賴你大動干戈，才得以剷除，經過一番慘烈征戰，勝利之時，已經到了老年，有道是好景不常在 ，當得到名聲之時，已經逐漸老了，在有虎字頭的地方可以安樂享受老年。此簽表示經過激烈的征戰，最後克敵致勝，頤養天年，晚年安逸。","人多謀害、汝善卻敵、縱有憂驚、終自消釋。得勝回時、定在秋日、圖向西方、事事皆吉。","英謀勇略出奇兵、此去功名得意成、只恐榮華方到手、秋風吹散葉飛聲。","昔劉誠意占此後，輔太祖興王，辭榮歸隱。蓋論“秋漸老”三字，乃盛名之下，難久居也。歸隱處州，亦“虎頭城”也。\n又泉州盧生，鹹豐己未(1859年)科鄉試，占此中第二名解元。乃盧(繁寫“盧”)姓，“虎”頭也。","運勢：尚在停滯，俟入秋後，可有轉機，掌握時機。\n家庭：正向旺盛，惜此福也，為合而謀，有所作為。\n財利：由小而 大，已露曙光，叵嫌蠅頭，小利致富。\n事業：目下平平，必有捩點，把握是時，可獲利耶。\n升遷：身心俱全，小心對之，時予檢身，必有轉機。\n姻緣：一見鍾情，唯理智計，不為情就，再三審慎。\n考試：艱爭奮鬥，十載於茲，終克一切，獲得桂冠。\n健康：突發之症，急急律令，尋覓名醫，終可 痊癒。\n遠行：正可行時，惟出去耶，步步小心，世景大劣。\n訴訟：天理在爾，不用畏懼，撫平心傷，創新程去。\n失物：本無望也，幸有義人， 送入公堂，方獲回也。","韓信戰霸王\n韓信率諸侯兵，與楚王大戰於九里山，十面埋伏，圍籍(項羽)垓下。籍走至烏江，有亭長駕舟以待，曰：“今獨臣有船，王急渡江東，亦足王也。”籍笑曰：“江東子弟同籍渡江，西誅秦無道，今無一人還。縱江東父兄憐而王我，我獨不愧於心乎?”竟自刎而死。"],["中吉","曩時敗北且圖南，筋力雖衰尚一堪，\n欲識生前君大數，前三三與後三三。","病可醫、訟終平、財尋常、信有準、名將亨、婚可聘、勿強圖、隨分定。","謀事在人，成事在天，只要盡其在我，仍然有成功的一天。","此簽前途亨通。中間不免折挫。現在雖極疲睏。然有一番光景在後。不可墮志。亦是大數注定。必其人平日居心及行事。克邀天鑒。故能不終沒沒也。三三。乃大 數應驗處。凡事失中有得。難中有易。晚景榮華。","征北圖南。言往事遂意。如征戰者之幾處成功也。筋力既衰。一旦傾跌。似乎無濟。然始則由成而敗。後則由敗而成。尚一堪者。言尚可有為也。大數如此。生前 預定。前三三。後三三。大數之驗也。或應在三數或應在六數。或應在九數。臨事參詳。不可執一而論。","過去南征北討，無不如意順遂，雖然耗費許多筋力，而且偶有失敗，此時雖然有所阻滯，但終能由敗轉勝，還是可以得到勝利，這一切都是天理注定。此簽有數字 的表示前三三與後三三，表示三、六、九等數時，有所指示，但依所問之事，而有不同的解釋，不可斷章取義，多參考其他因素。","前後謀望、皆有所成、晚年經商、尚堪一行。福分數定、不虧不盈、若欲多取、徒自勞神。","作事當圖共老成、若還疑滯欠通亨、桑榆晚景堪如願、正是皇天玉手更。","一貢生在京十年，值試期，人勸與考。偶展卷，被雞抓破，遂立意就選。人強之，乃占此。復溫習赴試，中六十六名，應前後三三之數。授辰州推官，一任而罷，次句並驗。\n又南安一拔貢生，欲進京供職，並應北闈。占此，改就鄉試，竟中副車。蓋渠屢應京闈未第，是“敗北”，宜“圖南”也;“筋力雖衰”，亞於正也;“尚一堪”，宜其副焉。","運勢：正向上升，掌司機會，善修自吾，裨益辦事。\n家庭：漸趨旺時，人人修身，必能合和，形成力量。\n財利：不虧不 盈，唯叵餒志，夏末即轉，時運即至。\n事業：有志事業，可助健康，或無大利，卻助身心。\n升遷：調適身心，修我善行，安心舒適，必有裨益。\n姻緣：可結之緣，小心應對，自認可也，方可深入。\n考試：艱辛研讀，終獲酬報，珍惜此福，敦以子弟。\n健康：非入膏盲，治之即痊，及時為要，不得 稽延。\n遠行：再過一時，出之可也，目下不宜，謹守之耶。\n訴訟：令人傷神，各執一理，說辭關鍵，自行研究。\n失物：明知北方，即速去尋， 或被毀半，尚有價值。","楊令公撞李陵碑\n宋·楊業，太原人。先事北漢，屢立戰功，號楊無敵。後降(歸宋))，從招討使潘美(潘仁美)征遼。遼將耶律斜軫伏兵於陳家谷，業以孤軍深入。美妒恨之，故不發援師，欲置其死。業被困無援，撞李陵碑而死。此見於北宋志傳，與史稱被擒不食而死異。"],["上上","吉人相遇本和同，況有持謀天水翁，\n人力不勞公論協，事成功倍笑談中。","貴遇趙、訟即了、名亦成、病可療、財有餘、婚亦好、問信音、即刻到。","問合夥，那是一個好兆頭。但不可忘記籤詩所言，一切要“公”平，要“協”力，才會事半功倍。“管飽分金”的故事，是一個模範。\n問謀事，有 望，出入皆宜。\n問求財，可得。\n問婚姻，可成。\n問疾病，得醫。\n問行人，音信將到。","此簽謀為和合。得遇貴人提攜。凡事稱意。不勞而成。必其人素為人所敬信。其事又為眾所欣悅。是又恰遇機緣。一倡百和。談笑中。事立而成功。豈非天人相應 。相時而動者乎。","吉人。善人也。本和同。言吉人天相。遇合自亨也。持謀。猶言主謀。天水翁。指所遇貴人而言。或應天水趙姓。或應天水二字郡縣地名。公論協。事合人心。人 心歡悅。是以不勞人力。自得水到渠成之妙。笑談成功。所謂不言而信。無為而成者也。上吉何疑。","所謂吉人自有天相，吉人處事本來就稱心如意，而且得天獨厚，能得到貴人相助，自己並不須花費多少力氣，貴人為天水翁，指貴人應在有天或水字的地名。不須 花費心力，則能得到大眾的認同且契合人心，得到事半功倍之效，而且在談笑之中就得到成功，可說是天時、地利、人和之作，這是個必定會成功的佳運。","與人謀合、況遇朝貴、援手提攜、事皆稱意。勿勞餘力、成就甚易、出入皆宜、吉無不利。","作事而今迥不同、主謀全得貴人功、蒲帆能趁東風便、萬里蓬萊咫尺通。","一人作縣官，被論。占此後，賴闔城紳士力保留任。應在第三句“人力不勞公論協”也。\n又同治丁卯(1867年)科，晉江謄錄書，占所謄諸生誰是榜上人。迨出榜，惟一陳姓乳名吉字。故簽語明以“吉”中兩字也。","運勢：居最高峰，唯惜福也，得意忘形，戒之記之。\n家庭：年年添丁，世人訝之，爾修者也，珍惜此福。\n財利：無所欲 為，押之得之，時運屆至，宜儲蓄之。\n事業：吸四方財，此時正當，惟不可貪，方能保住。\n升遷：平素之修，身心健全，今有享之，受之即安。\n姻緣：天作之合，必有好果，地連理枝，天比翼鳥。\n考試：前輩效益，句句言中，貴人扶之，終可題榜。\n健康：雖是惡疾，幸賴新技，一針定奪，留得 三叩。\n遠行：即可出也，唯途中耶，宜自小心，以防世景。\n訴訟：以天理行，上蒼安排，不必畏懼，退之心安。\n失物：一時不慎，置於東方， 速尋去也，保全回也。","管、鮑分金\n春秋，管仲與鮑叔未仕時，同為賈，分金，仲多自與，鮑叔知其貧，不以為貪。後鮑叔為齊桓公大夫，竟薦仲為齊相，佐桓公尊周攘夷，霸諸侯，一匡天下。管仲嘗曰：“生我者父母，知我者鮑叔也。”"],["上上","朔風凜凜正窮冬，多羨門庭喜氣濃，\n更入新春人事後，衷言方得信先容。","財多得、名高中、可問婚、亦宜訟、病即安、行人動、禍變消、福力重。","否極泰來，化凶為吉是也。","此簽沉滯既久。困而將亨之象。譬寒冬凜冽之際。剝極陽生。漸得交泰更新。萬物從此發生。正多美景。占此者冬季有喜。交春人事遂意。另有一番好訊息。指日 俟之。","朔風凜凜。冬時窮悴極矣。門庭喜氣。生機勃勃欲動矣。更入新春。三陽開泰。光景榮華。衷言。指衷曲謀望之事。信先容。言此時信息通達。必有貴人為之接引 。為之揄揚。衷曲得以開陳。好音不日到耳也。應驗已速。事到功成。","停滯不前的運勢，開始運作了，猶如凜冽的寒冬將盡，接著而來的就是春暖花開的春天，而且逐漸感受到喜氣洋洋，尤其是進入到新春之後，心裡的願望似乎得到 了回應，出現了助你實現願望的貴人，將得到完美的成功。此簽指沉滯的運氣完全開通了，而且心想事成，就是會出現貴人來幫你實現想法，必須把握良機，尤其是冬春交際，是 轉運之時。","數極於冬、窮久則通、交季冬月、喜氣重重。新春一至、和氣愈充、好遇貴客、百事皆同。","失意反成得意歸、入門一卦見仙機、當時險難皆平靜、百事和諧沒是非。","一生科舉占此，臨試給冬字號簽，至春發案不取。所謂“窮冬”者，此也。後遺才收錄，此又“更入”之應，窺則通之意。","運勢：正逢昌運，事事如意，不得驕也，驕敗之始。\n家庭：治家之本，作善祥至，添丁進財，事事如意。\n財利：押之有之，時運屆耶，惜之此時，掌握時機。\n事業：四面八方，貴人扶之，皆可利得，儲之蓄之。\n升遷：平素行善，身心勇強，必有瑞慶，可欣可賀。\n姻緣：辰相佳好，逢遇良緣，天作之合，永浴愛河。\n考試：此科必題，所付代價，已足者也，珍惜可耶。\n健康：庚辛日屆，小心調養，百病自除，攝製吾身。\n遠行：即可出時，心存善耶，貴人扶之，平安歸來。\n訴訟：作事順大，不必擔心，天眼注視，必得勝訟。\n失物：不必尋覓，自可回籠，高枕無憂，嗣後小心。","蒙正木蘭和詩\n宋·呂蒙正，字聖初，河南人。微時，嘗在僧家別院木蘭寺內和詩，其品迥異庸流。迨太宗時，果舉進士第一。後三居相位，引薦人材，使上下各稱其職，稱賢相焉。"],["上上","耕耘只可在鄉邦，何用求謀向外方，\n見說今年新運好，門闌喜氣事雙雙。","病即安、訟即決、財漸豐、名高揚、行人回、婚可結、莫外求、福盡得。","出外不宜，在家必發達。名利只宜近處求，不宜遠行。守舊好，創新難。\n凡事皆順利，且有雙喜臨門之象，故問婚姻事最宜。","此簽不宜遠行。只宜守舊。鄉邦之地。自有榮華。耕耘之中。亦有發跡。況值運限更新。門庭以內。喜事重重。自可享受優遊。倘舍現前實地。希冀遠大不可知之 數。將貽後悔。居易俟命者得之。","耕耘。系農家之事。正鄉邦中所為也。外方。則非耕耘之地矣。舍近圖遠。豈有濟乎。新運好。福氣將來也。喜氣雙雙。好事不止一件。言門庭中自有至樂。總見 不可騖遠之意。占家宅。財旺人興。流年大吉。","若要努力奮發，只需在家鄉，根本不必向外謀求機會，只要守住原來的家業，則會有很好的發展。尤其是今年遇到了大發的好流年，家中會喜氣洋洋，而且接二連 三，不只一件。此簽表示今年的流年大吉大利，家中喜事連連，好運不斷，如果堅持出外打拚，則不適用此運，後果將不可想像，無法像留在家鄉中這般如意，必須深思。","出外不宜、在家必達、時運將亨、財祿俱發。好事重重、門庭改革、若欲遠圖、弄巧成拙。","自家安分莫他求、俯仰寬舒得自由、現在陽和春已到、桃紅李白樂悠悠。","正德間，京師楊惟聰占此，後以鼎元歷官翰苑，至宮保學士尚書，凡十餘任，並不出京。正應首句。","運勢：富如石崇，正是亨通，世人羨慕，珍惜此福。\n家庭：從心比心，門戶熱絡，謀之合和，財子雙全。\n財利：從心比 心，門戶熱絡，謀之合和，財子雙全。\n事業：公平交易，童叟無欺，信用堅固，啻是酬報。\n升遷：夢鬼夢蛇，女性之祥，調適身心，必能所成。\n姻緣：天賜良緣，可合之對，敬之如賓，百年和合。\n考試：修身達五，克刻自吾，老天見之，必助佑爾。\n健康：雖是微恙，不宜輕心，求得華陀，著手 回春。\n遠行：可出之時，隆昌屆至，金山銀海，為爾送來。\n訴訟：明知訟凶，伊人興之，必研法理，必能勝也。\n失物：未必尋之，自有回手， 平素修善，有以致之。","杜甫遊春\n唐·杜甫，字子美，杜陵人。玄宗朝獻賦，命待詔集賢院，後轉檢校工部員外郎。甫覽群書，善為詩歌，涵渾汪洋，千態萬狀，陳時事確切精深，世號詩史。元稹謂：“詩人以來，未有如子美者。”惟好賞春山，故每當春晴，必游郊外。"],["中平","讒發君心天已知，何須問我決狐疑，\n願子改圖從孝悌，不愁家室不相宜。","訟和貴、病改醫、財有付、婚姻遲、問行人、尚未歸、能改過、事皆宜。","善有善報，惡有惡報，君當決疑之心，改過自新，自然禍去福來。\n問求財，先難後易。\n問婚姻，遲婚吉。\n問疾病，宜改醫。\n問訴訟， 宜和解。","此簽好善有好報。作惡有惡報。示人早知警悟。現在所謀不善。天神早已洞照。自是必不可行。何須啟問。唯有改悔前過。力從孝悌上起見。自有家室和平之樂。 趨吉避凶。唯人自擇。可不悟乎。","才發君心。指一念初動之際。天已知。人可瞞。天不可瞞也。何須問。言善惡彰著。可否分明。自心當自知之。不待神言之告也。改圖。去不善。以遷於善也。從 孝悌。以祇父恭兄為根本也。孝悌良善。天自降福。可得家室相宜。不足慮矣。改圖者吉。怙過者凶。","在發心動念之時，老天就都已知道了，既然是不好的壞心眼，又何必再問神佛解決心中的疑慮，其實自己的內心相當清楚，什麼是對什麼是錯，只要改過向善，將 心中的壞念頭一併清除，希望能從孝悌開始做起，孝順父母、友愛手足，是最基本的孝悌之道，只要做到孝悌，則不必擔憂家中無法和樂，自然而然地家業平安快樂，有道是家和 萬事興。如果不改除心中的壞念頭，厄運則隨時而至。","所謀未善、何必禱神、當決於理、改過自新。但能孝友、奉親事君、和氣生福、家道回春。","立志須從善道中、天難瞞隱意先通、能行好事培根本、管取家門喜氣濃。","(明)萬曆間(1573—1619年)，一廣文選遼東部司學訓時，以遼左方亂為憂。占此，遲疑未行。值遼陽陷沒，改選湖廣孝感縣教諭，屢縣縣印，大有所獲。應第三句也。\n又(清)光緒甲申(1884年)，余室得病，諸醫調治未愈。余占此，乃延一醫家在孝悌境者，遂漸痊。後二句驗甚。","運勢：所謀要善，不宜存惡，事順天理，方有善報。\n家庭：人春和合，春色盈門，健全之日，方能建序。\n財利：明是可作，作之變卦，世人之心，苦以揣測。\n事業：勤勞而作，蠅頭之利，亦該滿足，時景所趨。\n升遷：命中如此，調適為尚，來春見之，今未成耶。\n姻緣：先培情感，遇之珍惜，可合之性，審慎定可。\n考試：雖是耕讀，有志功名，今未料至，看後科也。\n健康：平素行善，心地善良，神佛扶持，可保全泰。\n遠行：再看一時，未必急著，心急如焚，必出敗跡。\n訴訟：不宜玩忽，忍之受辱，不是敗家，冥中贏之。\n失物：己之不慎，失在北方，速去尋看，或皆留半。","江遺囑兒(缺)"],["中吉","南販珍珠北販鹽，年來幾倍偵財添，\n勸君止此求田舍，心欲多時何日厭。","訟已勝、莫再戰、名已成、勿再問、婚已定、病自散、行人歸、且安分。","","此簽勸人知足不辱。知止不恥之意。凡人前事謀為。既已遂意。現在境地。亦可粗安。即當持盈戒滿。自守清靜。就此求田問舍。自得安常處順之樂。若貪多不已 。終無厭足。不唯自取煩勞。有不更招意外者乎。進退行止之幾。當自決之。","販珠販鹽。言前時謀為多端也。貨財倍添。則可以少休矣。求田舍。乃退守者所為。勸君止此。言當為此退守之計。庶可免咎。心欲多。心中貪求不已也。厭。足 也。貪多者。足愈不足。豈有止息。不至傾覆禍患不止。所以深戒之也。知者務為恬靜。則亨貞之道矣。","具有相當好的生意頭腦，這幾年來得到不少的利潤，但也養成了不小的野心，奉勸你適可而止!不如放棄營利，就此退回田野生活，則可過著安居順遂的生活，人 的欲望是無法滿足的，心愈貪，則越顯得不足，永無止息之日，如此下去，則會因貪而招來厄運，不到敗光家業，厄運是不會停止的。須多深思，此時是必須急流勇退的最佳時機 ，回歸恬靜的生活，才是真正的人生。","：“謀望既遂，利亦倍收，貪心不止，必獲後憂，知足不尋，可樂優遊，凡事如意，可休則休。”。","人事茫茫歷世艱、得寬閒處且寬閒、倘謀富貴無知足、並惹愆尤自往還。","一生占科舉，不得，是“止此求田舍”之應也。","運勢：平而穩時，久之安寧，不宜猛衝，反而賠本。\n家庭：先修吾身，切勿欺人，求神住禍，添丁進財。\n財利：目下平平，時運屆至，是轉機時，方可把握。\n事業：孜孜不倦，毫無怨言，可欽可佩，必有所獲。\n升遷：修吾身心，調適己身，必能適望，必可保全。\n姻緣：姻緣天定，不宜強求，合自天神，順乎自然。\n考試：有志功名，可貴之至，衡量自吾，必有成就。\n健康：幸遇華陀，悉心調治，又有孝子，必可治痊。\n遠行：暫看時局，出之未利，何必強行，守之可也。\n訴訟：興不得訟，伊人橫霸，不可理喻，小心應對。\n失物：耐心覓之，覓之有望，終獲回來，嗣後警惕。","錢大王販鹽\n唐·錢鏐，臨安人。微時，以販鹽謀生。值黃巢亂，以鄉兵破走之。又以八都兵討劉漢宏，破越州以迎董昌，而自居於杭。及董昌反，鏐執之歸杭。昭宗拜為鎮海、鎮東兩軍節度使。朱溫纂唐，封為越王。傳至孫忠懿王俶，乃納士於宋。"],["中平","舍舟遵路總相宜，慎勿嬉遊逐貴兒，\n一夜樽前兄與弟，明朝仇敵又相隨。","名與利、莫強求、醫用審、婚難謀、行人至、訟可休、凡出入、謹交遊。","要認真做事，交友要慎重，不可結交損友，對己有害而無益。做事情，要腳踏實地，實事求是。不可花天酒地，把人生寶貴的光陰都浪費掉了，到老一 事無成。\n問合夥做生意，不宜合，要防小人欺詐陷害。宜戒酒色，以免惹事生非。","此簽一切所為。宜踏實地。交遊間更宜慎擇。謹防所與非人。侵耗陷害。口舌是非。酒色財氣結仇等情。唯冀慎之於先。免致受其籠絡。斯全身遠害之道得矣。凡 事趨吉避凶。改惡從善。不可自誤。","舍舟遵路。言風濤之險。不如道路之安。此譬為人。不可行險僥倖。須知安步徐行之意。故曰總相宜也。貴兒。乃富貴家子弟。看似聲勢可依。實則多華少實。多 邪少正。多狡詐。少忠信。多狠惡。少良善。故戒勿與相逐也。樽前兄弟。是一時同流合污之態。明朝仇敵。或因乾餱失德。或因利盡交疏。小人反覆無常之狀。勢所必至矣。占 者慎持則吉。忘戒則凶。","放棄風浪巨大的水路，改以風險較小的陸路，然而各有各的風險，並不見得陸路就會平安無事，還是必須小心為上。不可與富家子弟混在一起，因為看似顯貴其實 虛有其表者居多，而且較狡詐，容易受騙，只要失去了利用價值，或分贓不均，隨時可以翻臉，這是小人的行為。若疏忽而與小人同謀則凶。","舍舟登路、宜踏實地、莫伴貴兒、事當牢記。好中成惡、口舌宜至、戒之慎之、撙節遊戲。","得意濃時終失意、浮華隊里莫相隨、翻雲覆雨炎涼態、那得開心見膽時。","楚中一士人，遠至晉地，乾謁顯宦。占得此簽後，果與公子笑言相席，謔前鬨鬧。其人忽悟簽語，次早不辭而歸，怨者欲害之而不得。其驗如此。","運勢：時也命耶，不得抗拒，時運之至，君亦紅時。\n家庭：先修吾身，目下分散，砸桶之人，宜速謀和。\n財利：此財不 義，害人子弟，取亦不留，莫可取也。\n事業：風不調耶，雨又不順，加之局勢，暫忍受之。\n升遷：今年不可，身心不適，又流去矣，先修吾身。\n姻緣：命多乖舛，勉強合之，即欲分離，不宜配合。\n考試：功與名路，與君緣絕，不如速換，狀元等爾。\n健康：火速救治，出自意外，延請華陀，方可 治之。\n遠行：萬萬不可，天候不允，局勢差矣，留之可也。\n訴訟：鬥智費銀，身心俱憊，速謀和可，外人富之。\n失物：不必再追，已長翅飛， 無法回手，新添可也。","孫、龐鬥智\n齊·孫臏，魏·龐涓，其初同事鬼谷子。涓之才學弗如臏，嘗與鬥智輸之。涓忌其能，致結成仇，彼此謀害。君子觀於異日，涓刖臏足，臏喪涓命，互相殘忍，毋乃其不仁不智之甚與。"],["中吉","雷雨風雲各有司，至誠禱告莫生疑，\n與君定約為霖日，正是蘊隆中伏時。","訟與病、漸可解、名與利、姑少待、婚宜遲、行無信、若禱神、三日應。","時也，命也，運也，固然上天有一定的安排，但至誠能夠感動天，只要你努力奮鬥，仍然可以多少加以改變的。","此簽言世間一切事故。冥冥中有主之者。須待時候已到。機緣自就。如禱雨者。至誠感動。亦須仰奉天命。然後風伯雨師。方得應候施行。後二句。是言雨降之期 。在中伏之際。凡事皆可類推。","雷雨風雲。天之變態也。各有司。言各有管攝之權。非可任意操縱也。人生窮通得喪。亦復如是。至誠禱告。神鑒占簽者之忱悃也。霖為時雨。左傳雨三日以往為 霖。亦可作三數斷。定約。以示定期。蘊隆。乃大旱之際。中伏乃大暑後第二旬庚日。言雨降在此時也。雖藉禱雨為詞。一切希望。皆作是觀。總以待時為妙。","大自然的天氣變化，各有其道理，並非可依人為所控制，人生的吉厄順阻，不也是如此，必須誠懇地禱告，讓天神感受到你的誠意。霖日，則為下雨之日，在大暑 之時表明何時會下雨，竟能準確地在中伏之時下起霖雨，表示出乾旱的大暑之時，都會有天降甘霖之時，一切必須等待時機的到來，才能成事。讓你的希望有所依靠的，不就是至 誠的祈禱嗎?現在的辛苦，必會換得未來的順遂。","吉凶悔吝、各有神司、若問濟事、在中伏時。如旱得雨、恰慰雲霓、凡所謀望、直待其時。","貧富功名各有時、婚姻遲速待相宜、須逢庚日探訊息、季節交臨爾自知。","一生科舉，占得此後，取二等，應“中伏時”也。發案在三月，應在“為霖日”也。","運勢：時之未至，不甚突出，認時命也，即已獲利。\n家庭：人人平和，表現亦是，為突破耶，必待戮力。\n財利：注意時 潮，流行尖端，試之可耶，不宜擴大。\n事業：全世皆是，景氣低迷，無可奈可，守之則利。\n升遷：今可有也，調適身心，不嫌遲來，必有所獲。\n姻緣：為人寬待，否極泰來，可合之緣，珍惜此合。\n考試：已閱數載，苦守此道，老天允之，苦盡甘來。\n健康：雖屬微恙，輕心不得，另菌侵入，恐致 命耶。\n遠行：俟冬屆至，可出之也，有利則回，不宜遲延。\n訴訟：不宜費神，意氣之爭，將誤己也，忍之則贏。\n失物：試探西南，或有望回， 去之又半，自我警惕。","王曾祈禱\n宋·王曾，字孝先，益都人。自少穎悟，善為文辭。鹹平中三元及第，累官右僕射平章事，封沂國公，諡文正。居官之日，遇乾旱，輒竭誠禱，必沛自霖乃止。其在明廷，正色危言，進退士人莫有知者。嘗曰：“夫執政者，恩欲歸己，怨歸誰?”范仲淹深服其言。"],["中吉","喜鵲檐前報好音，知君千里欲歸心，\n繡幃重結鴛鴦帶，葉落霜飛寒色侵。","訟宜和、名漸通、婚再和、病主凶、問求財、時未至、凡謀望、在秋冬。","好運氣不久就將到了，目前的期待焦慮，即將過去。凡事要好好計畫，須等待適當時機到來，再放手去做，最後必有成就。\n問訴訟，宜勸當事人和 解。\n問考試求功名，好好努力有希望。\n問婚姻，如系再婚則佳，初婚不吉。\n問疾病，則系凶兆。","此簽離而又合。去而復還之象。凡事機兆已動。現有好音。如歸家者已通訊息。不日間可團聚。自有夫妻諧和之樂。但暮景霜侵。草木零落。必主晚成。及年力衰 遲之際也。","喜雀善能報喜。行人將至。預報好音。是以歸心一動。雖隔千里之遙。識者已先知之矣。杜詩。柴門烏鵲噪。歸客千里至。此其驗也。鴛鴦重結。久別乍歸之情。 葉落霜凋。應在秋冬時也。然幾經艱難盼望。而始得有今日。則其時亦已晚矣。故曰暮色侵也。占者事有成就。難望早達。重字或主重婚之應。他事亦可作兩次斷。","通報喜訊的雀鳥在檐前啼叫，預告離家的他即將歸來，房間重新再結上喜帳，表示重來一次或是再婚，然而雖然期盼已久的他已回來，然而已到葉落霜凋之時，表 示秋冬之日，或是晚年，暮色侵表示一切都已經太晚了。此簽表示所占之事無法在早年達成，必會拖至晚年之時，或秋冬之日，而且有重新來過之意。","好音報喜、遠涉方回、交冬之際、家室和諧。凡事終吉、且待時來、自有成就、不必疑猜。","凡事須經畫、求謀且待時、當年悲破鏡、暮景得相隨。","一人妻子，深秋抱病，占此，其妻遂亡。第三句之應，直如面告也。","運勢：平穩之時，應知足耶，貪字通貧，戒之記之。\n家庭：人口漸旺，提升人品，是急務耶，合陸為要。\n財利：不宜猛 沖，穩紮穩打，即是利頭，叵貸借耶。\n事業：嚴守舊也，即是大利，猛衝墜谷，時景所趨。\n升遷：身心俱憊，必先調適，受之撐住，方可接應。\n姻緣：雖是平凡，則難求者，善心待人，人亦回之。\n考試：既志功名，下注功夫，降一求之，必有成就。\n健康：誠心祈禱，陽生慶元，細心照料，新藥 出之。\n遠行：在鄉安然，今出之險，時候不予，千萬叵試。\n訴訟：可知古諺，冤冤相報，何時了耶，創人生值。\n失物：不是重物，可不必追， 再新添也，警惕之訊。","蘇武還鄉\n漢·蘇武，字子卿，杜陵人。東漢初為中郎將，奉命使匈奴，被留，手持漢節，牧羊海上十九年。初單于留武，詐以死報漢。後漢使至匈奴，偵知武所在，乃請單于放歸，詐以雁傳書至漢，知正在海上牧羊為請。單于驚為神。乃放歸。"],["中平","河渠傍路有高低，可嘆長途日己西，\n縱有榮華好時節，直須猴犬換金雞。","求財遲、占病險、名難成、信尚遠、訟終凶、婚必晚、孕必驚、地未穩。","一生坎坷不平，雖然從前也有過一段輝煌的時期，但是現在已經像日落西山般的沒落了。但是人生原來就是如此，不必怨嘆，如果你能再努力，也許還 有時來運轉的時候，那也是說不定的。","此簽險阻多端。事有蹉跌。人防陷害。如行河畔崎嶇之路。又值日色將晚。險何如乎。凡事勉強前進。凶不可言。就此中止。庶可免禍。縱有晚景。須遇申酉戌年 月日。或申酉戌運限。可冀有成耳。","路有高低。險阻之象。況在河渠之傍。則更險矣。長途可嘆。何等艱難。況日晷西移。轉瞬將就昏黑。欲能出險得乎。申屬猴。戌屬犬。酉屬雞。縱有榮華。等待 申酉戌年月日時方應。言現在運程甚凶。切宜耐守也。","道路本就崎嶇難行，更何況是沿著河渠的坎坷道路，一到日已向西的傍晚，就更難行了，而且處處有危險，只要一腳踩空，則死於非命，所以不可勉強行之，必須 就此停止，則可免於招禍，縱使有榮華富貴的時日，也必須等到申酉戌年月日時，才可達到，現在是處於四面楚歌的狀況，必須耐心等待時機的到來，千萬不可心急一時，否則會 招來厄運。","修路崎嶇、況當衰晚、求事多難、徒自嗟嘆。逢申酉戌、年月日見、若遇此時、稍可如願。","多少登場沒下場、平川靜處被風傷、眼前光景渾如夢、只恐榮華不久長。","一生宗師考試占此，獲二等科舉，發案得報訊息，乃丙申日黃昏時。“榮華”二語。應之不爽。","運勢：時也命也，不宜抗拒，以身試之，後悔不及。\n家庭：人口凋零，修善為要，冥冥之中，得好報也。\n財利：不宜慨 嘆，千人千品，宜小心對，否則碗破。\n事業：目下守之，雖是蠅頭，利則足利，候時機耶。\n升遷：操勞過度，身心俱憊，宜調身心，為先決事。\n姻緣：不可即是，八字不合，勉強合之，噬臍無及。\n考試：君爾用心，本可有成，不幸家累，叵氣餒耶。\n健康：微恙置之，成藥慣之，竟惹禍根，立即 延醫。\n遠行：在鄉安寧，何必出之，勉強成行，噬臍無及。\n訴訟：仲介大利，告字雙方，為之訴偽，洞悉機先。\n失物：小物為念，君意義大， 惜小不易，為己警惕。","范蠡歸湖\n春秋·范蠡，字少伯，吳人，與文種同為越大夫。吳滅越，蠡與種為越王勾踐畫策，卑詞請成，復求民間美女，得西施進於吳。迨滅吳功成，蠡知勾踐可與同患難，不可共安樂，乃辭官，扁舟泛湖，止於陶。復以謀生致富，稱陶朱公。凡三徙，方成名，後不知所終。"],["下下","憶昔蘭房分半釵，而今忽把信音乖，\n痴心指望成連理，到底誰知事不諧。","名利杳、訟終凶、婚重娶、孕成空、病危險、運欠通、事無準、鮮始終。","記得從前山盟海誓，如今卻是音信全無，痴心等待結成連理，誰知最後還是沒有希望。\n問名利，無希望。\n問疾病，有危險，應多修善，祈神保 佑。","此簽戒勿輕信。凡事與人有約。始雖和合如意。亦是巧言虛花。終無準實。如婚姻之轉瞬敗盟也。及早參透。免自擾累。或可另作亡羊補牢之計。若終受愚弄。非 徒無益。而受害多矣。人情如此。其可不知悟乎","蘭房。指女子閨閣之地。分半釵。各執釵之半。以為信也。人情始約之稠密。大都類此。信音乖。情意中變。翻雲覆雨之習態也。則知此婚已不可合。此事已不可 成明矣。連理。比夫婦成雙之義。痴心指望。繫念不已。自坐痴迷也。謀不可合之婚。圖不可成之事。是以到底無成。旁觀早已知之。當局者苦不知悟耳。占此可以知返矣。","口頭上的盟約已完全失信了，答應之事已不可能完成了。還要痴心妄想成為夫妻，大家都知道這是不可能的事，卻只有自己一心想要挽回，當然只會讓自己痛苦不 堪罷了。此簽表示以前的誓約早已變化，越早看透越能及時回頭，不必再等下去了，不如認清事實，重新來過，會有一個新的開始。不要再執迷不悟了。","事多離散、難望再成、痴心未解、尚有縈情。縱能強合、終必敗盟、凡事謀望、另改途程。","婚姻莫問、財利落空、家人嗃嗃、憂心忡忡。","一人為子擇媳，占此，不信簽意而強成之。其子婚不數月，出外經營，失意浪蕩不歸。其媳堅志，苦守清節以終。其驗如此。\n又(清)光緒間，晉江縣有人為其妻問病，占此，竟斷弦。","運勢：命運於人，起落不定，爾順認之，否則堪虞。\n家庭：人丁散落，凡百事謀，皆落空也，速謀和之。\n財利：既是時 景，無以抗拒，暫忍受之，善求可矣。\n事業：冤仇相報，切速悔過，修身行善，方有轉機。\n升遷：有之時也，身心不適，竟且走矣，俟明年耶。\n姻緣：孤鸞寡過，破鏡難圓，無以可配，分手可耶。\n考試：鹿鹿一生，皆成畫餅，不如即改，行行狀元。\n健康：問病危殆，所幸靜養，得法與否，生命 攸關。\n遠行：未必去也，窮途日暮，惶惶度日，守份即可。\n訴訟：明知不可，為意氣爭，終至雙敗，仲介大利。\n失物：雖是要物，己之不慎， 何以怨之，自後小心。","王昭君憶漢帝\n昭君，歸州人，漢元帝宮女。會匈奴求婚，昭君詣闕上書請行。既嫁單于，其心未嘗忘漢。嘗上漢帝書曰：“臣妾幸得備禁臠，以為身依月日，死有餘芳。豈料失意丹青，遠竄絕域，命也，奈何!妾有父有弟，願君王憐而愛之。”"],["上吉","崔巍崔巍復崔巍，履險如夷去復來，\n身似菩提心似鏡，長安一道放春回。","病與訟、險而平、名與利、迍而亨、婚先難、終必成、行人至、福自生。","事情有重重阻礙或危險，但只要能夠平心靜氣，終究會成功的。\n問訴訟與疾病，雖有驚險，終得化解，不必擔憂。\n問名利，機會很多，只要持 得正，終會有成就。\n問婚姻，雖有波折，有情人終成眷屬。","此簽事有重險。目前甚屬艱難。然賴神明默相。雖在危險之中。如履康莊之路。蓋緣平日身具善根。足以感格天意。此時心含智慧。足以權度機宜。故能脫險而亨 。行登長安道上。春色滿前。正有無限好景。占者唯慎持身心。益加積累。以迓天麻斯善耳。","崔巍。高峻崎嶇之地。重言以申警之。險之至也。夷。平地也。去復來。言行止得以自由。險不為害也。菩提。善果也。鏡明也。身似菩提之善。而心如鏡之明。 是以自天佑之。吉無不利。長安道上。功名富貴之路。放春回。言功名富貴逼人而來。如春色之榮暢也。占吉而身心皆吉。斯應驗如何矣。","在這高峻之地行
