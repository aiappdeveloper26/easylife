走，就猶如平地般來去自如，這些危險根本就無法影響，平時為人行善，而且心如明鏡，表示得到上天的庇佑，將大吉大利，長安一道指通往功名 利祿之道，放春回，指春色無邊，正等待著你的到來。此簽表示雖履險境，但對你完全不受影響，只要心存善念，必得善果，接著而來的是順暢的吉運。","路途傾險、心卻平歡、轉凶為吉、終免憂疑。更宜守正、切莫改移、履道坦坦、何福不隨。","至再至三險已深、天公默鑒後凋心、從此坦蕩長安道、出谷遷鶯到上林。","一人求婚，占此。娶妻至家，好著聰慧。應“身似菩提”一句。\n又一人鄉居，四面皆倭寇，急欲脫去，占此。夜從閒道得入郡城。應“履險如夷”一句。\n又(清)同治甲子(1864年)，福建鄉試，晉江一生問名，占此。迨到省後，忽值鄰省有警停考，迴路，又問沿途劫掠大慘。正躊躇間，適有崔姓武官邀他隨同林提軍來泉。中途遇雨，延至十月初四日乃到家。此占不特全詩多應，連題亦驗。","運勢：上上之時，百事謀望，皆可成就，毋忘備後。\n家庭：人丁興旺，分散甚廣，宜招呼之，合正力量。\n財利：可及大 財，押之得之，無往不利，小心陷阱。\n事業：押之得之，起伏頗大，宜小心耶，備後來需。\n升遷：平素善行，身心俱佳，懷之可安，請神佑之。\n姻緣：天賜良緣，敬之如賓，互讓一步，白頭偕老。\n考試：雖是天才，天下學問，非求不得，必即題榜。\n健康：雖是微恙，恐怕並發，速求名醫，必能 治痊。\n遠行：即可去也，可擷取耶，新創之物，必有大利。\n訴訟：伊人橫霸，加之兇惡，小心應付，必可擊退。\n失物：貴重紀念，非尋回叵， 去東南方，必可尋得。","崔武求官(缺)"],["中吉","生前結得好姻緣，一笑相逢情自親，\n相當人物無高下，得意休論富與貧。","財物聚、病即愈、若問訟、必遇主、婚姻合、良朋聚、行人回、事無阻。","每個人都有時來運轉的時候，即使目前窮困未發達，但是慧眼識英雄，只要是品格高尚，當然有被重視的一天。\n問婚姻，只要對方人品好，目前的 情況可以不必論。\n問財運，此去漸漸有利。\n問疾病，會痊癒。\n問謀事，有成功的希望。","此簽事有前緣。不須勞力。自然遇合湊巧。蓋稱量彼此之間。彼既脫去俗塵。此相遇可落凡近。是以一見傾心。格外投契。不復在世情貧富間論也。婚姻和合。諸 事相宜。道途遂意。謀望皆能如願矣。","好姻緣。姻緣正好也。然由生前培植所致。甚非偶爾。種麻得麻。種豆得豆。自然之效也。一笑情親。相見恨晚之意。人物相當。言其才具品地。兩不相下也。既 有前緣。均堪匹敵。自不以富相耀。以貧見疏也。觀此。而所以自植其才與德者。可不豫乎。","此時正面臨一個天大的好機會，這並非是偶然，而是在前世的因緣契合，於此世延續，見到的第一面，就有如失散己久的親人，有一見如故的感覺，而且對方與自 己不論是在外貌或是才德方面，皆不相上下，由於如此的投契，所以貴賤貧富，就己經無所謂了。此簽指出會遇到與你相合之人，或是處事順遂如意，一切就是自然天成。但這都 是前世的因緣，要懂得珍惜，才能有良好的輪迴。","既有夙約、一見如故、所謀皆同、事多就緒。何必相逢、又分爾汝、且順而行、事無齟齬。","兩情如水素通流、恰有機緣向此投、鳥集高林魚躍浪、春風和煦任優遊。","一顯宦欲與貧士結親，占此，後其婿果登上第。\n又一富商欲與貧友經營，占此，後其友果能興財致富。皆不論貧富之驗。\n又表弟陳遠江，內史府試時，臨結榜占得此簽。簽意明示以前列“結得好緣”，是指第一也。後果結榜首。\n又晉江郭氏子，科試占此。入場坐結字，其前號乃生字，系渠等友陳子也。二人相逢，同發一笑。至掛榜，郭在二等二十三名，陳在二等二十四名。此則上三句摘摯之應也。","運勢：平穩之際，宜小心也，備後退路，不宜沖之。\n家庭：時勢所迫，丁口四散，由一人迎，方有力量。\n財利：步步為 營，不宜著急，一次去也，候下次可。\n事業：今年平衡，交春轉旺，時運屆至，令爾咋舌。\n升遷：行善在先，修吾身心，心安理得，定是平安。\n姻緣：天作之合，可合之也，半途變卦，互讓一步。\n考試：功名之路，甚勤研究，今逢吉年，必有成就。\n健康：痼疾復發，已成大夫，未必著急，小心 應戰。\n遠行：待秋至時，出之可也，秋高氣爽，無往不利。\n訴訟：宜解叵結，自古名訓，被迫也退，方是勝也。\n失物：尚有望也，失於西南， 速去可也，謝之天地。","劉小姐愛蒙正\n志乘云：呂蒙正妻劉氏，樞密文茂之女。蒙正未逢時，茂輕之，有悔意。劉小姐獨愛之，同居破窯。因見蒙正舉止不凡，知蛟龍非久困池中物也。後果大魁天下，三居相位，受封蔭焉。"],["中平","三千法律八千文，此事如何說與君，\n善惡兩途君自作，一生禍福此中分。","問爭訟、且斷理、求財祿、當揣己、病早禳、勢莫使、婚更審、方吉利。","善有善報，惡有惡報。\n凡事趨善避惡，切莫貪取燥進，大抵先憂後喜也。\n問求事營謀，但看心地良善否，若奸詐之輩，求得此簽，即禍報之警 告。","此簽謀為陰事。神不之告。如法律操自官府。豈得預行宣洩。唯是禍福無門。全憑善惡判斷。所為善。自應得福。所為惡。自應得禍。禍福之機。人自知之。將求 福而避禍。可不急去惡而遷善哉。","律文。刑書也。三千。以罪條言。八千以字數言。生死輕重。權歸刑曹。非外人所得與聞。故云如何說與君也。然有不可知而可知者。決之於善惡兩途而已。善惡 唯人自作。則禍福亦唯人自求之耳。蓋凡事當務善以去惡也。聖意：深切著明。人其凜之。","三千法律，指的是罪狀條文，八千文，是指律文的內容，這是一般凡人無法了解，也不能事先知道，未來的吉凶，完全決定在現在所為的善惡，神佛無法為你多祈 求福份，只有自己的修為才能影響吉凶，一生的禍福都由自己所作為的善惡決定，非他人能決定。此簽神明無法有所助益，未來禍福早已決定在自己，求福避禍，倒不如去惡行善 。此簽的吉凶完全在各人作為。","吉凶多變、非止一端、言不盡意、當以心觀。福因積善、禍胎稔惡、知所趨避、宜自先覺。","訟庭有險莫胡行、無是無非夢不驚、禍福原來無定數、權衡善惡自分明。","一生入場畢，自謂文字得意，占此，竟無名。後收原卷觀之，前場密圈擬元，後場則塗抹不堪矣。此三、四兩句之驗也。\n又余姑丈龔慎齊，明經當廩保時，占財氣，得此。時府試挨保無贄敬，惟院試每人送百文，計文武塗並進，一生三款，合算得銅錢八千文。簽經之明示，其驗如此。\n又(清)光緒己卯(1879年)，泉州南台寺文會，晉江邱生帶簽譜，在大魁殿用錢卜此。後鄉闈，惟邱生卷八次到取中。此亦“八千文”及與君數字之驗焉。","運勢：人生旅途，吉凶禍福，報應分明，宜多修身。\n家庭：人口分散，時局造成，君爾宿冤，不可忘之。\n財利：勞心之 也，力行之耶，即可得之，保留財要。\n事業：雖辛勤謀，淡然是己，不必餒志，必有轉機。\n升遷：積善之家，慶有餘也，守之修之，祈神奉佛。\n姻緣：此緣可求，自吾修之，自成良緣，白頭偕老。\n考試：可有成就，唯付代價，甚鉅難荷，珍惜之耶。\n健康：作福禳災，自我治之，藥到病除，嗣後 小心。\n遠行：行之維艱，勤勞作之，終能獲償，珍惜成果。\n訴訟：平素修身，行善在先，天理行之，方能勝訴。\n失物：失於西南，耐心等待， 即可回也，嗣後留意。","蕭何注律\n漢·蕭何，沛郡豐人。微時，嘗為刀筆吏。後佐漢高帝定天下，為宰相，以功封酇侯。漢既一統，以三章之約非可長治天下，乃命蕭何注律，使民知所守法焉。"],["中下","木有根荄水有源，君當自此究其原，\n莫隨道路人閒話，訟到終凶是至言。","訟當戒、病宜禱、名不利、婚難老、口舌防、行人到、凡事謹、莫輕躁。","有口舌，必須慎言。凡事謹慎，不要浮躁，不可輕信人言，宜多做省察工夫，自可免災。\n問訴訟，尤當戒。\n問疾病，宜禳解。\n問婚姻，欠 理想。","此簽戒宜謹讓。凡事準情酌理。探取根源。自能明其是非。審其進退。切不可聽傍人言語。妄構訟端。訟必有凶禍在後。至此時悔之晚矣。何如慎之於先之為得也 。凡事宜止不宜進。宜解不宜結。宜靜不宜躁。占者慎之。","木有根而暢達。水有源而流長。物理有之。人事亦然。如善為福之原。仁為壽之原。讀書積蓄為名利之源。得其原而萬事理矣。最人所宜究其心也。若歧路悠悠之 口。常誣妄不可信。倘一時通聽。至涉訟端。必屈於理而左於計。此終凶之道也。人可不慎於始乎。","樹木必須紮下深根，才能穩穩地樹立，潺潺的流水也要有個源頭，河流才能源源不絕，這是天地萬物不變的道理，必須自己探究其原因，去惡從善則能趨吉避凶， 為人仁慈則能長壽。千萬不要道聽途說，傍人在耳邊勸說，似乎是有道理，其實都是巧言令色，如因此而涉訴訟，則有厄運，千萬要記得，不可涉及訟事，關起耳朵，不要聽別人 的小道訊息，從根源修德行善，才是最根本的道理。","禍因惡積、當究其源、最宜向善、病保全全。自當謹慎、勿信人言、若有偏徇、禍不踵鏇。","口是禍之門、人言總見真、公庭無一字、謹守福隨身。","一士人占功名，得此。遲數科至甲子始中，應首句也。後謁選官至司理，因斷獄受賄而敗，應第四句也。\n又一人先習儒，後習賈，因當家生理不定，欲覓別途。迨占此簽，始仍舉業，不數年果入學，克紹乃父書香。此上二句之應也。","運勢：命運乖舛，勞而無功，時命致之，不是爾拙。\n家庭：人之進步，心存正直，先積吾德，方至福海。\n財利：試之以 小，損失亦少，不宜貪婪，否則堪虞。\n事業：全世風靡，皆是如此，不是汝拙，是世景迫。\n升遷：修吾身者，切改妒心，本性可去，宜慎行動。\n姻緣：萬萬不可，世間異類，設法分手，不可動武。\n考試：雖志功名，似乎已絕，雜務之多，無法專心。\n健康：自吾修身，且自新之，作福祈安，必有 痊癒。\n遠行：為人厚道，人人景仰，貴人扶之，事事可成。\n訴訟：天理在前，行之方可，否則兩敗，仲人獲利。\n失物：去者全毀，是警惕者， 不可不戒，否則再失。","呂後害韓信\n漢之得天下，信功居多，初封齊王，後改封楚王。高祖復疑其反，乃偽游雲夢，執歸京師，降封淮陰侯。信以失職怨望，羞與絳灌等為伍。會帝親征陳豨，家奴上變。呂後乃與蕭何定計，誘信入朝，竟斬信於未央宮，夷其三族。"],["下下","家道豐腴自飽溫，也須肚裡立乾坤，\n財多害己君當省，福有胚胎禍有門。","莫貪財、能害己、休斗訟、當知止、病禱神、孕生子、婚擇良、行未至。","有口舌是非。財多害己，不可妄求，只宜積善去惡，莫貪多財。","此簽家道雖然溫飽。宜自謹守。不可倚強欺弱。主有口舌是非。更防貪求不已。致生後禍。禍福無不自己求之。可不慎乎。","衣食溫飽之人。常欠諳諫。肚裡立乾坤。謂須自作主張也。可行則行。可止則止。不可輕聽人言。自取煩惱。財多害己。則過分貪求之累也。福有胚胎。善是也。 禍有門。惡是也。審於善惡之途。禍福唯所自擇矣。此示人趨吉避凶之道也。","家庭環境富裕。所以不必為了三餐溫飽而煩惱，當然心思就無所事事，雖然如此，還是要有自己的定見，如果隨周圍的宵小起舞，則會造成禍根，家中過於有錢， 只是讓自己更加浪費，不懂珍惜的結果會反害自己，禍福自有源起，從善則能招福，胡作非為地使壞，只會讓自己走入災禍之中。此簽告誡禍福自找，必須懂得修為，去惡從善， 修得善果。不論福禍，必定自我承受。","家道昌盛、猶宜謹守、自立主張、祈求護佑。輕財重道、方能長久、善善惡惡、自作自受。","自家心地自家知、莫管他人閒是非、若能作福求安靜、雖禍終能轉福機。","(明)天啟時，一台諫不順閹宦，恐有他禍，占此，乃休官散財，安居林下。或權閹勢敗，此公仍復趣擢。此自明禍福之驗。\n又一人，春月妻病，寢食不安，子又患痘。占此，莫識所指。有為","運勢：走入溝壑，最低潮時，不得抵拒，忍之時屆。\n家庭：月淡星疏，門戶冷落，家門淡白，宜先修身。\n財利：目下逆境，謀略用罄，尚未見效，不是爾拙。\n事業：守之作之，不宜改行，時運至耶，再觀局勢。\n升遷：身心不適，先修吾身，後方有望，珍惜之耶。\n姻緣：此緣不宜，兩姓不合，勉為合之，噬臍無及。\n考試：歷盡艱難，皆無可獲，改行去可，學一技長。\n健康：素行善者，今疾重矣，悉心治之，皆有望之。\n遠行：留在鄉梓，已足溫飽，出行去也，反而受損。\n訴訟：兩虎相鬥，焉能無傷，天眼視察，和之為上。\n失物：己之不慎，重物遺落，不知何方，認之可也。","袁安守困\n漢·袁安，字邵公，汝南人。少時貧困，志行清高，嘗高臥雪上。後舉孝廉，除陰平長，任城令，所在吏人畏而愛之。至為三分時，漢室中微，外戚強盛，朝廷之上，皆倚賴安一人焉。"],["中平","乾亥來龍仔細看，坎居午向自當安，\n若移醜艮陰陽逆，門戶凋零家道難。","名與利、依理求、婚與訟、莫妄謀、病擇醫、方無憂、行人至、慮且休。","凡事應依理而行，不可悖理自以為是，否則將自食惡果。","此簽凡事宜依理順行。不可妄意強求。反招禍患。如相地者。乾亥來龍。自以坐坎向午為順。若獨執偏見。改作醜艮作穴。是為陰陽背逆。豈不致門戶凋零之咎乎 。此以見吉可趨。凶可避。慎無顛倒錯亂。自貽伊戚也。","此以羅經方位比喻也。乾亥位居西北。來龍由此。脈甚分明。坎為正北子位。午為正南離位。坐坎向離。自與乾亥來龍。有陰陽交媾之美。安穩奚疑。若醜艮位居 東北。則與乾亥陰陽相反。奈何移穴在此。豈非自是其愚乎。門戶凋零。丁口不旺也，家道難。財產退敗也。人不可逆理數以妄行。斷斷明矣。方向西北正北正南皆利。東北不利 。年運。亥子午年頗佳。醜寅年欠吉。","為人處事必須依照天理。乾亥來龍，指西北方位是吉位，而坐北朝南的方向是平安吉利的坐向。若無視於天理的運行，硬要移居東北方，則與西北吉位造成直角， 是非常不利的方位，若執意要居於東北方，則會面臨家道凋零，而且凡事不順遂，則對家中人口有損。在亥子午年時運勢良好，但在醜寅年則較不順。","立宅安墳、當明正向、龍穴雖吉、向差則病。凡百謀望、南向則善、一或他向、恐不如意。","天然得個好規模、心計雖多莫改圖、妄作妄謀終是拙、吉凶分界莫歧趨。","一人擇婿，占此，不解。後得姓馮屬豬者為婿。蓋乾象為馬亥，屬豬來龍者，乃乘龍佳婿也。應首句奇驗。","運勢：財運平穩，應滿足之，不宜盲進，世境之迫。\n家庭：人口分散，世局使之，砸桶主人，必謀合和。\n財利：平穩之 時，不宜貪婪，貪之通貧，不可不知。\n事業：事事小心，童叟無欺，信用奠基，必能轉旺。\n升遷：先修身心，常念布施，懷之心安，必可有之。\n姻緣：審慎此緣，天賜機緣，視爾眼識，可即定之。\n考試：爾之功名，歷盡滄桑，宜珍惜之，叵有差錯。\n健康：速求名醫，目前不對，立即聞訊，方能 治痊。\n遠行：出不如居，目下局面，守之較利，出之艱難。\n訴訟：世人陰險，宜辨別之，恐有難關，尋覓貴人。\n失物：街有望也，失於陽方， 速去尋覓，或全領回。","宋神宗誤圩牛頭山(原書缺)\n圩者，丘也;扜者，越也。意神宗(1068~1078年)誤闖牛頭山。牛頭山，位湘潭。宋神宗或為宋高宗(康王趙構，1127~1131年)之誤。宋·康王被困牛頭山，故事見於《岳飛傳》(清·錢采)，敘金主兀朮搜捕康王，康王逃亡至一山頂，後被岳飛所救。"],["中平","一朝無事忽遭官，也是門衰墳未安，\n改換陰陽移禍福，勸君莫作等閒看。","名與利、宜改圖、訟和解、保無虞、病更醫、行漸回、婚別配、莫輕為。","所作所為，或有未合乎善因，故必須改變作為，積極行善，就能改變目前的困厄。\n問名與利，宜改圖。\n問疾病，宜更醫。\n問訴訟，宜和解 。\n問婚姻，對方若無意，應另找對像說親。","此簽宜趨吉避凶。革故從新。不可妄為。亦不可坐守。始以無故而得禍。後亦可以作善而致福。如人家墳宅未安。必須改換陰陽方向。乃可化凶為吉也。若自己毫 無轉動。福何由而集。禍何自而消乎。","無事遭官。訟非乎起也。門衰墳未安。是其陰陽二宅。風水不利所致。改換陰陽。言更改宅墳方向。移禍福。由此轉禍為福也。莫作等閒。言禍福隨人轉移。迥非 泛長無根之論必身體力行。親見其效。始信為千古至言耳。胡不勉而行之。","閒來無事卻突遭是非纏身，無風不起浪，絕非無中生有，此次纏訟起因於陰陽宅的問題，目前的風水有所不利，只要改變陰陽宅的坐向方位，則可轉禍為福，或許 你會心存疑慮，無法認同，如果你等閒視之，則禍患無窮，若能姑且相信，作適當的改變，則會有很明顯的轉變，不妨試試。此簽表示必須有所改變，不可等閒視之，或心存懷疑 ，起身動動，運勢也會跟著動動。","風水不利、門戶衰蹇、致招殃咎、有此禍變。急宜速改、避惡向善、若能戒意、庶幾脫免。","禍福無門各有因、免求地理與星辰、若能積善祈天佑、禍自消除福自新。","一生占此，中武會試。\n一生占之，因墳傍開門，構訟。蓋求第者遭官、受職、置產、置營葬者遭官，則應不宜也。俱首句。","運勢：時之將屆，君可忍之，且貴人陝，安心等之。\n家庭：人口是旺，分散各地，宜合謀之，團結力大。\n財利：今平穩 也，不宜著急，錢為長命，安心置理。\n事業：目下之境，蓋世如是，過度開發，招來禍根。\n升遷：先調身心，後續有望，較晚方至，宜珍惜之。\n姻緣：培之感情，認清心地，良善者也，可以許身。\n考試：多年願望，君亦用心，秋圍畢也，必有題名。\n健康：爾素行優，有疾罹身，神佛扶持，不必 憂慮。\n遠行：暫守於鄉，比出有利，因世景迫，不得抗拒。\n訴訟：以和為重，和之不成，據理力爭，必握勝券。\n失物：去者去也，嗣後小心， 失之一時，懊悔全生。","所謂「牛眠吉地」由來，乃東晉陶侃將葬父，家中牛忽走失，侃因尋至某處，適逢一老父謂之曰：「前岡見有一牛，眠山汙中，若葬之，位極人臣」，又貫指其修處曰：「此亦吉地，當出二千石」，言訖不見，侃尋牛於山下，遂葬父於此地，而侃與周訪至交，乃以修地告之，後侃位三公，訪亦三世為益州刺吏。\n所謂「牛眠吉地一當指其龍穴形如一牛臥於水澤之狀，圓聳端秀，龍虎有力，堂前有秀池相映。後世因稱吉穴為牛眠地。"],["中吉","假君財物自當還，謀賴心欺他自奸，\n幸有高臺明月鏡，請來對照破機關。","訟莫欺、依本份、病遇醫、名休問、婚慎求、事審論、孕保全、行人鈍。","先難後易，欺人自欺，反惹其禍，只可修心向善，暗助神明佑護，不可妄為。\n問訴訟，終凶。\n問婚姻，宜慎重。\n求財，依本份。","此簽被人欺凌。暫時耐守。自可昭雪。如人負欠不還。多方謀賴。理曲在人。我何畏哉。自有清正官司在上。恰似高台明鏡。一經照察。機關立破。謀賴者從此敗 矣。此以見凡事當依本分。毋逞狡詐。本分到處可行。狡詐適自害其身而已矣。","借物當還。情理之常。謀賴欺心。情理之變。受欺者勢雖弱。欺人者天不容也。高台明鏡。比公正明決之官。明鏡足以察秋毫。明智足以摘奸伏。無有機關而不破 者。欺心者盍早悟乎。占事者或應在秋。或應望後。月圓時有驗。","有借有還是人之常情，借東西給別人，希望別人自己會奉還，然而他人存心狡詐，故意耍賴拖欠，你也無可奈何，幸虧還有天理，猶如高台上的明鏡，照亮所有真 理，也照穿了邪惡的機關，狡詐的心可以欺負人，但無法騙過天理，最終還是鬥不過天理，遲來的正義還是會來，得到平反，收回了借出的財物。此簽告誡天網詼詼，疏而不漏， 不是不報，時候未到，不可有故意占人便宜的心態。","負人財物、欺賴自奸、幽有神鬼、顯有清官。一朝照破、難逃其禍、每事依心、無施不可。","本分公平、合天合地、若有虧心、神明共棄。","江右一人負屈，屢訟未勝。後遇山東趙耀為按察使，其冤始白。趙本清廉，且趙與照同，應明月照耀之義。\n又(清)同治甲子(1864年)九月，發逆(太平天國)陷漳州城時，晉江令葉公為霖占此簽。至十一月，果有高提台帶兵來剿賊，應“高台”“破機關”也。\n又一婦人往府口探親，回時遺失一釵，遍尋無蹤，因到廟占此。有為","運勢：轉捩已至，再勞其心，動吾筋骨，必有成就。\n家庭：人丁分散，交通所賜，時予連繫，結合吾族。\n財利：目下平 穩，穩紮穩打，步步為營，即可足矣。\n事業：孜孜不借，莫嘆辛勞，一點一滴，必有斬獲。\n升遷：多行善德，毋忘善行，平素修身，加之積善。\n姻緣：天作之緣，合自天神，不宜強求，自認之可。\n考試：十年寒窗，埋頭苦幹，堅心苦守，終獲出頭。\n健康：舊疾復發，名醫在旁，火速求之，必可 治痊。\n遠行：當面不宜，暫時守鄉，來秋時屆，看風使舵。\n訴訟：伊人蠻橫，不可理喻，訴諸天理，必可勝訴。\n失物：有尋著時，耐心覓之， 是為警惕，嗣後小心。","寇公任雷陽\n宋•寇準，字平仲，下邽人，年十九舉進士。真宗時知同州，判永興軍，盡心民事。每曰：“有一時之閒，則有一時之滯。”後拜相決策，成澶淵之功。出鎮大名，貶雷陽。準內儉外奢，寢處一青幃二十年。仁宗朝贈中書令，封萊公。"],["上吉","彼亦儔中一輩賢，勸君特達與周鏇，\n此時賓主歡相會，他日王侯卻並肩。","財必獲、名遇薦、訟得理、病有願、婚姻成、行人見、發福祿、因積喜。","多與賢人君子親近，則他日必多有貴人提拔。\n凡事謀望，無不遂意。\n問婚姻，可成而且理想。\n問求財，將有收穫。\n問功名有被推薦的 希望。","此簽凡事早植因緣。後此自有莫大利益。如往來儔類中。現有一賢士在前。必須特與訂交。厚相結納。日後此人得志。乃是王侯之貴。幸得以故人肩隨上下。托末 光而附尾後。易易事耳。若待臨時攀扶。豈有濟乎。凡事予則吉觀此益信。","一輩賢。出類拔萃之品也。此時彼亦未遇。人或習而忽之。特達周鏇。從眾人中特加物色也。賓主歡會。此日交契之情。王侯並肩。他年富貴之侶。事有無心得之 。而或以有意遇之者。多此類。非具遠大器識者。未足以語此。人不可以無友。尤不可不知所擇矣。","在往來的朋友當中，有一位賢能之人，但此時並沒有特別出色的表現或得到賞識。此時你必須特別與他多加交往，不妨以主人的身份多加款待他，並建立起深厚的 交情，以後當他成為王宮侯爵之士，你依然是在他周圍的貴客，而且會受到他的提攜。此簽表示他日的豐收，必須在今日就種下因緣，等到他人升至高官再去拉關係，一切都太遲 了，必須慎選友人交往。","事有相干、宜與效力、君既周鏇、他必報德。凡所謀為、遇貴方得、神力陰扶、福報有日。","凡事成全必有因、交情初淡後相親、貴人提攜無難力、魚水相逢信有神。","(明)嘉靖中，豐城雷禮會試不第，占此，下科中第，前一名王宗本，後一名侯岳牧。嗣後，三人同時為南部尚書，“王侯”、“並肩”之言益驗。","運勢：命合正時，大道生財，珍惜此時，勿忘積善。\n家庭：人口興旺，局勢分散，砸之集之，家門興旺。\n財利：利路正 通，理財有道，恆足之時，宜儲之耶。\n事業：大亨大利，百貨皆準，財帛皆入，謝天謝地。\n升遷：素善蓄積，結子成實，毋忘調適，大有助益。\n姻緣：天賜良緣，互退一步，敬之如賓，白頭偕老。\n考試：名列三公，功高四海，滿堂瑞氣，榮宗耀祖。\n健康：突來之疾，火速求治，所幸華陀，妙手 回春。\n遠行：可出行也，神貴扶持，可蒙利也，有利即回。\n訴訟：為意氣爭，受人欺詐，據理力爭，必可勝訴。\n失物：失之北方，火速尋去， 必可回手，素積之德。","宋仁宗認母\n《宋史》：仁宗，李娠妃所生，劉後抱養為己子，左右皆為畏後威，無敢言者，故帝不知也。及娠妃卒，後欲以婢禮葬之，宰相呂夷簡請厚葬。後怒曰：“一宮人死，相公何云云。欲離間吾母子耶?”夷簡對曰：“太后不以劉氏念，臣不敢言;尚念劉氏，則禮宜從厚焉。”後悟，乃以一品禮。夷簡再請以後服殮、水銀實棺，太后許之。迨後崩，有為帝言娠妃所生及妃薄殮之事。帝號慟，即往祭，易梓宮親啟視之，妃以水銀實棺，面色如生，冠服悉如皇后。帝嘆曰：“人言其可信哉!”待劉氏加厚。"],["下下","隨分堂前赴粥饘，何須妄想苦憂煎，\n主張門戶誠難事，百歲安閒得幾年。","名與利、莫貪求、訟宜和、行未至、病瘥遲、婚莫議、能保守、家必利。","只宜守成，不可妄為，凡事且隨緣分。做事緣份。做事不宜強出頭，以免自尋煩惱。\n不宜出行，婚姻莫議，財莫貪，名利休問。\n問訴訟，宜和 解。\n問疾病，未痊癒。","此簽宜隨分退守。恰得安常處順之樂。若貪現前而圖意外。不唯無益。更增煩惱而已。雖則家計艱難。然安閒境地。不可多得。何不愛惜光陰。甘守清況之為得乎 。凡事恬靜則吉。妄動則凶。","隨分粥饘。言一粥一飯。皆系人間清福。盡堪享受。妄想。是冀幸富貴利達。一切本分所無之事。苦憂煎。是自尋苦趣。言當以妄想為戒。定不應如此也。主張門 戶。猶言做人家。誠難事。言非不知做家之難。但人生百年有幾。安閒一時是一時。妄想勞苦何為也。占此者可知止矣。","即使只是一碗清粥，都要懂得珍惜，將自己的欲望降至最低，則能隨遇而安，若苦苦追求福祿財寶，也只是多加妄想，讓自己陷入痛苦的煎熬。如果想要自己跟富 貴人家相比，只是更加為難自己罷了，實在是作不到，又何必讓自己痛苦，人生在世短短几年，求的是平安閒適的生活，目前雖然物質生活較不充裕，但日子過得還算清閒，如能 自得其樂，不也是很好嗎?","好事隨緣、莫貪莫競、且宜守成、庶保全靜。若更妄求、必主多憂、何如退省、以遂優遊。","貧賤安常識者稀、天時人事貴知幾、依然舊日規模好、休聽閒人說是非。","一生小考，占此，發案列優等補廩。應“赴饘粥”也。\n又一大剎，僧欲謀為住持，占此遂止。後見主僧操持勞苦，迎送乾謁，煩惱怨恨，不如己之安閒清靜，始悟簽言不謬。\n又余妹倩，按照磨林名樹立之。母病危，占此獲痊，“應百歲安閒得”也。\n又一人被人討欠，討欠人債迫太急，欲賣屋償之。占此，竟賣不得，後果就收入還出了事，方悟二、三句之驗如此。","運勢：時運走低，小心處對，否則更慘，時運所致。\n家庭：目下分散，各自討生，但必謀合，可成力量。\n財利：君爾命 定，目前無法，求之無用，守之即可。\n事業：四方之財，皆取不得，不為爾拙，時勢迫者。\n升遷：身心調好，而後論之，目前不易，宜守之也。\n姻緣：兩姓不合，速退去可，苦用心機，反來尤害。\n考試：命薄之人，功名無緣，速改行去，行行狀元。\n健康：痼疾復發，家醫隨身，所幸新藥，救之 一命。\n遠行：萬萬不可，氣候不良，路途遙遠，易生險象。\n訴訟：兩虎劇斗，何不傷身，不謀和也，恐有獄災。\n失物：失於東方，一不慎也， 成悔恨矣，嗣後小心。","諸葛孔明學道\n漢•諸葛亮，字孔明，瑯琊人。漢末避居南陽，志學清修養生之道，研究奇門遁法、天文術數、卦算韜略，無所不精。初不求聞達於諸侯，後徐庶薦於劉先主。先主凡三往問計，延為軍師。先主即位，拜丞相，受以託孤。後主封為武鄉侯，卒謚忠武。"],["中平","箇中事緒更紛然，當局須知一著先，\n長舌婦人休酷聽，力行禮義要心堅。","訟宜解、莫信才、財緩求、名莫貪、孕生女、行人還、婚更審、莫妄扳。","凡事豫則立，不豫而廢。不要聽信人言，致生變故。所謂長舌婦人，是陰人之言，為智者所不取，決不可聽。至於做事，要當機立斷，才有所得，如果 遲疑不決，則將失去機會。\n問謀望，只要平心靜氣，順其自然，莫要強求，自然禍去福來。\n問訴訟，宜和解，莫信讒言。\n問行人，即將還。\n問婚姻，莫強求，宜 另找對像。","此簽示人扼要爭先之道。頭緒雖煩。目應批卻遵竅。恰得妙著。儘先布置。恐有陰私小人。從中挑撥。不可過聽。總須自作主張。依理而行之。積久勿替。則紛煩 定而事緒理矣。凡事不可游移無主。持正有守則吉，治家者切不可聽信婦人之言。","事緒紛然。現在危難之境。一著當先。局中制勝之要。如奕棋然。一著得力。全局皆勝矣。此須自持定見。不可聽信人言。婦人長舌。尤宜戒之。故曰休酷聽也。 義以制事。禮以制心。先著實在乎此。要心堅。言須永遠堅牢。不可始勤終怠也。必知明處當。不為浮言所搖惑者而可哉。","目前處於危難之中，此時必須下狠招，就好比是下棋者，經過深思謹慎地下，這步棋則關係了全局的成敗，周圍的耳語不必理會，尤其是家中女人，不要理會她的 言論，身體力行禮義之事，而且不可怠惰，必須持之以恆，才能度過此時的難關。此簽告誡不可聽信也人之言，尤其是家中婦人，要更加小心處置。","萬事一理、各有先見、莫聽人言、激成多變。依理而行、禍自可免、當堅乃心、毋或退轉。","理煩治劇有先機、莫聽讒言是與非、任爾風濤千萬狀、漁翁穩坐釣魚磯。","一人惑於婦言，欲與弟分居，占此遂止。其後因弟克勤克儉，興財致富。其兄安享，終身和樂。聖言之化人也如此夫。","運勢：不是上吉，但已可慊，把握時機，余則節之。\n家庭：人口勤勞，合和從事，家譽隆盛，必能立基。\n財利：心地光明，不可欺人，欺人天知，立即現之。\n事業：謹慎作為，研究事理，時潮為尚，掌握方向。\n升遷：積德修善，終獲善報，平心養性，必可安泰。\n姻緣：雖是緣好，兩性齟齬，不易配合，不宜強求。\n考試：山中頑石，琢磨已久，自發光輝，珍惜些順。\n健康：良心行事，老天佑之，神佛扶持，必可痊癒。\n遠行：審慎之可，未必出去，在鄉已足，入秋後可。\n訴訟：為何未息，未必意氣，退後一步，海闊天空。\n失物：可追尋之，皆有希望，必可尋回，耐心追之。","須賈害范雎\n戰國•范睢，字叔，魏人。事須賈使齊，襄王賜金及牛酒，睢辭。賈知之，歸告魏相魏齊。齊怒笞擊雎，折脅擢齒。雎佯死得脫，入秦說昭王，拜相。須賈使秦，睢敝衣微服，至邸見賈。賈驚曰：“范叔固無恙乎?何一寒至此。”乃取綈袍贈焉。睢以賈有故人風，釋之。"],["中平","一春風雨正瀟瀟，千里行人去路遙，\n移寡就多君得計，如何歸路轉無聊。","且隨分、莫貪財、訟宜息、防外災、婚不利、遠行回、禱神助、福自來。","只宜守舊，不可妄想，若欲強取財物，必致招禍。\n問婚姻，欠理想，不吉。\n問遠行，即將回。\n問疾病。禱神助，福自來。","此簽宜守分安命。不可妄求。如春天風雨交加。不待晴霽。於此急迫遠行。不知幾歷艱險。究竟事與願違。算在意中。失在意外。空受勞苦而已。此貪求躁進之害 也。知幾者其慎之。","風雨瀟瀟。泥濘不堪之狀。千里路遙。行人更屬艱難矣。此人運途未通。動多阻滯之象。移寡就多。言人不知守份待時。妄思籌算以為得計。豈知理數已定。終於 無濟。貪求而去。仍無聊而歸耳。則亦何益之有哉。人可知進而不知退哉。","目前去路風雨飄搖，阻擋著前去之路，然而不等到雨過天晴之日即急於出發，只是讓自己多加受苦罷了，只要想動則會受阻。看到別人的作法則躁進跟隨，那知道 去了之後又不如自己想像中容易，不管你如何計畫，還是敵不過天數已定，最後無濟於事，敗興而歸，這又有什麼意義呢?倒不如一開始就不要做，還可保有平安閒適的生活。此 簽告誡人不可只想要前進，而不知如何退守，有時想想如何全身而退，可能會是最好的方法。","時之未遇、歷涉艱阻、巧計雖多、終於無補。且宜守舊、毋過於取、庶保已成、禍散福聚。","月飲啄皆前定、人乖命不乖、機謀終有損、行止聽安排。","一士人應一摯友聘作縣幕賓，束修百金。占此之後，又遇一按君出五百金，其人即棄縣而就按。未幾，巡按卒於任，財物為有司決閉，一無所得而反，始悔不從簽之示也。","運勢：事事小心，秋景得意，必有所成，謙恭為之。\n家庭：家門興旺，人人勤奮，謀之合和，必有所成。\n財利：資財俱 來，多年臂劃，對中此時，此樂難忘。\n事業：凡百謀望，夏畢入秋，必見轉機，勿失良機。\n升遷：平素修身，調適吾身，時屆花開，結子成果。\n姻緣：兩姓兩合，修吾身心，先苦後甘，百年偕老。\n考試：多年埋案，終熬出頭，令人雀躍，惜之此福。\n健康：痼疾復發，名醫侍候，無大礙也，逕行 小心。\n遠行：出之可也，唯未必利，不如居家，安穩可取。\n訴訟：有訟即和，和之為貴，惡霸人棄，天可不欺。\n失物：失之北方，可去尋之， 雖余半也，亦可帶回。","姜女尋夫\n野史：秦•孟姜女，夫范杞郎(萬喜良)新婚奉命作長城之役，姜女往尋之。及至，知夫已死，欲尋骸骨歸葬。神為指處，咬指出血，點認夫骨，號慟大哭，長城為之崩。婦人守節，自孟女始。"],["上吉","一舟行貨好招邀，積少成多自富饒，\n常把他人比自己，管須日後勝今朝。","財祿富、訟得理、婚和合、病漸止、問行人、歸未擬、莫害人、人即己。","正走上好的運氣。但是一個人得意時，要更加謹慎，不可矜誇，更要己立立人，己達達人。為他人謀福利，那么你的好運氣會永遠不衰了。","此簽凡事應漸進。不可欲速。不可欺心。如貿易者。雖值物貨當行。亦宜為人構想。兩得其平。自然漸入佳境。若專求利己。必致損人。天道豈佑之乎。","行貨。牙行買賣之貨。好招搖。貨價得時。正好招引買客也。但取利不可過重。積少成多。自可致富。比人猶己。言即己心以度人心。不可用意刻剝。後勝於今。 數可憑。理尤可憑也。為富不仁者戒之。","平常流通的貨物，只要利潤適當，則可招來許多買主，所謂薄利多銷，如此則能積少成多，時間累積久了，自能成為富裕之人，經常設身處地為他人著想。不蓄意 剝削他人利益，未來一定會比現在更好，這是天理自有定數，但已成為富裕之人，千萬要待人以仁，為富不仁者，自斷後福。此簽告誡必須循序漸進，保有仁心，富裕幸福的日子 則可持久。","同時經營、皆欲成家、將人比己、不必矜誇。自然天佑、福祿亨嘉、更宜方便、錦上添花。","交易公平自得安、莫將人己兩般看、欺心利己終何益、本分常教俯仰寬。","一紙客出行，占此。後遇逆水行舟，風在灘險，舟人不戒，船摺紙沉，半沒於水。舟人願賣破船賠償，客不忍，縱之而去。至其地，紙大賤，且涇難賣。候曝乾時，紙已賣缺，爭買水濕者，大獲三倍之息。此不忍人賠償，一念之善也。","運勢：命合正亨，大道生財，正是此時，毋忘儲蓄。\n家庭：家和事成，人人鏘志，啻待結合，可成支軍。\n財利：利路順 通，加之臂劃，料之如神，到陶朱富。\n事業：押之中之，時運之至，皆是如此，珍惜此福。\n升遷：平素修身，又行善耶，結子成實，必有收穫。\n姻緣：姻緣天定，天作之合，甚為配合，可成連理。\n考試：天資聰穎，加之辛勤，功高四海，一點狀元。\n健康：幸有華陀，又加新藥，病重即愈，素來 行善。\n遠行：出之可也，惟利即回，以鄉為安，基礎穩固。\n訴訟：雖是受屈，得設法之，脫離冤屈，無妄之災。\n失物：雖不慎失，在北之方， 火速去尋，必可覓回。","管、鮑為賈\n春秋，管仲與鮑叔微時，曾同為賈。及分金，管仲多自與，鮑叔知之，不以為貪，知其貧也。後鮑叔為齊桓公大夫，薦仲為相。其善全交道，有如此者。"],["中平","陰里詳看怪爾曹，舟中敵國笑中刀，\n藩籬剖破渾無事，一種天生惜羽毛。","名利無、病有崇、訟莫興、和為貴、莫貪財、婚不利、孕無憂、行未至。","彼此應該相愛，只要你能大公無私，取信於人，自然平安無事。\n先凶後吉，凡事要和同，可免是非。\n問訴訟，宜和解。\n問婚姻，恐有變。\n問財利，莫貪求。\n宜防暗箭，小人侵害。","此簽示人光明正直。勿為爾詐我虞之行。胸中既無畛域。天下皆成一家。到處同聲相應。同氣相求。何不利之有。若以相傾相軋為能。終至兩敗俱傷。未有能善其 後者。人可不知戒哉。","陰里詳看。猶言暗中熟察。怪爾曹。深駭此輩所為也。舟中敵國。外同處而中暗算。笑中刀。外和靄而中狠毒也。聖意：怪之者。以此籓籬。彼此隔別之物。剖破 。則籓籬不設。以心相與。自爾無事。惜鳳毛。如鳳彩五色。自應互相愛惜。人之與人亦然。解此者可與論交。可與共濟矣。","從暗中觀察對方的所作所為，了解到敵我的分別，就像是同在船上，卻心生暗算，雖笑臉迎人，卻是笑裡藏刀，外在表現得非常親切，但內心卻防衛心態深重，無 法與之交心。此時放下心中的隔閡，排除不必要的干擾，以真心相待，當作無事，看到光彩耀眼的鳳毛，則會自然而然由內心發出憐惜之心，與人相處就是如此，放下心中的阻隔 ，彼此則可以同舟共濟，化凶為吉。","骨肉乖張、操戈入室、面上春風、胸中荊棘。何必思維、人己則一、若能和同、變凶為吉。","白日青天大丈夫、何須猜忌暗相圖、推心置腹堪唇齒、交濟成功兩不殊。","一生攜重資赴試出行，占此。登舟遇一人，求附舟，失足落水，衣盡濕。此生解衣贈之，復與酒食溫煖之。臨別，謂生曰：“我盜也。將有不利於君，感君之義，故謝去耳。”生復厚贈之。雖此生之德感化其心，亦簽經之明示昭然也。","運勢：時之不予，不宜抗拒，盲目前進，大虧在前。\n家庭：可春啾啷，人口分散，門庭冷落，速謀和也。\n財利：鏡花水 月，求之無用，時潮所趨，不能墨守。\n事業：押之去之，不是汝拙，是時潮變，多放眼光。\n升遷：身心調之，必有助益，方能有之，珍惜之也。\n姻緣：雖用心機，不合即叵，世人各半，另覓可耶。\n考試：與功名者，緣薄之人，速改行去，必有前程。\n健康：突發怪症，所幸神醫，加新藥耶，留住 三叩。\n遠行：去之無益，且是險路，暫守鄉邦，穩如泰山。\n訴訟：明知要解，不可結耶，再訟下去，恐有獄災。\n失物：明知北方，去之不獲， 認之可也，嗣後警惕。","武侯與子敬同舟\n曹操已破劉備，備奔夏口，依劉琦。操乘勢下江南，孫權大懼，和戰未決。聞曹兵聲勢百萬，乃使魯肅往夏口探問虛實，並請孔明同入吳。肅欲戰，於舟中囑孔明曰：“見吾主切勿言曹兵之多，勸其決戰，合力拒曹，願先生相助焉。”"],["上吉","從前作事總徒勞，纔見新春時漸遭，\n百計營求都得意，更須守己莫心高。","名與利、且隨緣、訟解釋、病安全、婚姻合、行人鏇、若謀望、在新年。","以前作事總是空勞無所成就，才交新春之際，時際已漸亨通，凡所求謀之事，都能夠如意，因此更須要謹守，不可肆意妄為。\n上吉，名與利，且隨 緣，婚姻合，病安痊，訟宜和，行人還，若謀望，在新年。","此簽時運將至。所謀必就轉瞬交春之後。萬物發生。人事亦得喜悅。向者難而今者易。向者塞而今者通。志願無不暢遂。快矣足矣。然始也可由剝以使之復繼也。 亦可由復以至否。此時須識持盈保泰之道。方克有終。是以君子慎之。","從前徒勞。往運之困。新春喜氣。後運之亨。營求得意。凡事有成。莫更心高。知止不殆。占此者應在春時。主有遇合。但盈虛消長。各有定分。不可十分過求。 過求則生災害矣。貪得者尚知戒哉。","過去常常都要做徒勞無功之事，凡事都有所阻滯，在交春之際，突然間轉運了，感受到喜氣洋洋的氣氛，而且做什麼事都異常地順遂，凡事心想事成，作什麼都成 功如意，此時必須更虛心待人，不可因此就趾高氣昂，要更安分守己，得意忘形則會破壞好運，此簽表示新春之時，即轉好運之時，必須把握好運，不要因一時的志得意滿而浪費 了大好運。","平生勞苦、百事無成、時運將泰、謀望稱心。更宜謹守、貪心莫生、隨緣受用、坐享安榮。","得失無常事有因、耐求殘冬喜見春、世事隨緣無掛礙、光天化日太平人。","萬曆間，楚中一士人赴試占此，遂甲式。同列謂之曰：“張江陵當權，若拜門下，鼎甲可圖也。”不應，遂殿三甲末。同列又謂曰：“亟求張相，翰林可選也。”又不應，僅得外縣。未幾張相亡，凡附張者俱敗，此公擢為京官。乃“守己莫心高”之驗焉。","運勢：正是當時，把握時機，擷之取之，事仰儲蓄。\n家庭：人丁興旺，四散各方，緊密連繫，可成支軍。\n財利：財源亨 通，且得人和，人人扶持，莫怪致富。\n事業：可集財時，四方八面，均可聚之，珍惜此刻。\n升遷：夢鬼夢蛇，細心調適，勞心勞力，必有所賜。\n姻緣：天賜良緣，此緣可聚，敬之如賓，成比翼鳥。\n考試：少時不得，愈走愈勤，終獲桂冠，對大庭耶。\n健康：突發之症，有神佛扶，又逢名醫，必可 痊癒。\n遠行：即可出矣，得利即回，不宜滯留，伊地危險。\n訴訟：興訟之人，心地兇惡，天眼推之，必致敗訴。\n失物：己之不慎，失於北方， 速去尋找，必可覓回。","高文定守困(缺)"],["中吉","樽前無事且高歌，時未來時奈若何，\n白馬渡江嘶日暮，虎頭城裡看巍峨。","名晚遇、財尚遲、病徐愈、行漸歸、訟可解、孕無危、婚和合、緩則宜。","目前時運未遇，且放開心胸，不必怨嗟，到晚景時，運氣一到，仍然有一番轟轟烈烈的作為。\n乃大器晚成的預兆。\n問功名，有晚成之意。\n問財運，亦來遲。\n問婚姻，能和合，但緩則宜。\n問疾病，漸漸痊癒。\n問訴訟，可和解。","此簽示人隱忍以待時。藏器以待用。不可急。急則顛。不可憤。憤則敗。不可躁。躁則陷。是以君子有處困之道。不憂勤惕厲道之經。飲食燕樂道之權。必通經而 達權。急來以緩受之。逆來以順受之。斯出險濟屯之道也。一旦快馬揮鞭。龍騰虎變。乃真不可方物矣。此聖意：扶危濟困之金丹。人其悟之。","樽前高歌。勸人強自排遣也。人當窮困之濟。時運未來。唯有屈己忍受。強笑為歡。漸得解脫。若急躁惱怒。四面皆陷阱。滿路皆荊棘矣。其將奈之何哉。白馬渡 江。後此得時之驗。虎頭城裡。後此遇合之地。日暮。此晚景。巍峨。言高大也。滿許榮幸在後。暫如龍蛇之蟄以存身。尺蠖之屈以求伸可也。","目前尚不得志，但不可因此而消沈，不如自我排解，高歌取樂，只能等待時機。直到得勢之時，已到了晚年時期，依然可以得到至高的名利。此簽表示必須忍耐待 時，如果無法以樂觀的心態等待，則只能含恨一生，而且破壞了老年的好運。白馬也有表示年月的意思，指的是馬年或馬月，將是可以轉運的時機。","時運未遇、且自開懷、年月逢午、好事方來。雖臨晚景、掀轟一回、眾人聳看、積粟多財。","對酒當歌、寬懷守己、一旦時來、扶搖萬里。","臨川•陳大士，少年占此，五十七始中鄉科，應“白馬渡江”之句。白馬，庚午也;甲戍為行人。奉召吉安封王，衣錦而回。吉安，古虔州，“虔”字“虎頭”也，應第四句。\n又晉江明經陳世清，(清)鹹豐庚申(1860年)春，父病頗重。占此，自謂尊人決無事，可獲痊安。迨是年六月庚午日寅時殆，始悟起二句乃示其尊翁目前卻無事，至六月“未來時”，則無奈何。後二句又暗藏日時於中。神意之深，遠非善會者不能測也。","運勢：目下平穩，先難後易，勤之必有，時予忍之。\n家庭：人口漸旺，各業分散，秋景團圓，家道日隆。\n財利：雖時較 遲，財運終至，求之應之，得勤儉也。\n事業：目下平穩，亦不能沖，沖之跌之，宜多劈劃。\n升遷：再修吾身，切勿著急，時屆花開，必有結果。\n姻緣：此緣不宜，長久相處，情感倍增，緩即可成。\n考試：修苦多年，比常人遲，總有結果，可欣賀耶。\n健康：有驚無險，幸賴華陀，加之修善，必能 痊癒。\n遠行：守在鄉邦，比出行宜，秋有佳音，方可出之。\n訴訟：訟之凶也，可和即賀，由人勸之，必可勝也。\n失物：失之南方，慎思循路， 耐心尋覓，必能取回。","班超歸玉門關\n漢•班超，安陵人，彪之子。少有大志，家貧，傭書養母。嘗投筆嘆曰：“大丈當立功異域，以取封侯，安能久事筆硯乎!”明、章兩朝，征定五十餘國，封定遠侯。久鎮西域，後年老乞歸，帝使任尚代之，故超得歸，入玉門關。至京未幾而卒。"],["中平","崆峒城裡事如麻，無事如君有幾家，\n勸汝不須勤致禱，徒勞生事苦咨嘆。","訟和吉、求財無、婚未成、病無慮、信未至、勿他圖、不須禱、且安居。","不要不知足，你今天能夠平安無事，已經是幸福了，何必再妄求。若去妄求，則禍隨時至矣。\n但當主靜，不可貪圖。\n問訴訟，以和為貴。\n問求財，徒勞心力，結果無收穫。\n問婚姻，沒有希望。\n問疾病，沒有危險，可以痊癒。","此簽境地寬舒。盡可安常處順。消受太平之福。若格外富貴榮華。乃由人家積功累德所致。非可勉強貪求。只須反求自己。何得妄瀆神明。若自作不靖。平空生事 。求如現在安閒不可復得。有不輾轉愁嘆者乎。悟開此理。急將貪求之念。易為積德之計。則幸矣。","崆峒城裡。泛指所居之地。事如麻。人人勞擾不寧也。無事如君。言爾獨得清閒之樂。有幾家。他人望想不到也。勤致禱。是貪心妄想。禱神垂佑。勸汝不須。戒 之也。止之也。徒勞生事。是無事。自尋有事。必致多受煩勞。苦咨嗟。是苦苦長嘆。至此時悔已遲矣。不如及早醒悟之為得也。","能夠像你無事安閒度日者，實在沒有幾個人，你現在的閒適，是得自先人的積德累善而來，無法強求，如果你無法滿足現狀，還汲汲營營地想要榮華富貴，求天告 神，只是徒增煩惱罷了，這個貪念會造成諸多勞苦，而且後悔也來不及，必須看開此點，及早醒悟，才得以安閒度日，否則將白忙一場，甚至勞碌終生。","人事擾擾、君獨清閒、不必瀆神、妄求多般。反招口舌、激起禍端、急宜靜守、以保平安。","閒人厭安閒、妄想忽多般、惹起無幹事、求閒卻是難。","一人訟事，占之，竟無相干。應第二句也。","運勢：可遇貴人，惟要善求，否則敗盟，事事小心。\n家庭：人口漸旺，入春和合，必健全也，結合力量。\n財利：此刻平穩，惟時未至，暫時守之，宜防小人。\n事業：公平交易，童叟無欺，不欺人者，可致興旺。\n升遷：常念布施，修德之足，老天垂之，祈神庇佑。\n姻緣：兩造均允，時予培情，兩造認可，方可為之。\n考試：歷盡苦修，終於攫取，宜惜此福，苦盡甘來。\n健康：擇良醫治，必能治痊，宜防再發，小心戒之。\n遠行：不宜出之，暫守家中，見秋季時，時佳再往。\n訴訟：狼心狗肺，宜辨別之，據理力爭，必可勝訴。\n失物：去者去也，警惕之時，嗣後設防，以免再失。","楊文廣陷柳州\n正史稱：宋•楊文廣，延昭子。從狄青南征儂智高，為廣西鈐轄，兵陷柳州，青救之。與野史云：文廣系宗保之子，陷柳州，被困，楊家諸女將往救焉，傳述迥異。姑並錄之，仍宜從正史為是。"],["中吉","佛說淘沙始見金，只緣君子不勞心，\n榮華總得詩書效，妙里工夫仔細尋。","求名利、勤苦有、訟須勞、終無咎、問婚姻、宜擇友、探行人、三六九。","凡事須歷盡艱難，倍嘗辛苦，然後志慮通達，處事熟練，天佑而人從矣。\n問功名，勤苦方得。\n問財利，亦須勤。\n問婚姻，須先充實自己， 才有希望。","此簽凡有謀望。皆得成就。但須涉歷勤苦方可。故以淘沙見金為比。沙非容易淘。金非容易得。人生苦志讀書。亦復如是。爵祿榮華。皆從詩書中得力。君子憂道 不憂貧。唯自求功夫精到。定有效驗。若作輟無常。內鮮實功。是坐地待金。豈有冀哉。","淘沙見金。言從艱難中得來。君子。指讀書人。言其用心勞苦。亦與淘金者。無以異也。榮華。指功名富貴。詩書效。言必詩書然後可也。妙里功夫。即指詩書奧 妙之處。仔細尋。言須苦功練習。則功名富貴可必矣。雖專指讀書說。凡事可類推而得之。應驗或主庚辛申酉年月日時斷亦可。","努力必有收穫，但並非容易，必須付出心力，才能有所得，就像是讀書人一樣，努力用功，書中自有顏如玉，書中自有黃金屋，但必須經過辛勤的勞苦，未來功名 皆從書中得來，其中的奧妙，必須細細思量，也就是辛勤用功，才得以功成名就。此簽表示沒有不勞而獲，必須經過一番勞苦，富貴名利才會隨之而至。","淘沙見金、勤苦方得、富貴榮華、皆是書力。肯用功夫、自然有益、惰於經營、終無所獲。","凡事精勤、方見利益、苦志詩書、青雲咫尺。","一人有子患痘，危甚。幼科欲用金汁(參見《泉州地產•金汁》)呷之，猶豫未決。占此，詩有“金”字，即以金汁呷之，其子遂有生意，調理月余而安，因識金汁起死回生之功。金汁，即糞清也。","運勢：目前平平，為求突出，不能勉強，否則敗盟。\n家庭：先修吾身，求神生福，切莫自欺，必能合和。\n財利：財運未至，目前平穩，該可滿足，不宜貪婪。\n事業：辛勞經營，逐看苗頭，孜孜不倦，必有所獲。\n升遷：多行善德，結子成實，得好後裔，君百事宜。\n姻緣：姻緣天定，合自天神，不宜強求，自吾認定。\n考試：十年苦讀，堅心苦守，終可償願，惜些陷也。\n健康：突如其來，速求名醫，悉心照料，必可痊癒。\n遠行：目下不宜，時運未至，見秋佳期，得利即回。\n訴訟：不宜興也，謀和可也，意氣之爭，兩敗俱傷。\n失物：耐心尋之，覓之有望，久日見之，嗣後小心。","趙子龍抱太子\n三國•趙雲，字子龍，常山人。初依袁紹，後從劉先主(劉備)。時曹操欲下江南，先攻先主於莘野。先主走樊城，復敗於當陽，家眷失散。雲於土墻下遇縻夫人，夫人將子阿斗(劉備之子劉禪)托雲。雲將馬授夫人，夫人不肯授，投井而死。雲哭埋畢，懷抱阿斗，殺出重圍。"],["中下","今年禾穀不如前，物價喧騰倍百年，\n災數流行多疫癘，一陽復後始安全。","訟紛紜、久自解、病患多、終無害、財祿難、時且待、孕屬陽、祿終在。","今年的收穫不如從前，物價飛漲，加上到處流行疾病，生活更艱苦。須等到冬至一陽來復後，才得安全。\n求財今不如昔，口舌不測，疾病纏綿，命 運偃蹇，於今不吉，待冬至後，方漸安。","此簽年運欠吉。諸事不利。耕作防凶年。置貨防折本。是非曰有。病患淹纏。交冬至後。方得清靜之象。凡事凶多吉少。禍早福遲。最宜審慎。","禾穀。田家指望。不如前。恐水旱之憂。及蟲蝗為患也。物價喧騰。皆因凶荒所致。倍百年。指百年來未有之災也。疫癘。乃天行時症。主******死亡之禍。一陽復 。系子月冬至節氣。或作七日來復解。應在七數。始安全。至此時運程方亨。禍去福來也。占者耐得險阻艱難。末後頗有收成。不能耐者無冀矣。","今年的收成與往年不能比，實在是少得可憐，因為天災所致的歉收，造成了物價的大幅波動，這是百年來的大變動，因為無法防止的天災，造成了傳染病的流行， 而且有致命的危險，必須到冬至時節，才得以控制，慢慢地回復以往。此簽表示今年運氣不佳，諸事不順遂，必須要到年尾冬至，才能較平順，然而一年即將過完了，表示凶多吉 少，必須要特別謹慎小心。","目下求謀、今不如昔、口舌疊來、病多啾唧。時運尚乖、至今不吉、待冬至後、方始寧息。","災耗重重見、紛紜口舌攻、疾病多沉滯、訟事必先凶。","一人賣首飾粧奩之物，因欲改途，占此遂守舊。一陽後忽遇大婚，民間嫁娶殆盡，物價喧騰，倍獲厚利。第二句大驗。\n又晉江一士人，母病初，醫家皆謂火盛，疊投涼劑而病益重。迨占此之後，適有老醫云：“症是真陰假陽，須大溫補，庶幾真陽得復。”後果如其言。第四句之驗巧。","運勢：目下低落，不宜動之，動之即損，不宜抗拒。\n家庭：時局所成，人口分散，宜速謀合，合是力量。\n財利：求之無用，時運不屆，暫守舊耶，反而有成。\n事業：存心不善，交易欺心，資本耗散，無一所成。\n升遷：身心俱憊，先調好身，享之安全，必可成也。\n姻緣：用心良苦，緣卻不合，三思而後，分手力司。\n考試：功名利祿，君無緣也，速改行去，一技可騰。\n健康：舊疾復發，即請名醫，悉心照料，或可留命。\n遠行：目下守之，方可有成，出之反害，時也命也。\n訴訟：兩虎之斗，必有傷害，速謀和也，以免雙敗。\n失物：追之無益，方向不知，何以尋法，新置可也。","高祖治漢民\n諸侯既滅秦，惟項籍(項羽)最強，自立為西楚霸王，封高祖於漢。高祖與國民言曰：“父老苦秦苛法久矣，毀謗者族，偶語者棄市，民其何堪焉。今日者，吾當王關中，與父老約法三章：殺人者死，傷人及盜者抵罪。余悉除去。”民賴以安。"],["","春來雨水太連綿，入夏晴乾雨又愆，\n節氣直交三伏始，喜逢滂沛足田園。","","","","","","","","","",""],["中吉","一般器用與人同，巧斫輪輿梓匠工，\n凡事有緣且隨分，秋冬方遇主人翁。","遇貴人、訟得主、名尚遲、病未愈、婚未成、信尚阻、待秋冬、方有遇。","謀望且隨緣份，時運將至，福祿自來，切莫貪求，安分守己，待秋冬，方有遇。\n問訴訟，得理勝。\n問求財，較遲得。\n問疾病，宜禳解。\n問婚姻，有緣方成，無緣免談。\n問功名，主先難後易，不可妄動。","此簽言有才技。且須待時。如梓匠輪輿。雖能備物致用。不可急迫求售。必且聽諸自然。安分等待。久久或有投合之處。苟未及時。而妄圖躁進。豈有當乎。","器用所用。人世皆然。梓匠輪輿。乃制器用之工。巧斫。斫削精巧也。隨緣。是與時俯仰。隨分。是守己無求。主人翁。乃求梓匠輪輿之人。秋冬方遇。言遭際各 有其時。時至乃得成就也。占者近事應在秋冬。遠事應在晚景。總以隨分隨緣為上計而已矣。","平時所用的工具，和人是一樣的，製造器具的精巧工匠，雖然有著巧妙的手工，但沒有須要用到器具時，也只能默默地鑽研自己的手藝，只能隨遇而安，固守本分 ，無法強求，一直到秋冬季節，遇到了須要用這個器具的主人，才得以發揮工匠的手藝。此簽表示平時專注在手藝方面的鑽研，等待時機的到來，時間到了，就會遇到賞識工匠手 藝的主人出現。","機關謀望、人事雖同、隨緣隨分、心合蒼穹。秋冬時至、遇主人翁、藉此提攜、凡事皆通。","莫道惺惺勝別人、諸般由己不由人、安常守分藏吾技、待有遭逢愜主賓。","一生林姓，小試，占此，屢試未遇，值宗師金姓者始取。乃知林屬木，遇金成材，“梓匠”、“輪輿”，木之主人也。\n又(清)同治壬戍(1862年)，特恩並補辛酉(1861年)正科，副考官馬壽金。晉江林生鄉試前占此，亦取中。","運勢：事事小心，勤之必得，秋景得意，事仰儲蓄。\n家庭：人口漸旺，會合有期，用心合謀，團結力量。\n財利：求之必 到，資財自來，來之不易，勤而儉之。\n事業：凡謀百望，小心計之，乘心勿欺，百貨皆興。\n升遷：修德積善，調好吾身，時至花開，可結成實。\n姻緣：先苦後甘，天作之合，敬之如賓，必有好果。\n考試：多年辛勞，今可得償，惜之些禍，謹守可耶。\n健康：庚午逢貴，幸逢華陀，悉心調治，終獲 痊安。\n遠行：可行之時，貴人扶之，必有成耶，得利即回。\n訴訟：有訟即和，和之為貴，兩方退之，海闊天空。\n失物：失於北方，尚可尋覓， 耐心覓之，必可回手。","提結過長者門\n提結，梁武帝時西域高僧也。有侯長者者，家資鉅萬，一文不捨。提結到其門化緣，長者不見，令閽者語之曰：“爾自謂高僧，若能知我家中事，即肯布施。”提結將長者心事一一指出，長者受其點化而皈依焉。事載《蕭梁逸事》。"],["中吉","知君袖內有驪珠，生不逢辰亦強圖，\n可歎頭顱已如許，而今方得貴人扶。","財發遲、訟終析、名晚成、婚未決、問遠信、在此月、遇貴人、災難滅。","即使你很有才幹，但是時運未到，懷才不遇，不可強圖，應該藏器待時。一旦遇到貴人提挈，時來運轉，自然發達。\n切莫貪求，修心向善，自成福 助。","此簽名利晚成。凡事皆主遲得。如驪珠在手。似宜聲價十倍。然機緣未至。強圖奚益。必待頭顱老大之後。方得貴人扶持。所謀遂意。亨困遲速間。天實主之。豈可冀幸哉。","驪珠。驪龍之珠。袖裡有此。人所寶貴。逢辰。猶言遇時。或遇在辰字。不逢辰。時未至也。勉強貪圖。計亦左矣。頭顱如許。鬢髮星星之狀。貴人扶。是時辰晚之年。恰有勢力之人。為之推薦。名利才得遂意也。唯順以俟之而已。","明明知道你是個有實力的人，偏偏生不逢時，當機緣未到之時，勉強也是沒有用的，一直到兩鬢斑白之時，才得到貴人的賞識，所有的名利富貴，都必須在晚年才有所成。在年輕時必須多多充實自己的能力，也許必須度過漫長的蟄伏期，但總有出頭天的時候，不可懷憂喪志，晚成就總比一生沒有成就要來得好，必須順勢而為。","藏器待時、弄巧成拙、今當晚景、遇貴提攜。凡事謀望、各有時節、福祿勝前、自當發越。","富貴功名桃李花、誰知梅蕊發光華、莫嫌老鬢白如雪、盡有桑榆簇絳霞。","萬曆中，一士寓京師訓蒙，求終身，占此，了無所遇，年已六十。其門生侯拱宸，選中駙馬，延館於府，累積千金之富。乃知“辰”者，宸也。老年遭際，簽已明示之矣。\n又晉江李廷探應縣試，首場並招復，俱列第一名，望結正案榜首。求占此簽，不悟。及揭曉，一名系許篤因，三名為楊貴先，而李生取結第二。按楊生初名僚先，臨填榜時，官乃改僚為貴。後二句姓名位置均預為指示，其靈驗尤奇。","運勢：善取勿狡，貪取惹禍，勞之行之，必有成就。\n家庭：心存助人，家呈祥瑞，人人稱羨，必有成就。\n財利：不得急 也，急則反敗，時至自來，信之不渝。\n事業：目下不運，小心交友，人心險惡，否則瞭然。\n升遷：修身積善，為人根本，本固即安，小心處之。\n姻緣：此緣可成，假以時日，感之伊人，必能偕老。\n考試：蚤年不昌，愈老愈堅，終獲出頭，亦是顯也。\n健康：切速修善，向神作福，必有轉機，時至 必愈。\n遠行：行之不宜，目下不運，迨至夏末，見機行之。\n訴訟：凶人不近，伊人凶霸，明知遠之，不訟為妙。\n失物：丟之北方，速去尋之， 或之有望，警之惕之。","張遼，字文遠，雁門馬邑人也。本是聶壹（西漢武帝時商人，曾發動「馬邑之謀」，向匈奴進行誘敵戰，可惜失敗告終）之後人，為了避乖辟怨，遂改張姓。\n張遼少年時便已舉郡吏。漢季之期，并州刺史丁原以張遼武力過人，召其為從事，命張遼帶兵往赴京都。何進又遣張遼往河北募兵，共得千餘人。張遼募兵尚未還，而京中何進已因剿宦失敗而死，因此，張遼所領兵盡歸董卓所有。董卓死時，張遼統兵歸屬於呂布，遷任騎都尉（相當於騎兵隊長，地位略低於將軍）。\n後來，呂布為李傕所擊敗，張遼跟從呂布往東奔至徐州，領魯相、北地太守等任，時年二十八歲。又後來，曹操破呂布於下邳，張遼部領呂布軍餘眾歸降，被拜為中郎將，賜爵關內侯。一代名將張遼，至此方覓明主。"],["上吉","婚姻子息莫嫌遲，但把精神仗佛持，\n四十年前須報應，功圓行滿有馨兒。","名利訟、遲方吉、病漸瘥、婚姻實、中年後、得子息、問行人、未有日。","不必嫌婚姻子息來得遲，只要平正心事，則神佛必扶持保佑，在四十歲之前一定有因果的報應，善有善報，功德圓滿，自會生寧馨兒。","此簽諸事遲滯。賴有佛力暗持。皆由積累有素。早經感應。直待功行圓滿之後。自有穎秀佳兒。為之光大門戶，不過稍遲。必無爽報。人可不以存心陰騭為要哉。 占者合此則吉。否則急自修省可也。","婚姻子息。人生大事。不論遲早。終須成就。唯仗神佛扶持。凶可化吉。無而為有矣。四十年前。統計已往之事。須報應。尚有可望美報之處。濟人利物謂之功。 省身修德謂之行。圓則功已廣博。滿則行己周到也。馨兒。寧馨不凡之兒。神佛之賜。積德之報也。人事回天如此。可不勉乎。","結婚生子乃是人生大事，在這方面會比較晚成，但還是會有結果，不要抱怨，可以把精神寄托在神明，從事善行，則可招來吉運，現在的報應是累積了前四十年的 因果，也就是現在的禍福是自己過去善惡的結果，由於過去一直行善，所以在功德圓滿之時，能喜獲麟兒，凡事不可強求，一切都是自己所累積的結果。","謀望雖遲、終有所遇、福神相佑、扶持門戶。中年運泰、事宜進取、凡百稱心、鹹無憂慮。","莫言來速與來遲、天道分明且待時、積德到頭終有報、成功何處不相宜。","一人苦淫雨，入廟問晴，占此，不知所解。及霽，乃值滿日也。且馨字下有一日字，此其所以待滿而日出也。\n又(清)光緒九年(1883年)，晉江郭生年四十，元旦到廟祈禱財氣科名，占得此，無所應。至冬間乃舉一子，其生辰與該生同日月。此三、四句簽語之驗也。\n又惠安縣有一武生將應試，占此。後縣榜取結第十名，府榜取結二十六名。迨宗師按臨，則取第四名。至拜客諸酒完後，復生一子。亦三、四兩句之應也。按：四十年前之“年”與“連”字同音。","運勢：利涉大川，行善之人，財星明現，四季得意。\n家庭：修身之人，行善必昌，家和皆成，春色盈門。\n財利：財氣十足，殷勤交關，經營四方，家業大興。\n事業：經營得當，利路大開，滿載而歸，可成家業。\n升遷：天時予之，君百事宜，平素養身，自有吉利。\n姻緣：卜雲其昌，天作之合，配匹自然，百年偕老。\n考試：積善慶余，加之力行，科甲聯登，得來不易。\n健康：臨險不險，作善之人，不必懼憂，服藥即痊。\n遠行：出門遇貴，到處受遇，無往不利，得利即回。\n訴訟：雖是強者，恕人天視，速和為妙，必有後裕。\n失物：未必尋之，自可回手，修德之果，自吾警暢。","山濤見王衍\n晉•山濤，字巨源，河內懷人，器量不群，小與阮藉為竹林友。武帝朝為吏部尚書，薦拔人物。王衍少時，山濤見之曰：“何物老嫗生此寧馨兒。然誤天下蒼生者，必此子也。”衍字夷甫，晉陽人，神姿高徹，如瑤林瓊樹，官至司徒，後為石勒所害。"],["上上","五十功名心已灰，那知富貴逼人來，\n更行好事存方寸，壽比岡陵位鼎台。","訟即解、名可成、財漸聚、病且寧、孕生子、婚姻平、行人至、事稱情。","人到五十歲，對功名的心本來已淡，那知道時運一到，富貴逼人而來。只要你能夠存心行善，相信你的壽命會長，你的地位更高。\n大吉利，問婚姻 可成。財運亨通，疾病安康，懷孕生男，功名雖遲必貴。多行好。","此簽功名晚成。應在五十以外。少壯時有志不遂。衰遲後無意得來。此乃天數所定。然不可因此自足。須更力加培植。事事積德。處處存心。古稱現在之福。如點燈。漸點漸消。積來之福如添油。越添越盛。由是增壽加祿。後福未艾。雖晚遇更勝少壯也。聖言不虛。信之寶之。","五十。年力將衰之候。功名心灰。無志進取也。富貴逼人。好景在即。更行好事。言積德以迓天庥。存方寸。言修必以邀神佑。壽比崗陵。言增紀益算。有似崗陵之固。鼎。指鼎柱。台。指三台。系宰相三公之貴。均唯積善有以致之。雖曰天命。豈非由人命事哉。","過了五十歲之後，對於功名利祿已經快要灰心了，怎么會知道遲來的富貴接著而來，盛況在前，必須更行善積福，將隨時心存善念，則壽命會更加延長，地位也會更加崇高。此簽表示一切功名皆晚成，在中年之後富貴將不請自來，將善行存於心中，是保有富貴的最佳方式，此後將一切順遂如意。","功名志退、一豆逢時、逼人富貴、皆善所基。便行好事、相與扶持、壽高貴顯、大勝前時。","萬事天公作主張、漫嫌鬢髮已蒼蒼、只須陰騭回天意、科第登雲壽更長。","一生占科舉，不中而歸，時四十有九。明年病亡。應第一句。\n又一人年五十，占功名得此，是年顯榮。應詩第二句。\n占者，須以天時之吉凶消長，人事之返退存亡，合而推之。功名必本身年五十之外者方佳，否則不利。","運勢：立德修身，正逢佳運，到處受遇，財利通達。\n家庭：專心致志，門第光輝，福澤臨門，大吉之歲。\n財利：平素積 善，財星明顯，求之易得，必有餘裕。\n事業：公道交易，駿業鴻展，利市三倍，宜惜福也。\n升遷：積善受福，十全為上，唯常留意，必有成也。\n姻緣：姻緣天賜，帶結同心，內助得意，百年奸合。\n考試：天相吉人，積善之家，功成名就，祿位崇高。\n健康：陽光普照，積善餘慶，藥到病除，災厄 盡去。\n遠行：前途異香，滿路貴人，忠直自持，財源大旺。\n訴訟：和平之人，天理在胸，捫心無愧，必能昭雪。\n失物：失之一時，常作善事， 一無所失，定可回手。","買臣五十富貴\n漢•朱買臣，會稽人。家貧，賣薪自給，行歌誦書，妻羞之，求去。買臣曰：“吾年五十當富貴，即時自可報汝。”妻不聽，適田夫。後買臣果五十為會稽太守，妻與田夫治道迎官。買臣駐車呼之，以車載其夫婦，舍園中，給食一月。妻慚自縊，與夫錢以葬之。\n朱買臣分妻(馬前覆水)(覆水難收)\n漢朝名臣姓朱名買臣，表字翁子，會稽郡人氏。家貧未遇，夫妻二口住於陋巷蓬門，砍柴賣錢度日。賣柴憑人估值，不爭價錢。其妻出門汲水，見群兒嬉笑買臣，深以為恥，其妻後去。五十歲時，漢武帝求賢，拜為會稽太守。其妻自悔有眼無珠，願降為婢妾，伏事終身。買臣命取水一桶，潑於階下，曰：“若水可收，則可複合。”念結髮之情，判後園隙地與妻及其夫耕種自食，其妻遂投河而死。"],["中吉","經營百出費精神，南北奔馳運未新，\n玉兔交時當得意，恰如枯木再逢春。","名利有、晚方成、訟與病、久方平、孕生子、行阻程、遇卯運、事皆亨。","先凶後吉，凡事逢春則吉，遇到卯年月日，百事漸亨，方可營計。若貪求，徒勞心力，求名晚成，訟可解，婚宜審。行人有阻，謀望皆要平心和氣，方 免是非。","此簽先凶後吉。凡事逢春則遂。遇卯年月日。漸見生機。不可急遽貪求。枉費心力。無益於事。何如惜養精神，以待水到渠成之妙。非所謂相時而動。動罔不藏者 乎。","前費精神百為蹭蹬。運途乖舛。奔走徒勞。後望更新。卯年月日。爾時得意。化雨春風。吹枯噓生。一般發育。晚景條暢。差慰平生。時之未來。登天無路。時之 既至。順水放舟。當且寬裕優遊以待之。","耗費精神在經營事業上，總是毫無頭緒，即使辛勤地南北奔波，也是無濟於事，必須等到卯年月日，才得以轉機，此時才能漸漸順遂，猶如乾枯的樹木，每到春天 的時候，依然能發出新芽，猶如重生。此簽表示必須經過一番辛勤的努力及失望，直到適當的時機，才得以揚眉吐氣，時機未到，做任何的努力都是無濟於事，時機到了，有水到 渠成之勢，晚景運勢亨通。","營謀艱力、見逢時否、奔北趨南、百事未遂。卯年月日、方可營計、轉悴為榮、節節生意。","前路蹉跎幾嘆嗟、勞勞心跡鏡中花、一番春色覘天意、年運亨通卯最佳。","一生自南庠改北鹽，屢試不第。占此，自謂卯科當中京，不驗。後值酉年始領鄉庥。乃悟兩座師一房，俱是卯年所生，所謂“玉兔交”也。\n又一人有兒子，(清)光緒庚寅春月患痘頗驗。事完後，再到廟請示疹期，以便預防，占此，果於辛卯年二月出疹。是“玉兔交時當得”與“再逢春”數字之應也。","運勢：運正轉機，漸入佳境，財源恆進，即為福報。\n家庭：內外皆吉，春色盈門，老少鹹宜，必多佳慶。\n財利：利路漸開，小心開路，求之即現，利涉大川。\n事業：勤之勞之，貿易方正，利源大開，正入佳境。\n升遷：六積陰隱，積德榮宗，身心俱健，必能有之。\n姻緣：魚水和合，此緣可配，天作之合，財氣正旺。\n考試：多年辛勞，方向有誤，雜務纏身，終得成功。\n健康：逢春化吉，平素調養，求神作福，災退病除。\n遠行：存心忠厚，可遇貴人，小心對之，名利雙收。\n訴訟：照天理行，必能理也，小心戒之，必可勝也。\n失物：失於陽方，耐心尋之，必能回手，未必擔心。","薛仁貴投軍\n唐•薛禮，字仁貴，龍門人。應募投軍，征遼，白衣陷陣，立奇功。太宗曰：“朕不喜得遼東，喜得將軍。”累官左武衛將軍，封河南縣男。嘗拒突厥於天山。發三箭射殺三人，突厥懼遁。軍中歌曰：“將軍三箭定天山，壯士長歌入漢關。”"],["上上","貴人遭遇水雲鄉，冷淡交情滋味長，\n黃閣開時延故客，驊騮應時驟康莊。","名與財、皆得意、家道康、婚吉利、病即安、孕生貴、訟則伸、行人至。","早遇貴人提拔，並將獲得貴人提拔，踏上成功之路。\n上吉，家宅安穩風水利，名與利皆快，婚姻成，行人至，病安全，孕生子，保平安，凡事皆吉 利。","此簽主交友言。由疏而密。由淡而濃之象。始時貧賤相交。跡似淡漠。一旦朋友得志。貴極人臣。大有開閣相延之慶。況以車笠舊好。自無不勤加拂拭。有不如驊 騮之開道路者乎。凡事先平而後奇。先名而後實。先艱阻而後順利。大得貴人之力。","水雲鄉。貴賤遨遊之地。貴人。指異日顯達之人。此時實不知也。是以貧賤相交。光景甚屬冷淡。然交情投契。卻有滋味可尋。與勢利中翻雲覆雨者不同。黃閣。 指丞相公廨。漢公孫宏有開閣延賓故事。此藉比朋友得志時所為。言藉彼提攜。當如驊騮絕足。直上康莊大路。可軼塵而奔矣。驊騮。或作午年月日。及午方。及午命。微驗亦可 。","在他鄉異地所認識的朋友，不知他未來會是皇宮貴族，當時均是兩袖清風之人，所以交情完全在於人品，反而能交到知心好友，他日成為高官祿爵，必能順手提攜 ，成為共享富貴的朋友。此簽表示在窮困潦倒時，才能感到其真心，交情不因身份的而有所不同，才是真正的好友，表示得到朋友的提挈而飛黃騰達。","憶昔貴人、忽見邂逅、從此提攜、命運亨泰。出入圖謀、凡事利快、士庶占之、前程遠大。","結交道義勝黃金、黃金不及至人心、王陽貢禹當年事、相慶彈冠待好音。","一人選時占此，後得武進，乃東南水澤之國，自甘冷淡，冀得久任。\n又一人登科，占此久不第，直至座師拜相作總裁時始第。應第三、四句。\n又一人習賈，有才，扶不得，主料其必敗。占此，欲應海口世好蘇氏聘，不果，乃為鳳閣街黃姓當事。將周歲，甫開市，而蘇氏以厚利爭向，遂於通衢建一大生意。歷二十年，號已馳名，其人始卒。此占連題義畢應。善解者，毋煩多贅焉。","運勢：福星高懸，富如石崇，源源而來，名利雙全。\n家庭：家門順境，財子雙全，時運已至，家聲大振。\n財利：財源亨通，垂手可得，積善之賜，珍惜則順。\n事業：公平交易，十足利益，四方得利，大道生財。\n升遷：積德之人，慶有餘也，莫輕心耶，珍惜可也。\n姻緣：兩美相配，恭禧團圓，琴瑟和鳴，百年偕老。\n考試：天生富貴，一舉成名，圖名遂心，財旺升官。\n健康：修德永安，有疾無妨，名醫調治，無藥 自愈。\n遠行：正逢此時，去之可也，揚帆風順，得利即回。\n訴訟：無犯官符，根本無妨，小心小人，戒之切之。\n失物：不必尋之，自可回手， 防再失也，自吾警惕。","百里奚投秦\n百里奚，宛人。初事虞公，晉假途滅虢，知其將亡，不諫而先去。之秦，復為執，逃隱於楚。秦穆公聞其賢，以五羊皮向楚贖回，授以國政。秦自強盛，並國二十，遂霸西戎。國人稱奚為五羖大夫。"],["上上","我本天仙雷雨師，吉凶禍福我先知，\n至誠禱祝皆靈應，抽得終簽百事宜。","籤詩百、數已終、我所知、象無凶、禱神扶、藉陰騭、危處安、損中益。","求謀無不遂意，前進後達，百事如意。求者凡事皆吉。富貴之人，當持盈守滿，則無傾溢之咎。\n問疾病，少壯者吉，老年則凶，有壽終之兆。\n問婚姻，有百年偕老之吉。","此簽已成功而終。前數之終。後數之始也。聚前數之終。則有豐亨豫大之象。藏後數之始。則有引伸不窮之意。是以百事皆宜。根深實茂。永遠完成。然必至誠無 偽。積善感通。方得受命如響之應。唯厚所以集福之本而已矣。","天仙。大羅金仙超出眾仙之上。雷雨師。掌雷霆雨澤之神。帝自言神在天上也。吉凶禍福。人不知。而神知之。他神不知。而帝必先知之。體物不遺之謂靈。感而 遂通之謂應。互誠禱告。言無偽無妄之求。必得靈應也。終簽數之成。是以百事皆宜。奉聖教者共勉之。","天仙是眾仙之上的神明，而雷雨師是掌管雨水的多寡，也是世間凡人耕作收成的重要天神，吉凶禍福凡人不可得知，而我必定知曉，至誠至信的祈禱，只要不貪心 或存有害人之心，願望必能得到實現。抽中此簽為簽之終，而百簽也有圓滿的意思，凡事皆能順遂，必有所成。百是圓滿的終點，也是起點，天地萬物自有循環。","吉凶禍福、神先知之、更修陰騭、神必佑之。凡百謀為、有進無止、數雖已終、周而復始。","吉凶禍福自天公、經緯分明處處通、好竭忠優敦善道、慈悲佑啟福無窮。","隆慶中，嘉善丁改亭先生會試占此，中是榜第三百名進士，官至尚書，亨壽百齡。大壽者，吉祥之兆也。","運勢：平素積極，時運屆至，大發其利，珍惜此福。\n家庭：行善為念，人人仰之，修身足者，舉家豫順。\n財利：辛苦經營，殷勤待人，勞心必裕，後有大利。\n事業：公道交易，萬商雲集，財氣十足，駿業宏展。\n升遷：當行善舉，心誠求之，心誠意敬，必有所賜。\n姻緣：平素行善，神靈加護，卜之其昌，琴瑟和鳴。\n考試：吉人天相，動心用功，自有神助，心顯成功。\n健康：目下缺安，善自調養，百疾皆除，嗣後小心。\n遠行：出之可也，出門有利，到處皆春，財源大通。\n訴訟：路途雖險，心卻平和，化凶為吉，慎防小人。\n失物：失於陽方，及時尋之，不久即回，修身之賜。","唐明宗禱告天\n唐明宗，沙陀國人，後五代•唐•李克用之養子。登極之時，年踰六十，每夕在於宮中焚香祝天曰：“某本胡人，因亂為眾所推，願天早生聖人，為生民主事。”見《十國世家》。"]];
const YJ=[["元，亨，利，貞。",["潛龍，勿用。","見龍在田，利見大人。","君子終日乾乾，夕惕若厲，無咎。","或躍在淵，無咎。","飛龍在天，利見大人。","亢龍，有悔。"],"見群龍無首，吉。","大哉乾元，萬物資始，乃統天。雲行雨施，品物流形。大明終始，六位時成。時乘六龍以御天。乾道變化，各正性命。保合大和，乃利貞。首出庶物，萬國威寧。","天行健，君子以自強不息。",["“潛龍勿用”,陽在下也。","“見龍在田”,德施普也。","“終日乾乾”,反覆道也。","“或躍在淵”,進無咎也。","“飛龍在天”,大人造也。","“亢龍有悔”,盈不可久也。"]],["元亨。利牝馬之貞。君子有攸往，先迷，後得主，利。西南得朋，東北喪朋。安貞吉。",["履霜，堅冰至。","直、方、大，不習，無不利。","含章，可貞，或從王事，無成有終。","括囊，無咎無譽。","黃裳，元吉。","龍戰於野，其血玄黃。"],"利永貞。","至哉坤元，萬物資生，乃順承天。坤厚載物，德合無疆。含弘光大，品物咸亨。牝馬地類，行地無疆，柔順利貞。君子。君子攸行，先迷失道，後順得常。西南得朋，乃與類行。東北喪朋，乃終有慶。安貞之吉，應地無疆。","地勢坤。君子以厚德載物。",["“履霜堅冰”,陰始凝也，馴致其道，至堅冰也。","六二之動，直以方也。“不習無不利”,地道光也。","“含章可貞”,以時發也。“或從王事”,知光大也。","“括囊無咎”,慎不害也。","“黃裳元吉”,文在中也。","“龍戰於野”,其道窮也。"]],["元亨，利貞。勿用有攸往。利建侯。",["磐桓，利居貞。利建侯。","屯如邅如，乘馬班如。匪寇，婚媾。女子貞不字，十年乃字。","即鹿無虞，惟入於林中，君子幾不如舍，往吝。","乘馬班如，求婚媾。往吉，無不利。","屯其膏，小，貞吉；大，貞兇。","乘馬班如，泣血漣如。"],"","屯，剛柔始交而難生。動乎險中，大亨貞。雷雨之動滿盈，天造草昧。宜尋建侯而不寧。","雲雷，屯。君子以經綸。",["雖磐桓，志行正也。以貴下賤，大得民也。","六二之難，乘剛也。十年乃字，反常也。","“即鹿無虞”,以從禽也。君子舍之，往吝窮也。","求而往，明也。","“屯其膏”,施未光也。","“泣血漣如”,何可長也。"]],["亨。匪我求童蒙，童蒙求我。初筮告，再三瀆，瀆則不告。利貞。",["發矇，利用刑人，用說桎梏，以往吝。","包蒙，吉。納婦，吉。子克家。","勿用取女，見金夫，不有躬。無攸利。","困蒙，吝。","童蒙，吉。","擊蒙，不利為寇，利禦寇。"],"","蒙，山下有險，險而止，蒙。“蒙亨”,以亨行，時中也。“匪我求童蒙，童蒙求我”.志應也。“初筮告”,以剛中也。“再三瀆，瀆則不告”,瀆蒙也。蒙以養正，聖功也。","山下出泉，蒙。君子以果行育德。",["“利用刑人”,以正法也。","“子克家”,剛柔節也。","“勿用取女”,行不順也。","“困蒙之吝”,獨遠實也。","“童蒙”之“吉”,順以巽也。","“利”用“禦寇”,上下順也。"]],["有孚，光亨。貞吉，利涉大川。",["需於郊，利用恆，無咎。","需於沙，小有言，終吉。","需於泥，致寇至。","需於血，出自穴。","需於酒食，貞吉。","入於穴，有不速之客三人來，敬之終吉。"],"","“需”,須也。險在前也，剛健而不陷，其義不困窮矣。“需，有孚，光亨，貞吉”,位乎天位，以正中也。“利涉大川”,往有功也。","雲上於天，需。君子以飲食宴樂。",["“需於郊”,不犯 難行也。“利用恆無咎”,未失常也。","“需於沙”,衍在中也。雖小有言，以終吉也。","“需於泥”,災在外也。自我致寇，敬慎不敗也。","“需於血，”順以聽也。","“酒食貞吉”,以中正也。","“不速之客來，敬之終吉”,雖不當位，未大失也。"]],["有孚窒惕，中吉，終兇。利見大人。不利涉大川。",["不永所事，小有言，終吉。","不克訟，歸而逋。其邑人三百戶，無眚。","食舊德，貞厲，終吉。或從王事，無成。","不克訟，復既命渝。安貞吉。","訟，元吉。","或錫之鞶帶，終朝三褫之。"],"","訟，上剛下險，險而健，訟。“訟有孚窒惕，中吉”,剛來而得中也。“終兇”,訟不可成也。“利見大人”,尚中正也。“不利涉大川”,入於淵也。","天與水違行，訟。君子以作事謀始。",["“不永所事”,訟不可長也。雖“小有言”,其辯明也。","“不克訟”,歸逋竄也。自下訟上，患至掇也。","食舊德，從上吉也。","復即命渝，安貞不失也。","“訟，元吉”以中正也。","以訟受服，亦不足敬也。"]],["貞丈人吉，無咎。",["師出以律，否臧兇。","在師中吉，無咎，王三錫命。","師或輿尸，兇。","師左次，無咎。","田有禽。利執言，無咎。長子帥師，弟子輿尸，貞兇。","大君有命，開國承家，小人勿用。"],"","師，眾也。貞，正也。能以眾正，可以王矣。剛中而應，行險而順，以此毒天下，而民從之，吉又何咎矣。","地中有水，師。君子以容民畜眾。",["“師出以律，”失律兇也。","“在師中吉”,承天寵也。“王三錫命”,懷萬邦也。","“師或輿尸”,大無功也。","“左次無咎”,未失常也。","“長子帥師”,以中行也。“弟子輿尸”,使不當也。","“大君有命”,以正功也。“小人勿用”,必亂邦也。"]],["吉。原筮，元，永貞，無咎。不寧方來，後夫兇。",["有孚比之，無咎。有孚盈缶，終來有它，吉。","比之自內，貞吉。","比之匪人。","外比之，貞吉。","顯比，王用三驅，失前禽，邑人不誡，吉。","比之無首，兇。"],"","比，吉也；比，輔也，下順從也。“原筮，元永貞，無咎”,以剛中也。“不寧方來”,上下應也。“後夫兇”,其道窮也。","地上有水，比。先王以建萬國，親諸侯。",["比之初六，有它吉也。","“比之自內”,不自失也。","比之匪人“,不亦傷乎？","外比於賢，以從上也。","”顯比“之吉，位正中也。舍逆取順，失前禽也。邑人不誡，上使中也。","”比之無首“,無所終也。"]],["亨。密雲不雨。自我西郊。",["”復自道，何其咎？吉。","牽復，吉。","輿說輻。夫妻反目。","有孚，血去，惕出無咎。","有孚攣如，富以其鄰。","既雨既處，尚德載。婦貞厲。月幾望，君子徵兇。"],"","”小畜“,柔得位而上下應之，曰小畜。健而巽，剛中而志行，乃亨。”密雲不雨“,尚往也。”自我西郊“,施未行也。","風行天上，”小畜“.君子以懿文德。",["“復自道”,其義“吉”也。","牽復在中，亦不自失也。","“夫妻反目”,不能正室也。","“有孚惕出”,上合志也。","“有孚攣如”,不獨富也。","“既雨既處”,德積載也。“君子徵兇”,有所疑也。"]],["履虎尾，不咥人。亨。",["素履往，無咎。","履道坦坦，幽人貞吉。","眇能視，跛能履，履虎尾，咥人，兇。武人為於大君。","履虎尾，愬愬，終吉。","夬履，貞厲。","視履考祥，其旋元吉。"],"","“履”,柔履剛也。說而應乎乾，是以“履虎尾，不咥人”.亨，剛中正，履帝位而不疚，光明也。","上天下澤，“履”.君子以辨上下，定民志。",["“素履之往”,獨行願也。","“幽人貞吉”,中不自亂也。","“眇能視”,不足以有明也。“跛能履”,不足以與行也。“咥人之兇”,位不當也。“武人為於大君”,志剛也。","“愬愬終吉”.志行也。","“夬履貞厲”,位正當也。","元吉在上，大有慶也。"]],["小往大來，吉，亨。",["拔茅茹，以其匯。徵吉。","包荒，用馮河，不遐遺。朋亡，得尚於中行。","無平不陂，無往不復。艱貞無咎。勿恤其孚，於食有福。","翩翩，不富以其鄰，不戒以孚。","帝乙歸妹，以祉元吉。","城復於隍，勿用師，自邑告命。貞吝。"],"","“泰，小往大來。吉，亨。”則是天地交而萬物通也，上下交而其志同也。內陽而外陰，內健而外順，內君子而外小人，君子道長，小人道消也。","天地交，泰。後以財成天地之道，輔相天地之宜，以左右民。",["“拔茅徵吉”,志在外也。","“包荒，得尚於中行”,以光大也。","“無往不復”,天地際也。","“翩翩，不富”,皆失實也。“不戒以孚”,中心願也。","“以祉元吉”,中以行願也。","“城復於隍”,其命亂也。"]],["否之匪人，不利君子貞，大往小來。",["拔茅茹以其匯。貞吉，亨。","包承，小人吉，大人否。亨。","包羞。","有命，無咎，疇離祉。","休否，大人吉。其亡其亡，繫於苞桑。","傾否，先否後喜。"],"","“否之匪人，不利君子貞，大往小來。”則是天地不交而萬物不通也，上下不交而天下無邦也；內陰而外陽，內柔而外剛，內小人而外君子，小人道長，君子道消也。","天地不交，“否”.君子以儉德闢難，不可榮以祿。",["“拔茅貞吉”,志在君也。","“大人否亨”,不亂群也。","“包羞”,位不當也。","“有命無咎”,志行也。","大人之吉，位正當也。","否終則傾，何可長也。"]],["同人於野，亨。利涉大川。利君子貞。",["同人於門，無咎。","同人於宗，吝。","伏戎於莽，升其高陵，三歲不興。","乘其墉，弗克攻，吉<象>曰：“乘其墉”,義弗克也。其“吉”,則困而反則也。","同人先號咷而後笑，大師克，相遇。","同人於郊，無悔。"],"","“同人”,柔得位得中，而應乎乾，曰同人。同人曰：“同人於野，亨。利涉大川”,乾行也。文明以健，中正而應，君子正也。唯君子為能通天下之志。","天與火，同人。君子以類族辨物。",["“出門同人”,又誰咎也。","“同人於宗”,吝道也。","“伏戎於莽”,敵剛也。“三歲不興”,安行也。","","同人之先，以中直也。大師相遇，言相剋也。","“同人於郊”,志未得也。"]],["元亨。",["無交害匪咎。艱則無咎。","大車以載，有攸往，無咎。","公用亨於天子，小人弗克。","匪其彭，無咎。","厥孚交如威如，吉。","自天佑之，吉，無不利。"],"","“大有”,柔得尊位大中，而上下應之，曰“大有”.其德剛健而文明，應乎天而時行，是以元亨。","火在天上，“大有”.君子以遏惡揚善，順天休命。",["大有初九，無交害也。","“大車以載”,積中不敗也。","公用亨於天子，小人害也。","“匪其彭，無咎。”明辨晢也。","“厥孚交如”,信以發志也。“威如之吉”,易而無備也。","大有上吉，自天佑也。"]],["亨。君子有終。",["謙謙君子，用涉大川，吉。","鳴謙，貞吉。","勞謙君子，有終，吉。","無不利，捴謙。","不富以其鄰，利用侵伐，無不利。","鳴謙，利用行師徵邑國。"],"","謙，亨。天道下濟而光明，地道卑而上行。天道虧盈而益謙，地道變盈而流謙，鬼神害盈而福謙，人道惡盈而好謙。謙，尊而光，卑而不可逾，君子之終也。","地中有山，謙。君子以裒多益寡，稱物平施。",["“謙謙君子”,卑以自牧也。","“鳴謙貞吉”,中心得也。","“勞謙君子”,萬民服也。","“無不利，捴謙”,不違則也。","“利用侵伐”,徵不服也。","“鳴謙”,志未得也。“可用行師”,徵邑國也。"]],["利建侯行師。",["鳴豫，兇。","介於石，不終日，貞吉。","盱豫，悔，遲有悔。","由豫，大有得，勿疑。朋盍簪。","貞疾，恆不死。","冥豫，成有渝。無咎。"],"","豫，剛應而志行，順以動，豫。豫順以動，故天地如之，而況建侯行師乎？天地以順動，故日月不過，而四時不忒。聖人以順動，則刑罰清而民服，豫之時義大矣哉！","雷出地奮，豫。先王以作樂崇德，殷薦之上帝，以配祖考。",["“初六鳴豫”,志窮兇也。","“不終日貞吉”,以中正也。","“盱豫不悔”,位不當也。","“由豫大有得”,志大行也。","“六五貞疾”,乘剛也。“恆不死”,中未亡也。","“冥豫”在上，何可長也？"]],["元亨，利貞，無咎。",["官有渝，貞吉，出門交有功。","系小子，失丈夫。","系丈夫，失小子，隨有求，得。利居貞。","隨有獲，貞兇。有孚在道，以明，何咎？","孚於嘉，吉。","拘繫之，乃從維之，王用亨於西山。"],"","隨，剛來而下柔，動而說，隨。大亨貞無咎，而天下隨時，隨時之義大矣哉！","澤中有雷，隨。君子以嚮晦入宴息。",["“官有渝”,從正吉也。“出門交有功”,不失也。","“系小子”,弗兼與也。","“系丈夫”,志舍下也。","“隨有獲”,其義兇也。“有孚在道”,明功也。","“孚於嘉吉”,位正中也。","“拘繫之”,上窮也。"]],["元亨。利涉大川，先甲三日，後甲三日。",["幹父之蠱，有子，考無咎。厲，終吉。","幹母之蠱，不可貞。","幹父之蠱，小有悔，無大咎。","裕父之蠱，往見吝。","幹父之蠱，用譽。","不事王侯，高尚其事。"],"","蠱，剛上而柔下，巽而止，蠱。蠱，元亨而天下治也。“利涉大川”,往有事也。“先甲三日，後甲三日”,終則有始，天行也。","山下有風，蠱。君子以振民育德。",["“幹父之蠱”,意承考也。","“幹母之蠱”,得中道也。","“幹父之蠱”,終無咎也。","“裕父之蠱”,往未得也。","“幹父用譽”,承以德也。","“不事王侯”,志可則也。"]],["元亨，利貞。至於八月有兇。",["鹹臨，貞吉。","鹹臨，吉，無不利。","甘臨，無攸利；既憂之，無咎。","至臨，無咎。","知臨，大君之宜，吉。","敦臨，吉，無咎。"],"","臨，剛浸而長，說而順，剛中而應。大亨以正，天之道也。“至於八月有兇”,消不久也。","澤上有地，臨。君子以教思無窮，容保民無疆。",["“鹹臨貞吉”,志行正也。","“鹹臨吉無不利”,未順命也。","“甘臨”,位不當也。“既憂之”.咎不長也。","“至臨無咎”,位當也。","“大君之宜”,行中之謂也。","“敦臨之吉”,志在內也。"]],["盥而不薦。有孚顒若。",["童觀，小人無咎，君子吝。","窺觀，利女貞。","觀我生，進退。","觀國之光，利用賓於王。","觀我生，君子無咎。","觀其生，君子無咎。"],"","大觀在上，順而巽，中正以觀天下，觀。“盥而不薦，有孚顒若”,下觀而化也。觀天之神道，而四時不忒，聖人以神道設教，而天下服矣。","風行地上，觀。先王以省方觀民設教。",["“初六童觀”,“小人”道也。","“窺觀女貞”,亦可醜也。","“觀我生進退”,未失道也。","“觀國之光”,尚賓也。","“觀我生”,觀民也。","“觀其生”,志未平也。"]],["亨。利用獄。",["屨校滅趾，無咎。","噬膚滅鼻，無咎。","噬臘肉遇毒，小吝，無咎。","“噬幹胏，得金矢。利艱貞，吉。","噬乾肉得黃金。貞厲，無咎。","何校滅耳，兇。"],"","頤中有物曰噬嗑。噬嗑而亨，剛柔分，動而明，雷電合而章。柔得中而上行，雖不當位，利用獄也。","雷電，噬嗑。先王以明罰敕法。",["“屨校滅趾”,不行也。","“噬膚滅鼻”,乘剛也。","“遇毒”,位不當也。","”利艱貞吉“,未光也。","”貞厲無咎“,得當也。","”何校滅耳“,聰不明也。"]],["亨。小利有攸往。",["賁其趾，舍車而徒。","賁其須。","賁如，濡如，永貞吉。","賁如皤如，白馬翰如。匪寇，婚媾。","賁於丘園，束帛戔戔，吝，終吉。","白賁，無咎。"],"","賁亨，柔來而文剛，故亨。分，剛上而文柔，故小利有攸往。剛柔交錯，天文也。文明以止，人文也。觀乎天文，以察時變；觀乎人文，以化成天下。","山下有火，賁。君子以明庶政，無敢折獄。",["”舍車而徒“,義弗乘也。","”賁其須“,與上興也。","”永貞之吉“,終莫之陵也。","六四，當位疑也。”匪寇婚媾“,終無尤也。","”六五之吉“,有喜也。","”白賁無咎“,上得志也。"]],["不利有攸往。",["剝床以足，蔑貞兇。","剝床以辨，蔑貞兇。","剝之，無咎。","剝床以膚，兇。","貫魚以宮人寵，無不利。","碩果不食，君子得輿，小人剝廬。"],"","剝，剝也。柔變剛也。”不利有攸往“,小人長也。順而止之，觀象也。君子尚消息盈虛，天行也。","出附於地，剝。上以厚下安宅。",["”剝床以足“,以滅下也。","”剝床以辨“,未有與也。","”剝之無咎“,失上下也。","”剝床以膚“,切近災也。","”以宮人寵“,終無尤也。","”君子得輿“,民所載也。”小人剝廬“,終不可用也。"]],["亨。出入無疾。朋來無咎。反覆其道，七日來復，利有攸往。",["不遠復，無祗悔，元吉。","休復，吉。","頻復，厲，無咎。","中行獨復。","敦復，無悔。","迷復，兇，有災眚。用行師，終有大敗，以其國君兇，至於十年不克徵。"],"","”復，亨“.剛反，動而以順行。是以”出入無疾，朋來無咎“.”反覆其道，七日來復“,天行也。”利有攸往“,剛長也。復，其見天地之心乎。","雷在地中，復。先王以至日閉關，商旅不行，後不省方。",["”不遠之復“,以修身也。","”休復之吉“,以下仁也。","”頻復之厲“,義無咎也。","”中行獨復“,以從道也。","”敦復無悔“,中以自考也。","”迷復之兇“,反君道也。"]],["元亨，利貞。其匪正有眚，不利有攸往。",["無妄往，吉。","不耕穫，不菑畲，則利用攸往。","無妄之災，或繫之牛，行人之得，邑人之災。","可貞。無咎。","無妄之疾，勿藥有喜。","無妄行，有眚，無攸利。"],"","無妄，剛自外來而為主於內，動而健，剛中而應。大亨以正，天之命也。”其匪正有眚，不利有攸往“,無妄之往何之矣？天命不佑，行矣哉！","天下雷行，物與無妄。先王以茂對時育萬物。",["”無妄之往“,得志也。","”不耕穫“,未富也。","行人得牛，邑人災也。","”可貞無咎“,固有之也。","”無妄之藥“,不可試也。","”無妄之行“,窮之災也。"]],["利貞。不家食吉。利涉大川。",["有厲，利已。","輿說輹。","良馬逐，利艱貞，曰閒輿衛，利有攸往。","童牛之牿，元吉。","豶豕之牙，吉。","何天之衢，亨。"],"","大畜，剛健篤實，輝光日新。其德剛上而尚賢，能止健，大正也。”不家食吉“,養賢也。”利涉大川“,應乎天也。","天在山中，大畜。君子以多識前言往行，以畜其德。",["”有厲利已“,不犯 災也。","”輿說輹“,中無尤也。","”利有攸往“,上合志也。","”六四元吉“,有喜也。","”六五之吉“,有慶也。","”何天之衢“,道大行也。"]],["貞吉。觀頤，自求口實。",["舍爾靈龜，觀我朵頤，兇。","顛頤拂經於丘頤，徵兇。","拂頤，貞兇，十年勿用，無攸利。","顛頤，吉。虎視眈眈，其欲逐逐，無咎。","拂經，居貞吉，不可涉大川。","由頤，厲，吉。利涉大川。"],"","頤，貞吉，養正則吉也。觀頤，觀其所養也。自求口實，觀其自養也。天地養萬物，聖人養賢以及萬民，頤之時大矣哉！","山下有雷，頤。君子以慎言語，節飲食。",["”觀我朵頤“,亦不足貴也。","”六二徵兇“,行失類也。","”十年勿用“,道大悖也。","”顛頤之吉“,上施光也。","”居貞之吉“,順以從上也。","”由頤厲吉“,大有慶也。"]],["棟撓，利有攸往，亨。",["藉用白茅，無咎。","枯楊生稊，老夫得其女妻，無不利。","棟橈，兇。","棟隆，吉。有它，吝。","枯楊生華，老婦得其士夫，無咎無譽。","過涉滅頂，兇。無咎。"],"","”大過“,大者過也。”棟撓“,本末弱也。剛過而中，巽而說，行。利有攸往，乃亨。”大過“之時大矣哉！","澤滅木，大過。君子以獨立不懼，遯世無悶。",["”藉用白茅“,柔在下也。","”老夫女妻，“,過以相與也。","”棟橈“之”兇“,不可以有輔也。","”棟隆之吉“,不橈乎下也。","”枯楊生華“,何可久也。”老婦士夫“,亦可醜也。","”過涉之兇“,不可咎也。"]],["有孚維心，亨。行有尚。",["習坎，入於坎，窞，兇。","坎有險，求小得。","來之坎，坎險且枕，入於坎，窞，勿用。","樽酒簋貳用缶，納約自牖，終無咎。","坎不盈，祗既平，無咎。","系用徽纆，窴於叢棘，三歲不得，兇。"],"","”習坎“,重險也。水流而不盈。行險而不失其信。維心亨，乃以剛中也。”行有尚“,往有功也。天險，不可升也。地險，山川丘陵也。王公設險以守其國。險之時用大矣哉！","水洊至，習坎。君子以常德行，習教事。",["”習坎入坎“,失道，兇也。","”求小得“,未出中也。","”來之坎坎“,終無功也。","”樽酒簋貳“,剛柔際也。","”坎不盈“,中未大也。","上六失道，兇三歲也。"]],["利貞。亨。畜牝牛吉。",["履錯然，敬之無咎。","黃離，元吉。","日昃之離，不鼓缶而歌，則大耋之嗟，兇。","突如，其來如，焚如，死如，棄如。","出涕沱若，戚嗟若，吉。","王用出徵，有嘉折首，獲匪其醜，無咎。"],"","離，麗也。日月麗乎天，百穀草木麗乎土。重明以麗乎正，乃化成天下。柔麗乎中正，故亨，是以”畜牝牛吉“也。","明兩作，離。大人以繼明照於四方。",["”履錯之敬“,以闢咎也。","”黃離元吉“,得中道也。","”日昃之離“,何可久也？","”突如其來如“,無所容也。","六五之吉，離王公也。","”王用出徵“,以正邦也。"]],["鹹：亨。利貞。取女吉。",["鹹其拇。","鹹其腓，兇。居吉。","鹹其股，執其隨，往吝。","貞吉。悔亡。憧憧往來，朋從爾思。","鹹其脢，無悔。","鹹其輔頰舌。"],"","鹹，感也。柔上而剛下，二氣感應以相與。止而說，男下女，是以“亨利貞，取女吉”也。天地感而萬物化生，聖人感人心而天下和平。觀其所感，而天地萬物之情可見矣。","山上有澤，鹹。君子以虛受人。",["“鹹其拇”,志在外也。","雖“兇居吉”,順不害也。","“鹹其股”,亦不處也。志在隨人，所執下也。","“貞吉悔亡”,未感害也。“憧憧往來”,未光大也。","“鹹其脢”,志末也。","“鹹其輔頰舌”,滕口說也。"]],["恆：亨。無咎。利貞。利有攸往。",["浚恆，貞兇，無攸利。","悔亡。","不恆其德，或承之羞，貞吝。","田無禽。","恆其德，貞，婦人吉，夫子兇。","振恆，兇。"],"","恆，久也。剛上而柔下。雷風相與，巽而動，剛柔皆應，恆。“恆亨無咎利貞”,久於其道也。天地之道恆久而不已也。“利有攸往”,終則有始也。日月得天而能久照，四時變化而能久成。聖人久於其道而天下化成。觀其所恆，而天地萬物之情可見矣。","雷風，恆。君子以立不易方。",["","九二“悔亡”,能久中也。","“不恆其德”,無所容也。","久非其位，安得禽也。","婦人貞吉，從一而終也。夫子制義，從婦兇也。","振恆在上，大無功也。"]],["亨。小利貞。",["遯尾，厲，勿用有攸往。","執之用黃牛之革，莫之勝說。","系遯，有疾厲，畜臣妾吉。","好遯，君子吉，小人否。","嘉遯，貞吉。","肥遯，無不利。"],"","“遯亨”,遯而亨也。剛當位而應，與時行也。“小利貞”,浸而長也。遯之時義大矣哉！","天下有山，遯。君子以遠小人，不惡而嚴。",["“遯尾”之“厲”,不往何災也？","“執用黃牛”,固志也。","“系遯”之“厲”,有疾憊也。“畜臣妾吉”,不可大事也。","“君子好遯，小人否”也。","“嘉遯貞吉”,以正志也。","“肥遯無不利”,無所疑也。"]],["利貞。",["壯於趾，徵兇，有孚。","貞吉。","小人用壯，君子用罔，貞厲。羝羊觸藩，羸其角。","貞吉，悔亡。藩決不羸，壯於大輿之輹。","喪羊於易，無悔。","羝羊觸藩，不能退，不能遂，無攸利，艱則吉。"],"","大壯，大者壯也。剛以動，故壯。“大壯利貞”,大者正也。正大，而天地之情可見矣。","雷在天上，大壯。君子以非禮弗履。",["“壯於趾”,其孚窮也。","九二“貞吉”,以中也。","“小人用壯”,君子以罔也。","“藩決不羸”,尚往也。","“喪羊於易”,位不當也。","“不能退，不能遂”,不詳也。“艱則吉”,咎不長也。"]],["康侯用錫馬蕃庶，晝日三接。",["晉如摧如，貞吉。罔孚，裕無咎。","晉如，愁如，貞吉。受茲介福於，其王母。","眾允，悔亡。","晉如鼫鼠，貞厲。","悔亡，失得，勿恤。往吉，無不利。","晉其角，維用伐邑，厲吉，無咎，貞吝。"],"","晉，進也，明出地上。順而麗乎大明，柔進而上行，是以“康侯用錫馬蕃庶，晝日三接”也。","明出地上，<晉>.君子以自昭明德。",["“晉如摧如”,獨行正也。“裕無咎”.未受命也。","“受茲介福”,以中正也。","“眾允”之志，上行也。","“鼫鼠貞厲”,位不當也。","“失得勿恤”,往有慶也。","“維用伐邑”,道未光也。"]],["利艱貞。",["明夷，于飛垂其翼。君子於行，三日不食。有攸往，主人有言。","明夷夷於左股，用拯馬壯，吉。","明夷於南狩，得其大首，不可疾貞。","入於左腹，獲明夷之心，於出門庭。","箕子之明夷，利貞。","不明，晦，初登於天，後入於地。"],"","明入地中，“明夷”.內文明而外柔順，以蒙大難，文王以之。“利艱貞”,晦其明也，內難而能正其志，箕子以之。","明入地中，“明夷”.君子以蒞眾用晦而明。",["“君子於行”,義不食也。","六二之吉，順以則也。","“南狩”之志，乃得大也。","“入於左腹”,獲心意也。","箕子之貞，明不可息也。","“初登於天”,照四國也。“後入天地”,失則也。"]],["利女貞。",["閒有家，悔亡。","無攸遂，在中饋，貞吉。","家人嗃々，悔厲吉；婦子嘻嘻，終吝。","富家，大吉。","王假有家，勿恤，吉。","有孚威如，終吉。"],"","家人，女正位乎內，男正位乎外。男女正，天地之大義也。家人有嚴君焉，父母之謂也。父父，子子，兄兄，弟弟，夫夫，婦婦，而家道正。正家而天下定矣。","風自火出，家人。君子以言有物而行有恆。",["“閒有家”,志未變也。","六二之吉，順以巽也。","“家人嗃々”,未失也。“婦子嘻嘻”,失家節也。","“富家大吉”,順在位也。","“王假有家”,交相愛也。","威如之吉，反身之謂也。"]],["小事吉。",["悔亡。喪馬勿逐自復。見惡人無咎。","遇主於巷，無咎。","見輿曳，其牛掣，其人天且劓，無初有終。","睽孤遇元夫，交孚，厲，無咎。","悔亡。厥宗噬膚，往何咎？","睽孤見豕負途，載鬼一車，先張之弧，後說之弧，匪寇，婚媾。往遇雨則吉。"],"","睽，火動而上，澤動而下。二女同居，其志不同行。說而麗乎明，柔進而上行，得中而應乎剛，是以小事吉。天地睽而其事同也。男女睽而其志通也。萬物睽而其事類也，睽之時用大矣哉！","上火下澤，睽。君子以同而異。",["“見惡人”,以闢咎也。","“遇主於巷”,未失道也。","“見輿曳”,位不當也。“無初有終”,遇剛也。","“交孚無咎”,志行也。","“厥宗噬膚”,往有慶也。","“遇雨之吉”,群疑亡也。"]],["利西南，不利東北。利見大人。貞吉。",["往蹇來譽。","王臣蹇蹇，匪躬之故。","往蹇來反。","往蹇來連。","大蹇朋來。","往蹇來碩，吉，利見大人。"],"","蹇，難也，險在前也。見險而能止，知矣哉！蹇，利西南“,往得中也。”不利東北“,其道窮也。”利見大人“,往有功也。當位”貞吉“,以正邦也。蹇之時用大矣哉！","山上有水，蹇。君子以反身修德。",["”往蹇來譽“,宜待也。","”王臣蹇蹇“,終無尤也。","”往蹇來反“,內喜之也。","”往蹇來連“,當位實也。","”大蹇朋來“,以中節也。","”往蹇來碩“,志在內也。”利見大人“,以從貴也。"]],["利西南。無所往，其來復吉。有攸往，夙吉。",["無咎。","田獲三狐，得黃矢，貞吉。","負且乘，致寇至，貞吝。","解而拇，朋至斯孚。","君子維有解，吉，有孚於小人。","公用射隼於高墉之上，獲之，無不利。"],"","解，險以動，動而免乎險，解。”解，利西南“,往得眾也。”其來復吉“,乃得中也。”有攸往夙吉。“,往有功也。天地解而雷雨作，雷雨作而百果草木皆甲坼。解之時大矣哉！","雷雨作，解。君子以赦過宥罪。",["剛柔之際，義無咎也。","九二貞吉，得中道也。","”負且乘“,亦可醜也。自我致戎，又誰咎也？","”解而拇“,未當位也。","君子有解，小人退也。","”公用射隼“,以解悖也。"]],["有孚，元吉，無咎。可貞，利有攸往。曷之用？二簋可用享。",["已事遄往，無咎。酌損之。","利貞。徵兇，弗損，益之。","三人行則損一人，一人行則得其友。","損其疾，使遄有喜，無咎。","或益之十朋之龜，弗克違，元吉。","弗損，益之，無咎，貞吉，利有攸往，得臣無家。"],"","損，損下益上，其道上行。損而有孚，元吉，無咎，可貞，利有攸往，曷之用？二簋可用享。二簋應有時。損剛益柔有時，損益盈虛，與時偕行。","山下有澤，損。君子以懲忿窒欲。",["”已事遄往“,尚合志也。","”九二利貞“,中以為志也。","”一人行“,”三“則疑也。","”損其疾“,亦可喜也。","六五元吉，自上佑也。","”弗損，益之“,大得志也。"]],["利有攸往。利涉大川。",["利用為大作，元吉，無咎。","或益之十朋之龜，弗克違。永貞吉。王用享於帝，吉。","益之用凶事，無咎。有孚。中行告公用圭。","中行告公，從，利用為依遷國。","有孚惠心，勿問，元吉。有孚，惠我德。","莫益之，或擊之，立心勿恆，兇。"],"","”益“,損上益下，民說無疆。自上下下，其道大光。”利有攸往“,中正有慶。”利涉大川“,木道乃行。益動而巽，日進無疆。天施地生，其益無方。凡益之道，與時偕行。","風雷，益。君子以見善則遷，有過則改。",["”元吉無咎“,下不厚事也。","”或益之“,自外來也。","”益用凶事“,固有之也。","”告公從“,以益志也。","”有孚惠心“,勿問之矣。”惠我德“,大得志也。","”莫益之“,偏辭也。”或擊之“,自外來也。"]],["揚於王庭，孚號。有厲，告自邑。不利即戎，利有攸往。",["壯於前趾，往不勝，為咎。","惕號，莫夜有戎，勿恤。","壯於頄，有兇。君子夬夬獨行，遇雨若濡，有慍無咎。","臀無膚，其行次且。牽羊悔亡，聞言不信。","莧陸夬夬中行，無咎。","無號，終有兇。"],"","”夬“,決也，剛決柔也。健而說，決而和。”揚於王庭“,柔乘五剛也。”孚號有厲“,其危乃光也。”告自邑，不利即戎“,所尚乃窮也。”利有攸往“,剛長乃終也。","澤上於天，夬。君子以施祿及下，居德則忌。",["不勝而往，咎也。","”有戎勿恤“,得中道也。","”君子夬夬“,終無咎也。","”其行次且“,位不當也。”聞言不信“,聰不明也。","”中行無咎“,中未光也。","”無號之兇“,終不可長也。"]],["女壯，勿用取女。",["繫於金柅，貞吉。有攸往，見兇，羸豕孚蹢躅。","包有魚，無咎，不利賓。","臀無膚，其行次且，厲，無大咎。","包無魚，起兇。","以杞包瓜，含章，有隕自天。","姤其角，吝，無咎。"],"","姤，遇也，柔遇剛也。勿用取女”,不可與長也。天地相遇，品物鹹章也。剛遇中正，天下大行也。姤之時義大矣哉！","天下有風，姤。後以施命誥四方。",["“繫於金柅”,柔道牽也。","“包有魚”,義不及賓也。","“其行次且”,行未牽也。","“無魚之兇”,遠民也。","九五含章，中正也。有隕自天，志不捨命也。","“姤其角”,上窮吝也。"]],["亨，王假有廟。利見大人。亨，利貞，用大牲吉。利有攸往。",["有孚不終，乃亂乃萃，若號，一握為笑，勿恤，往無咎。","引吉，無咎，孚乃利用禴。","萃如嗟如，無攸利，往無咎，小吝。","大吉無咎。","萃有位，無咎。匪孚，元永貞，悔亡。","齎諮涕洟，無咎。"],"","“萃”,聚也。順以說，剛中而應，故聚也。“王假有廟”,致孝享也。“利見大人亨”,聚以正也。“用大牲吉，利有攸往”,順天命也。觀其所聚，而天地萬物之情可見矣。","澤上於地，萃。君子以除戎器，戒不虞。",["“乃亂乃萃”,其志亂也。","“引吉無咎”,中未變也。","“往無咎”,上巽也。","“大吉無咎”,位不當也。","“萃有位”,志未光也。","“齎諮涕洟”,未安上也。"]],["元亨。用見大人，勿恤。南征吉。",["允升，大吉。","孚乃利用禴，無咎。","升虛邑。","王用亨於岐山，吉，無咎。","貞吉，升階。","冥升，利於不息之貞。"],"","柔以時升，巽而順，剛中而應，是以大亨，“用見大人勿恤”,有慶也。“南征吉”,志行也。","地中生木，升。君子以順德，積小以高大。",["“允升大吉”,上合志也。","九二之孚，有喜也。","“升虛邑”,無所疑也。","“王用亨於岐山”,順事也。","“貞吉升階”,大得志也。","冥升在上，消不富也。"]],["亨。貞大人吉，無咎。有言不信。",["臀困於株木，入於幽谷，三歲不覿。","困於酒食，朱紱方來。利用享祀。徵兇，無咎。","困於石，據於蒺藜，入於其宮，不見其妻，兇。","來徐徐，困於金車，吝，有終。","劓刖，困於赤紱，乃徐有說，利用祭祀。","困於葛藟，於臲卼，曰動悔有悔，徵吉。"],"","“困”,剛揜也。險以說，因而不失其所，亨，其唯君子乎。“貞大人吉”,以剛中也。“有言不信”,尚口乃窮也。","澤無水，困。君子以致命遂志。",["“入於幽谷”,幽不明也。","“困於酒食”,中有慶也。","“據於蒺藜”,乘剛也。“入於其宮，不見其妻”,不祥也。","“來徐徐”,志在下也。雖不當位，有與也。","“劓刖”,志未得也。“乃徐有說”,以中直也。“利用祭祀”,受福也。","“困於葛藟”,未當也。“動悔有悔”,吉行也。"]],["改邑不改井，無喪無得。往來井井。汔至，亦未繘井，羸其瓶，兇。",["井泥不食。舊井無禽。","井谷射鮒，甕敝漏。","井渫不食，為我心惻。可用汲，王明並受其福。","井甃，無咎。","井洌，寒泉食。","井收勿幕，有孚元吉。"],"","巽乎水而上水，井。井養而不窮也。“改邑不改井，”乃以剛中也。“汔至，亦未繘井”,未有功也。“羸其瓶”,是以兇也。","木上有水，井。君子以勞民勸相。",["“井泥不食”,下也。“舊井無禽”,時舍也。","“井谷射鮒”,無與也。","“井渫不食”,行惻也。求“王明”,受福也。","“井甃無咎”,修井也。","“寒泉之食”,中正也。","“元吉”在“上”,大成也。"]],["已日乃孚。元亨。利貞，悔亡。",["鞏用黃牛之革。","巳日乃革之，徵吉，無咎。","徵兇。貞厲。革言三就，有孚。","悔亡。有孚改命，吉。","大人虎變，未佔有孚。","君子豹變，小人革面，徵兇，居貞吉。"],"","革，水火相息，二女同居，其志不相得曰革。“已日乃孚”,革而信之。文明以說，大亨以正。革而當，其悔乃亡。天地革而四時成，湯武革命，順乎天而應乎人。革之時大矣哉！","澤中有火，革。君子以治歷明時。",["“鞏用黃牛”,不可以有為也。","“巳日革之”,行有嘉也。","“革言三就”,又何之矣。","“改命之吉”,信志也。","“大人虎變”,其文炳也。","“君子豹變”,其文蔚也。“小人革面”,順以從君也。"]],["元吉，亨。",["鼎顛趾，利出否。得妾以其子，無咎。","鼎有實，我仇有疾，不我能即，吉。","鼎耳革，其行塞，雉膏不食，方雨，虧悔，終吉。","鼎折足，覆公餗，其形渥，兇。","鼎黃耳金鉉，利貞。","鼎玉鉉，大吉，無不利。"],"","鼎，象也。以木巽火，亨飪也。聖人亨以享上帝，而大亨以養聖賢。巽而耳目聰明，柔進而上行，得中而應乎剛，是以元亨。","木上有火，鼎。君子以正位凝命。",["“鼎顛趾”,未悖也。“利出否”,以從貴也。","“鼎有實”,慎所之也。“我仇有疾”,終無尤也。","“鼎耳革”,失其義也。","“覆公餗”,信如何也。","“鼎黃耳”,中以為實也。","玉鉉在上，剛柔節也。"]],["亨。震來虩虩，笑言啞啞，震驚百里，不喪匕鬯。",["震來虩虩，後笑言啞啞，吉。","震來厲，億喪貝，躋於九陵，勿逐，七日得。","震蘇蘇，震行無眚。","震遂泥。","震往來，厲，意無喪，有事。","震索索，視矍矍，徵兇。震不於其躬，於其鄰，無咎。婚媾有言。"],"","震，亨。“震來虩虩”,恐致福也。“笑言啞啞”,後有則也。“震驚百里”,驚遠而懼邇也。“不喪匕鬯”,出可以守宗廟社稷，以為祭主也。","洊雷，震。君子以恐懼修省。",["“震來虩虩”,恐致福也。“笑言啞啞”,後有則也。","“震來厲”,乘剛也。","“震蘇蘇”,位不當也。","“震遂泥”,未光也。","“震往來厲”,危行也。其事在中，大無喪也。","“震索索”,中未得也。雖兇無咎，畏鄰戒也。"]],["艮其背，不獲其身，行其庭，不見其人，無咎。",["艮其趾，無咎。利永貞。","艮其腓，不拯其隨，其心不快。","艮其限，列其夤，厲，燻心。","艮其身，無咎。","艮其輔，言有序，悔亡。","敦艮，吉。"],"","艮，止也。時止則止，時行則行，動靜不失其時，其道光明。“艮其止”,止其所也。上下敵應，不相與也。是以“不獲其身，行其庭，不見其人，無咎”也。","兼山，艮。君子以思不出其位。",["“艮其趾”,未失正也。","“不拯其隨”,未退聽也。","“艮其限”,危燻心也。","“艮其身”,止諸躬也。","“艮其輔”,以中正也。","“敦艮之吉”,以厚終也。"]],["女歸吉，利貞。",["鴻漸於幹。小子厲，有言，無咎。","鴻漸於磐，飲食衎衎，吉。","鴻漸於陸。夫徵不復，婦孕不育，兇。利禦寇。","鴻漸於木，或得其桷，無咎。","鴻漸於陵，婦三歲不孕，終莫之勝，吉。","鴻漸於陸，其羽可用為儀，吉。"],"","漸之進也，女歸吉也。進得位，往有功也。進以正，可以正邦也。其位剛得中也。止而巽，動不窮也。","山上有木，漸。君子以居賢德善俗。",["“小子之厲”,義無咎也。","“飲食衎衎”,不素飽也。","“夫徵不復”,離群醜也。“婦孕不育”,失其道也。“利用禦寇”,順相保也。","“或得其桷”,順以巽也。","“終莫之勝吉”,得所願也。","“其羽可用為儀，吉”,不可亂也。"]],["徵兇，無攸利。",["歸妹以娣。跛能履，徵吉。","眇能視，利幽人之貞。","歸妹以須，反歸以娣。","歸妹愆期，遲歸有時。","帝乙歸妹，其君之袂不如其娣之袂良。月幾望，吉。","女承筐無實，士刲羊無血，無攸利。"],"","歸妹，天地之大義也。天地不交而萬物不興。歸妹，人之終始也。說以動，所歸妹也。“徵兇”,位不當也。“無攸利”,柔乘剛也。","澤上有雷，歸妹。君子以永終知敝。",["“歸妹以娣”,以恆也。“跛能履吉”,相承也。","“利幽人之貞”,未變常也。","“歸妹以須”,未當也。","","“帝乙歸妹，不如其娣之袂良”也。其位在中，以貴行也。","上六無實，承虛筐也。"]],["亨，王假之。勿憂，宜日中。",["遇其配主，雖旬無咎，往有尚。","豐其蔀，日中見鬥。往得疑疾，有孚發若，吉。","豐其沛，日中見沫，折其右肱，無咎。","豐其蔀，日中見鬥，遇其夷主，吉。","來章有慶譽，吉。","豐其屋，蔀其家，窺其戶，闃其無人，三歲不覿，兇。"],"","豐，大也。明以動，故豐。“王假之”,尚大也。“勿憂宜日中”,宜照天下也。日中則昃，月盈則食，天地盈虛，與時消息，而況於人乎，況於鬼神乎？","雷電皆至，豐。君子以折獄致刑。",["“雖旬無咎”,過旬災也。","“有孚發若”,信以發志也。","“豐其沛”,不可大事也。“折其右肱”,終不可用也。","“豐其蔀”,位不當也。“日中見鬥”,幽不明也。“遇其夷主”,吉行也。","六五之吉，有慶也。","“豐其屋”,天際翔也。“窺其戶，闃其無人”,自藏也。"]],["小亨。旅貞吉。",["旅瑣瑣，斯其所取災。","旅即次，懷其資，得童僕，貞。","旅焚其次，喪其童僕，貞厲。","旅於處，得其資斧，我心不快。","射雉，一矢亡，終以譽命。","鳥焚其巢，旅人先笑後號咷。喪牛於易，兇。"],"","“旅小亨”,柔得中乎外，而順乎剛，止而麗乎明，是以“小亨旅貞吉”也。旅之時義大矣哉！","山上有火，旅。君子以明慎用刑而不留獄。",["“旅瑣瑣”,志窮災也。","“得童僕貞”,終無尤也。","“旅焚其次”,亦以傷矣。以旅與下，其義喪也。","“旅於處”,未得位也。“得其資斧”,心未快也。","“終以譽命”,上逮也。","以旅在上，其義焚也。“喪牛於易”,終莫之聞也。"]],["小亨。利有攸往。利見大人。",["進退，利武人之貞。","巽在床下，用史巫紛若，吉，無咎。","頻巽，吝。","悔亡，田獲三品。","貞吉，悔亡，無不利，無初有終。先庚三日，後庚三日，吉。","巽在床下，喪其資斧，貞兇。"],"","重巽以申命。剛巽乎中正而志行。柔皆順乎剛，是以“小亨，利有攸往，利見大人”.","隨風，巽。君子以申命行事。",["“進退”,志疑也。“利武人之貞”,志治也。","“紛若之吉”,得中也。","“頻巽之吝”,志窮也。","“田獲三品”,有功也。","九五之吉，位正中也。","“巽在床下”,上窮也。“喪其資斧”,正乎兇也。"]],["亨。利貞。",["和兌，吉。","孚兌，吉，悔亡。","來兌，兇。","商兌未寧，介疾有喜。","孚於剝，有厲。","引兌。"],"","兌，說也。剛中而柔外，說以利貞，是以順乎天而應乎人。說以先民，民忘其勞。說以犯 難，民忘其死。說之大，民勸矣哉！","麗澤，兌。君子以朋友講習。",["“和兌之吉”,行未疑也。","“孚兌之吉”,信志也。","“來兌之兇”,位不當也。","“九四之喜”,有慶也。","“孚於剝”,位正當也。","上六“引兌”,未光也。"]],["亨。王假有廟。利涉大川，利貞。",["用拯馬壯，吉。","渙奔其機，悔亡。","渙其躬，無悔。","渙其群，元吉。渙有丘，匪夷所思。","渙汗其大號，渙王居，無咎。","渙其血，去逖出，無咎。"],"","“渙，亨”,剛來而不窮，柔得位乎外而上同。“王假有廟”,王乃在中也。“利涉大川”,乘木有功也。","風行水上，渙。先王以享於帝，立廟。",["初六之吉順也。","“渙奔其機”,得願也。","“渙其躬”,志在外也。","“渙其群元吉”,光大也。","“王居無咎”,正位也。","“渙其血”,遠害也。"]],["亨。苦節，不可貞。",["不出戶庭，無咎。","不出門庭，兇。","不節若，則嗟若，無咎。","安節。亨。","甘節，吉，往有尚。","苦節，貞兇，悔亡。"],"","“節亨”.剛柔分而剛得中。“苦節不可貞”,其道窮也。說以行險，當位以節，中正以通。天地節而四時成。節以制度，不傷財，不害民。","澤上有水，節。君子以制數度，議德行。",["“不出戶庭”,知通塞也。","“不出門庭兇”,失時極也。","“不節之嗟”,又誰咎也。","“安節之亨”,承上道也。","“甘節之吉”,居位中也。","“苦節貞兇”,其道窮也。"]],["豚魚，吉。利涉大川，利貞。",["  const info=yy=>{const lo=trig(yy.slice(0,3)),up=trig(yy.slice(3));return{i:hexOf(up[0].split('|')[0],lo[0].split('|')[0]),lo,up}},a=info(y),mv=ls.map((v,k)=>v==6||v==9?k:-1).filter(k=>k>=0),ch=mv.length,b=ch?info(y2):null,A=YJ[a.i],B=b&&YJ[b.i],un=[0,1,2,3,4,5].filter(k=>!mv.includes(k));
 const nm=i=>`${T('第|No. ')}${i+1}${T('卦|')} ${HN[i]}${L=='en'?' – '+HE[i]:''}`,ln=(k,yang)=>k==0?'初'+(yang?'九':'六'):k==5?'上'+(yang?'九':'六'):(yang?'九':'六')+'二三四五'[k-1];

 if(ch==0){rule='無變爻：以本卦卦辭為斷。|No changing lines: read the primary hexagram\'s judgment.';it=[[T('本卦卦辭|Judgment')+' '+HN[a.i],A[0],'']]}

 else if(ch==3){rule='三爻變：合看本卦與之卦的卦辭，本卦（貞）為主、之卦（悔）為輔。|Three changing lines: read both judgments; the primary (貞) leads, the changed (悔) supports.';it=[[T('本卦卦辭|Primary judgment')+' '+HN[a.i],A[0],''],[T('之卦卦辭|Changed judgment')+' '+HN[b.i],B[0],'']]}
 else if(ch==4){rule='四爻變：以之卦兩個不變爻的爻辭為斷，以下爻為主。|Four changing lines: read the two unchanged lines of the changed hexagram; the lower one leads.';it=un.map(k=>L1(B,b.i,y2,k))}
 else if(ch==5){rule='五爻變：以之卦唯一不變爻的爻辭為斷。|Five changing lines: read the one unchanged line of the changed hexagram.';it=[L1(B,b.i,y2,un[0])]}
